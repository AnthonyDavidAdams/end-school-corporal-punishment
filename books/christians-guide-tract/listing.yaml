description_html: |
  <p><b>A former minister reads the rod verses honestly, then asks what the same Bible says about judging any discipline: by its fruit.</b></p>
  <p>In seventeen states a public school employee may still paddle a child, and the people who decide whether that continues are, in most of those districts, people who pray before the meeting. This tract was written for them: pastors, Sunday school teachers, church members, and the believer who sits on a school board.</p>
  <p>It quotes every rod verse in Proverbs, in the King James, and does not pretend they say something else. Then it does what scripture itself asks. Hebrews 12:11 says chastening is judged by the fruit it yields afterward. Matthew 7 says ye shall know them by their fruits. First Thessalonians says prove all things. So the book looks at the fruit: seventy-five studies of more than one hundred and sixty thousand children, the school studies, the children who were paddled and grew up. Every figure is tied to a verified source. Every church position was read at the church's own site, including the Presbyterian vote of three hundred thirty-four to three hundred six.</p>
  <p>Thirty-two pages, pocket sized, a drawn scene facing every idea, and a page at the end written to be read aloud in under three minutes. It closes on the one sentence more than eleven hundred school boards in the permitting states have already adopted.</p>
  <p>The first of the Safe Schools Guides. Text released under Creative Commons Attribution 4.0: copy it, print it, hand it out.</p>

