# Wrap cover for the tract: 4 x 6, 32 pages, cream (spine 0.08 in, no spine text under 79 pages).
# Front art is generated by tools/panels.py cover (GPT Image 2, lettered by the model, the cast
# sheet attached), upscaled 2x with Pillow, proofread with kdp-cover/proofread_cover.py, then
# passed to build_cover.py with --art, so front.overlay_text is off.
paper: cream

front:
  model: fal-ai/gpt-image-2/edit
  overlay_text: false
  prompt: see panels.yaml `cover`

spine:
  bg_color: "#faebc5"     # the cream ground sampled from the front art
  text_color: "#1f3d2b"

back:
  bg_color: "#faebc5"
  text_color: "#1f3d2b"
  barcode_clearance_in: 1.6
  quote: |
    By scripture's own test, the paddle fails.
  blurb: |
    A former minister reads the rod verses honestly, then asks what the same Bible says about judging any discipline: by its fruit.

    Written for pastors, Sunday school teachers, church members, and the believer on a school board in one of the seventeen states where a public school employee may still paddle a child. Every verse in the King James. Every figure tied to a verified source. Every church position read at the church's own site.

    The first of the Safe Schools Guides. The model policy, the board motion and the ninety-day transition are in the Safe Discipline Program kit, free at earthpilot.org/kids/kit/, or scan the code.
  # A 4 in back cover has no room for copy beside the code once KDP's barcode zone is reserved,
  # so the kit line lives in the blurb and the code stands alone.
  cta:
    url: "https://earthpilot.org/kids/kit/"
    qr_size_in: 0.8
