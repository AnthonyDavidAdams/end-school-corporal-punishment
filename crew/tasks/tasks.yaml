# The End School Corporal Punishment task queue, in Ground Crew form. Mirrors tasks/README.md in the campaign
# repository. Schema paths are finding schemas in this directory's schemas/; skill paths resolve through the
# skills/ symlink that link.sh creates to the campaign's skills.
tasks:
  - id: district-policy-scan
    title: District policy scan
    description: For a state, find every public school district, locate its corporal punishment policy, and record status, source URL, verbatim quote, policy code, and (while the handbook is open) the phone, AI, and bell-schedule rules.
    unit: One district. Every scope is a district the Mothership could not finish; get_worklist returns what was already read and what is wanted.
    output: Entries in data/districts/<XX>.yaml
    priority: 1
    schema: schemas/district-finding.schema.json
    skill: skills/district-policy-scan/SKILL.md
    collection: districts
    scopes: ["The Paideia Academies Inc (91250), AZ", "MCCOMB SCHOOL DISTRICT, MS", "State Charter Schools II- Pataula Charter Academy, GA", "Bibb County, AL", "EMERSON-TAYLOR SCHOOL DISTRICT, AR", "SOPER, OK", "Dublin City, GA", "Brantley County, GA", "BERNIE R-XIII, MO", "DONIPHAN R-I, MO", "Wayne County, TN", "EAST POINSETT CO. SCHOOL DIST., AR", "Emanuel County, GA", "SANKOFA MIDDLE SCHL (CHARTER), OK", "COLCORD, OK", "MAYNARD SCHOOL DISTRICT, AR", "MCDONALD CO. R-I, MO", "DENISON, OK", "WRIGHT CITY, OK", "OKLAHOMA UNION, OK", "Polk County, TN", "MANILA SCHOOL DISTRICT, AR", "SOUTH PIKE COUNTY SCHOOL DISTRICT, AR", "SALEM SCHOOL DISTRICT, AR", "AMORY SCHOOL DIST, MS", "HOLLANDALE SCHOOL DIST, MS", "NEWPORT SCHOOL DISTRICT, AR", "BLYTHEVILLE SCHOOL DISTRICT, AR", "ANTLERS, OK", "HOLLY CREEK, OK", "Calhoun County, GA", "WOODLAND R-IV, MO", "VELMA-ALMA, OK", "Decatur County, TN", "MOUNT IDA SCHOOL DISTRICT, AR", "CADDO HILLS SCHOOL DISTRICT, AR", "CALICO ROCK SCHOOL DISTRICT, AR", "WEST SIDE SCHOOL DISTRICT, AR", "TWIN RIVERS R-X, MO", "VINITA, OK", "CLEARWATER R-I, MO", "WISTER, OK", "GLEN ROSE SCHOOL DISTRICT, AR", "Tattnall County, GA", "Telfair County, GA", "BLOOMFIELD R-XIV, MO", "MEADOW HEIGHTS R-II, MO", "HAILEYVILLE, OK", "MARKED TREE SCHOOL DISTRICT, AR", "OZARK SCHOOL DISTRICT, AR", "Candler County, GA", "JACKSONVILLE NORTH PULASKI SCHOOL DISTRICT, AR", "MINERAL SPRINGS SCHOOL DIST., AR", "RICHARDS R-V, MO", "LAMAR SCHOOL DISTRICT, AR", "State Charter Schools II- Genesis Innovation Academy for Bo, GA", "BROOKHAVEN SCHOOL DIST, MS", "HODGEN, OK", "BUFFALO IS. CENTRAL SCH. DIST., AR", "FLETCHER, OK", "MCCURTAIN, OK", "BAUXITE SCHOOL DISTRICT, AR", "DECATUR SCHOOL DISTRICT, AR", "DOVER SCHOOL DISTRICT, AR", "Richard City, TN", "IZARD CO. CONS. SCHOOL DIST., AR", "BRADFORD SCHOOL DISTRICT, AR", "CENTERPOINT SCHOOL DISTRICT, AR", "OLUSTEE-ELDORADO, OK", "HENRYETTA, OK", "TURNER, OK", "Chester County, TN", "Cumberland County, TN", "BISMARCK SCHOOL DISTRICT, AR", "OMAHA SCHOOL DISTRICT, AR", "State Charter Schools II- Spring Creek Charter Academy, GA", "Burke County, GA", "ADAIR, OK", "BARNSDALL, OK", "CALVIN, OK", "LUKFATA, OK", "PADEN, OK", "SWEETWATER, OK", "BROOKLAND SCHOOL DISTRICT, AR", "WHITE CO. CENTRAL SCHOOL DIST., AR", "DERMOTT SCHOOL DISTRICT, AR", "CANEY, OK", "COALGATE, OK", "GLOVER, OK", "LONE STAR, OK", "PLAINVIEW, OK", "Union City, TN", "HARMONY GROVE SCHOOL DISTRICT, AR", "MAGAZINE SCHOOL DISTRICT, AR", "HAYTI R-II, MO", "BENNINGTON, OK", "POTEAU, OK", "VIAN, OK", "Sequatchie County, TN", "Chambers County, AL", "MANSFIELD SCHOOL DISTRICT, AR", "Wayne County, GA", "Vernon Parish, LA", "SCOTT CO. CENTRAL, MO", "NORWOOD R-I, MO", "CHEYENNE, OK", "DEPEW, OK", "LONE WOLF, OK", "VARNUM, OK", "WESTSIDE CONS. SCHOOL DISTRICT, AR", "MONTICELLO SCHOOL DISTRICT, AR", "Bacon County, GA", "OKOLONA SEPARATE SCHOOL DIST, MS", "SKYLINE R-II, MO", "NAYLOR R-II, MO", "BATTIEST, OK", "EMPIRE, OK", "MOYERS, OK", "TEXHOMA, OK", "TWIN HILLS, OK", "BINGER-ONEY, OK", "KNOX CITY-O'BRIEN CISD, TX", "MARION SCHOOL DISTRICT, AR", "PARKERS CHAPEL SCHOOL DIST., AR", "GAINESVILLE R-V, MO", "ZALMA R-V, MO", "SOUTH COFFEYVILLE, OK", "WILSON, OK", "Etowah, TN", "COUNTY LINE SCHOOL DISTRICT, AR", "GURDON SCHOOL DISTRICT, AR", "ROSE BUD SCHOOL DISTRICT, AR", "ST. JOHNS, FL", "UNION, FL", "SCOTT CO. R-IV, MO", "EL DORADO SPRINGS R-II, MO", "GIDEON 37, MO", "THOMAS-FAY-CUSTER UNIFIED DIST, OK", "ALEX, OK", "FORT SUPPLY, OK", "LONE GROVE, OK", "MCCORD, OK", "SPRINGER, OK", "TALOGA, OK", "WAGONER, OK"]
    done_means:
      - Every non-unknown status has source, quote, and last_verified.
      - Notes say what was searched for every unknown.
      - The quote is the sentence that establishes the status, copied verbatim.

  - id: crdc-refresh
    title: CRDC refresh
    description: Download a Civil Rights Data Collection release from the Department of Education and regenerate the corporal punishment extracts and the headline claims.
    unit: One CRDC release year
    output: data/crdc/<year>/ state and district CSVs plus facts/ figure updates
    priority: 1
    schema: schemas/crdc-refresh-finding.schema.json
    skill: skills/crdc-refresh/SKILL.md
    collection: crdc
    scopes: ["2017-18", "2020-21", "2021-22", "2023-24"]
    done_means:
      - SOURCE.md names the exact file, download date, and SHA-256.
      - Superseded claims are retired with superseded_by.

  - id: verify-claim
    title: Verify a claim
    description: Open the primary source for a `reported` claim and upgrade it to `verified`, or mark it `disputed` with reasons.
    unit: One claim file
    output: facts/claims/<id>.md with status verified or disputed
    priority: 2
    schema: schemas/claim.schema.json
    skill: skills/verify-claim/SKILL.md
    collection: claims
    done_means:
      - The primary source was opened and the claim sentence matches it.
      - last_verified is today and verified_by names the agent and the person.

  - id: bill-watch
    title: Bill watch
    description: Find every corporal punishment bill, rule, or board action in one state's current legislative session and record it.
    unit: One state, current session
    output: bills entries in data/states/<XX>.yaml
    priority: 2
    schema: schemas/bill-finding.schema.json
    skill: skills/bill-watch/SKILL.md
    collection: states
    scopes: [AL, AR, AZ, FL, GA, IN, KS, KY, LA, MO, MS, NC, OK, SC, TN, TX, WY]
    done_means:
      - Every bill has number, session, status, and the official URL.
      - Bills that would expand or protect corporal punishment are included and marked.

  - id: decision-maker-dossier
    title: Decision-maker dossier
    description: For a school board or a state education committee, record each member's public position and votes on corporal punishment, their own stated values, and their self-stated public affiliations, with sources. Public record only.
    unit: One school board, or one state's education committees
    output: crm/dossiers/<XX>/<body>.yaml
    priority: 3
    schema: schemas/dossier-finding.schema.json
    skill: skills/decision-maker-dossier/SKILL.md
    collection: dossiers
    done_means:
      - Every item has a URL a member would expect the public to read.
      - Nothing about family, home, health, finances, or private accounts.
      - position_on_cp is unknown unless an evidence line justifies otherwise.

  - id: share-kit
    title: Share kit
    description: Produce the text and image for one state's share kit from verified claims and that state's district data.
    unit: One state
    output: share/<XX>/
    priority: 4
    schema: schemas/share-kit-finding.schema.json
    skill: skills/share-kit/SKILL.md
    collection: share
    scopes: [AL, AR, AZ, FL, GA, IN, KS, KY, LA, MO, MS, NC, OK, SC, TN, TX, WY]
    done_means:
      - Every number in the kit is a verified claim id.

  - id: training-review
    title: Training review
    description: Review one module of the open replacement curriculum against the evidence in facts/ and training/evidence.md, checking every citation.
    unit: One module in training/modules/
    output: A review with each citation checked
    priority: 3
    schema: schemas/training-review-finding.schema.json
    collection: training-reviews
    done_means:
      - Every citation in the module was opened and is marked ok or not, with a note.

  - id: contact-capture
    title: Find a district's published contact
    description: >
      For a district already in the record, find the contact it publishes for the public and record it:
      the general or superintendent's office email, the board or board clerk email, the phone and
      mailing address, the superintendent's name, the board page, and how the public signs up to speak
      at a meeting. Public record only. This is what stands between the record and being able to write
      to a district about its own policy, and it is cheap when someone is already on the site and
      expensive to go back for.
    unit: One state's already-scanned districts
    output: contact blocks in data/districts/<XX>.yaml
    priority: 1
    schema: schemas/district-finding.schema.json
    collection: districts
    scopes: [AL, AR, FL, GA, MO, MS, OK, TN, TX]
    done_means:
      - Every field is a page the district publishes for the public, with contact_page recording where it was read.
      - Nothing is a personal address, a staff member who is not the published point of contact, or anything behind a login.
      - A district that publishes only a web form says so, rather than getting a guessed address.

  - id: date-the-change
    title: Date a district's decision
    description: >
      For a district whose policy prohibits corporal punishment but prints no adoption or revision date,
      find the date its board acted, from board minutes, an agenda, or a dated policy manual. This is
      the difference between "they never did" and "they stopped", and only the second is an example
      another board can be shown.
    unit: One district
    output: policy_adopted / policy_revised in data/districts/<XX>.yaml
    priority: 2
    schema: schemas/district-finding.schema.json
    collection: districts
    done_means:
      - The date comes from a document the board itself published, not from a news report.
      - policy_dates_from is set to policy, and the source is recorded.
      - A district whose minutes are not published online is filed as still undated, with what was searched.

  - id: recover-blocked-source
    title: Recover a source the server cannot read
    description: >
      Some districts publish their policy behind a vendor wall the project server cannot get through --
      a JavaScript-only policy portal, a scanned PDF with no text layer, a .docx the extractor cannot
      parse. Open it yourself, quote the policy verbatim, and resubmit with source_text attached so a
      reviewer can confirm it. crew/notes/blocked-sites.md has what is already known about each vendor.
    unit: One district, or one vendor's districts
    output: Entries in data/districts/<XX>.yaml with source_text
    priority: 2
    schema: schemas/district-finding.schema.json
    collection: districts
    scopes: ["CHARLESTON R-I, MO", "HOLCOMB R-III, MO", "BROKEN BOW, OK", "PUXICO R-VIII, MO", "DES ARC SCHOOL DISTRICT, AR", "JACKSON CO. SCHOOL DISTRICT, AR", "WINONA R-III, MO", "HAMBURG SCHOOL DISTRICT, AR", "PANGBURN SCHOOL DISTRICT, AR", "OSCEOLA SCHOOL DISTRICT, AR", "WONDERVIEW SCHOOL DISTRICT, AR", "White County, TN", "JASPER SCHOOL DISTRICT, AR", "DUMAS SCHOOL DISTRICT, AR", "Hardin County, TN", "EDGEWOOD ISD, TX", "NORFORK SCHOOL DISTRICT, AR", "MULBERRY/PLEASANT VIEW BI-COUNTY SCHOOL DISTRICT, AR", "GLENCOE, OK", "Escambia County, AL", "BUNKER R-III, MO", "HOWE, OK", "NEELYVILLE R-IV, MO", "SOUTHERN REYNOLDS CO. R-II, MO", "NEW LIMA, OK", "Hollow Rock - Bruceton, TN", "YAZOO CITY MUNICIPAL SCHOOL DIST, MS", "CASSVILLE R-IV, MO", "ALPENA SCHOOL DISTRICT, AR", "HORATIO SCHOOL DISTRICT, AR", "BAY SCHOOL DISTRICT, AR", "SOUTH SIDE SCHOOL DISTRICT, AR", "MOUNTAIN VIEW-BIRCH TREE R-III, MO", "SOUTHWEST R-V, MO", "WEST PLAINS R-VII, MO", "GREEN FOREST R-II, MO", "BRAY-DOYLE, OK", "Meigs County, TN", "Leeds City, AL", "OZARK MOUNTAIN SCHOOL DISTRICT, AR", "BAKERSFIELD R-IV, MO", "LINDSAY, OK", "SHADY POINT, OK", "Fentress County, TN", "RIVERSIDE SCHOOL DISTRICT, AR", "PERRYVILLE SCHOOL DISTRICT, AR", "OAK RIDGE R-VI, MO", "SOUTH IRON CO. R-I, MO", "BUFFALO VALLEY, OK", "GRAND VIEW, OK", "MARYETTA, OK", "Humphreys County, TN", "CONCORD SCHOOL DISTRICT, AR", "ADVANCE R-IV, MO", "AVANT, OK", "LEACH, OK", "VICI, OK"]
    done_means:
      - The policy text is attached verbatim, with the page or section it came from.
      - Notes say which wall it was and what was tried through the shared tools first.
      - Anything learned about the vendor is added to crew/notes/blocked-sites.md.
