# The End School Corporal Punishment task queue, in Ground Crew form. Mirrors tasks/README.md in the campaign
# repository. Schema paths are finding schemas in this directory's schemas/; skill paths resolve through the
# skills/ symlink that link.sh creates to the campaign's skills.
tasks:
  - id: district-policy-scan
    title: District policy scan
    description: For a state, find every public school district, locate its corporal punishment policy, and record status, source URL, verbatim quote, policy code, and (while the handbook is open) the phone, AI, and bell-schedule rules.
    unit: One district. Every scope is a district the Mothership could not finish; get_worklist returns what was already read and what is wanted.
    output: Entries in data/districts/<XX>.yaml
    priority: 1
    schema: schemas/district-finding.schema.json
    skill: skills/district-policy-scan/SKILL.md
    collection: districts
    scopes: ["OK: districts 1-10", "MO: districts 1-10", "KS: districts 1-10", "TN: districts 1-10", "IN: districts 1-10", "GA: districts 1-10", "AR: districts 1-10", "LA: districts 1-10", "AL: districts 1-10", "FL: districts 1-10", "WY: districts 1-10", "NC: districts 1-10", "SC: districts 1-10", MS, KY, AZ, "OK: districts 11-20", "MO: districts 11-20", "KS: districts 11-20", "TN: districts 11-20", "IN: districts 11-20", "GA: districts 11-20", "AR: districts 11-20", "LA: districts 11-20", "AL: districts 11-20", "FL: districts 11-19", "WY: districts 11-14", "NC: districts 11-13", "SC: districts 11-12", "OK: districts 21-30", "MO: districts 21-30", "KS: districts 21-30", "TN: districts 21-30", "IN: districts 21-30", "GA: districts 21-30", "AR: districts 21-30", "LA: districts 21-28", "AL: districts 21-21", "OK: districts 31-40", "MO: districts 31-40", "KS: districts 31-40", "TN: districts 31-40", "IN: districts 31-39", "GA: districts 31-38", "OK: districts 41-50", "MO: districts 41-50", "KS: districts 41-50", "TN: districts 41-42", "OK: districts 51-60", "MO: districts 51-60", "KS: districts 51-60", "OK: districts 61-70", "MO: districts 61-70", "KS: districts 61-70", "OK: districts 71-80", "MO: districts 71-80", "KS: districts 71-75", "OK: districts 81-90", "MO: districts 81-85", "OK: districts 91-100", "OK: districts 101-110", "OK: districts 111-120", "OK: districts 121-130", "OK: districts 131-134"]
    done_means:
      - Every non-unknown status has source, quote, and last_verified.
      - Notes say what was searched for every unknown.
      - The quote is the sentence that establishes the status, copied verbatim.

  - id: crdc-refresh
    title: CRDC refresh
    description: Download a Civil Rights Data Collection release from the Department of Education and regenerate the corporal punishment extracts and the headline claims.
    unit: One CRDC release year
    output: data/crdc/<year>/ state and district CSVs plus facts/ figure updates
    priority: 1
    schema: schemas/crdc-refresh-finding.schema.json
    skill: skills/crdc-refresh/SKILL.md
    collection: crdc
    scopes: ["2017-18", "2020-21", "2021-22", "2023-24"]
    done_means:
      - SOURCE.md names the exact file, download date, and SHA-256.
      - Superseded claims are retired with superseded_by.

  - id: verify-claim
    title: Verify a claim
    description: Open the primary source for a `reported` claim and upgrade it to `verified`, or mark it `disputed` with reasons.
    unit: One claim file
    output: facts/claims/<id>.md with status verified or disputed
    priority: 2
    schema: schemas/claim.schema.json
    skill: skills/verify-claim/SKILL.md
    collection: claims
    done_means:
      - The primary source was opened and the claim sentence matches it.
      - last_verified is today and verified_by names the agent and the person.

  - id: bill-watch
    title: Bill watch
    description: Find every corporal punishment bill, rule, or board action in one state's current legislative session and record it.
    unit: One state, current session
    output: bills entries in data/states/<XX>.yaml
    priority: 2
    schema: schemas/bill-finding.schema.json
    skill: skills/bill-watch/SKILL.md
    collection: states
    scopes: [AL, AR, AZ, FL, GA, IN, KS, KY, LA, MO, MS, NC, OK, SC, TN, TX, WY]
    done_means:
      - Every bill has number, session, status, and the official URL.
      - Bills that would expand or protect corporal punishment are included and marked.

  - id: decision-maker-dossier
    title: Decision-maker dossier
    description: For a school board or a state education committee, record each member's public position and votes on corporal punishment, their own stated values, and their self-stated public affiliations, with sources. Public record only.
    unit: One school board, or one state's education committees
    output: crm/dossiers/<XX>/<body>.yaml
    priority: 3
    schema: schemas/dossier-finding.schema.json
    skill: skills/decision-maker-dossier/SKILL.md
    collection: dossiers
    done_means:
      - Every item has a URL a member would expect the public to read.
      - Nothing about family, home, health, finances, or private accounts.
      - position_on_cp is unknown unless an evidence line justifies otherwise.

  - id: share-kit
    title: Share kit
    description: Produce the text and image for one state's share kit from verified claims and that state's district data.
    unit: One state
    output: share/<XX>/
    priority: 4
    schema: schemas/share-kit-finding.schema.json
    skill: skills/share-kit/SKILL.md
    collection: share
    scopes: [AL, AR, AZ, FL, GA, IN, KS, KY, LA, MO, MS, NC, OK, SC, TN, TX, WY]
    done_means:
      - Every number in the kit is a verified claim id.

  - id: training-review
    title: Training review
    description: Review one module of the open replacement curriculum against the evidence in facts/ and training/evidence.md, checking every citation.
    unit: One module in training/modules/
    output: A review with each citation checked
    priority: 3
    schema: schemas/training-review-finding.schema.json
    collection: training-reviews
    done_means:
      - Every citation in the module was opened and is marked ok or not, with a note.

  - id: contact-capture
    title: Find a district's published contact
    description: >
      For a district already in the record, find the contact it publishes for the public and record it:
      the general or superintendent's office email, the board or board clerk email, the phone and
      mailing address, the superintendent's name, the board page, and how the public signs up to speak
      at a meeting. Public record only. This is what stands between the record and being able to write
      to a district about its own policy, and it is cheap when someone is already on the site and
      expensive to go back for.
    unit: One state's already-scanned districts
    output: contact blocks in data/districts/<XX>.yaml
    priority: 1
    schema: schemas/district-finding.schema.json
    collection: districts
    scopes: [AL, AR, FL, GA, MO, MS, OK, TN, TX, "BLYTHEVILLE SCHOOL DISTRICT, AR (address bounced: find the superintendent's current office email)", "Hickman County, TN (address bounced: find the superintendent's current office email)"]
    done_means:
      - Every field is a page the district publishes for the public, with contact_page recording where it was read.
      - Nothing is a personal address, a staff member who is not the published point of contact, or anything behind a login.
      - A district that publishes only a web form says so, rather than getting a guessed address.

  - id: date-the-change
    title: Date a district's decision
    description: >
      For a district whose policy prohibits corporal punishment but prints no adoption or revision date,
      find the date its board acted, from board minutes, an agenda, or a dated policy manual. This is
      the difference between "they never did" and "they stopped", and only the second is an example
      another board can be shown.
    unit: One district
    output: policy_adopted / policy_revised in data/districts/<XX>.yaml
    priority: 2
    schema: schemas/district-finding.schema.json
    collection: districts
    done_means:
      - The date comes from a document the board itself published, not from a news report.
      - policy_dates_from is set to policy, and the source is recorded.
      - A district whose minutes are not published online is filed as still undated, with what was searched.

  - id: recover-blocked-source
    title: Recover a source the server cannot read
    description: >
      Some districts publish their policy behind a vendor wall the project server cannot get through --
      a JavaScript-only policy portal, a scanned PDF with no text layer, a .docx the extractor cannot
      parse. Open it yourself, quote the policy verbatim, and resubmit with source_text attached so a
      reviewer can confirm it. crew/notes/blocked-sites.md has what is already known about each vendor.
    unit: One district, or one vendor's districts
    output: Entries in data/districts/<XX>.yaml with source_text
    priority: 2
    schema: schemas/district-finding.schema.json
    collection: districts
    scopes: ["CHARLESTON R-I, MO", "HOLCOMB R-III, MO", "BROKEN BOW, OK", "PUXICO R-VIII, MO", "DES ARC SCHOOL DISTRICT, AR", "JACKSON CO. SCHOOL DISTRICT, AR", "WINONA R-III, MO", "HAMBURG SCHOOL DISTRICT, AR", "PANGBURN SCHOOL DISTRICT, AR", "OSCEOLA SCHOOL DISTRICT, AR", "WONDERVIEW SCHOOL DISTRICT, AR", "White County, TN", "JASPER SCHOOL DISTRICT, AR", "DUMAS SCHOOL DISTRICT, AR", "Hardin County, TN", "EDGEWOOD ISD, TX", "NORFORK SCHOOL DISTRICT, AR", "MULBERRY/PLEASANT VIEW BI-COUNTY SCHOOL DISTRICT, AR", "GLENCOE, OK", "Escambia County, AL", "BUNKER R-III, MO", "HOWE, OK", "NEELYVILLE R-IV, MO", "SOUTHERN REYNOLDS CO. R-II, MO", "NEW LIMA, OK", "Hollow Rock - Bruceton, TN", "YAZOO CITY MUNICIPAL SCHOOL DIST, MS", "CASSVILLE R-IV, MO", "ALPENA SCHOOL DISTRICT, AR", "HORATIO SCHOOL DISTRICT, AR", "BAY SCHOOL DISTRICT, AR", "SOUTH SIDE SCHOOL DISTRICT, AR", "MOUNTAIN VIEW-BIRCH TREE R-III, MO", "SOUTHWEST R-V, MO", "WEST PLAINS R-VII, MO", "GREEN FOREST R-II, MO", "BRAY-DOYLE, OK", "Meigs County, TN", "Leeds City, AL", "OZARK MOUNTAIN SCHOOL DISTRICT, AR", "BAKERSFIELD R-IV, MO", "LINDSAY, OK", "SHADY POINT, OK", "Fentress County, TN", "RIVERSIDE SCHOOL DISTRICT, AR", "PERRYVILLE SCHOOL DISTRICT, AR", "OAK RIDGE R-VI, MO", "SOUTH IRON CO. R-I, MO", "BUFFALO VALLEY, OK", "GRAND VIEW, OK", "MARYETTA, OK", "Humphreys County, TN", "CONCORD SCHOOL DISTRICT, AR", "ADVANCE R-IV, MO", "AVANT, OK", "LEACH, OK", "VICI, OK", "De Soto School District, KS (the district sent its policy but our readers could not open it: open the link in a browser and quote it)", "St. Joseph School District, MO (the district sent its policy but our readers could not open it: open the link in a browser and quote it)", "De Soto School District, KS (the district sent its policy but our readers could not open it: open the link in a browser and quote it)", "St. Joseph School District, MO (the district sent its policy but our readers could not open it: open the link in a browser and quote it)", "De Soto School District, KS (the district sent its policy but our readers could not open it: open the link in a browser and quote it)", "St. Joseph School District, MO (the district sent its policy but our readers could not open it: open the link in a browser and quote it)", "De Soto School District, KS (the district sent its policy but our readers could not open it: open the link in a browser and quote it)", "St. Joseph School District, MO (the district sent its policy but our readers could not open it: open the link in a browser and quote it)", "De Soto School District, KS (the district sent its policy but our readers could not open it: open the link in a browser and quote it)", "St. Joseph School District, MO (the district sent its policy but our readers could not open it: open the link in a browser and quote it)", "HODGEN, OK (policy offered only by in-person pickup: find it published elsewhere, or a person nearby)", "De Soto School District, KS (the district sent its policy but our readers could not open it: open the link in a browser and quote it)", "St. Joseph School District, MO (the district sent its policy but our readers could not open it: open the link in a browser and quote it)"]
    done_means:
      - The policy text is attached verbatim, with the page or section it came from.
      - Notes say which wall it was and what was tried through the shared tools first.
      - Anything learned about the vendor is added to crew/notes/blocked-sites.md.

  # The two tasks below list no scopes here. Their units are generated from the record when the server
  # starts (crew/units.mjs): one per silent or unknown district, one per district in next-targets.json.
  - id: record-completion
    title: Complete a silent district's record from its board policy manual
    description: >
      For a district whose record is `silent` (its handbook and the other documents found were read in full
      and carry no rule) or `unknown` (nothing readable was found), find the BOARD POLICY on corporal
      punishment in the board policy manual, not the student handbook, and submit the sentence that settles
      it verbatim, with the policy code and the URL of the policy page. A manual that is online and has no
      such policy is submitted as `silent` with the manual's URL; no manual found online is `unknown` with
      what was searched. Units are handed out one district at a time, the exposed states first
      (score.json permitting_states_by_exposure), one district per state in turn, largest enrollment first.
    unit: One district. claim_task returns the district with what the record already holds on it; get_worklist with the scope returns the same.
    output: Entries in data/districts/<XX>.yaml with source, quote and policy_code
    priority: 1
    schema: schemas/district-finding.schema.json
    skill: skills/district-policy-scan/SKILL.md
    collection: districts
    done_means:
      - The source is the board policy manual or a policy page in it, not a handbook or a news report.
      - The quote is the sentence that establishes the status, copied verbatim, and policy_code is the manual's own code for it.
      - A `silent` finding names the manual read and the sections searched; an `unknown` finding says what was searched and where.

  - id: neighbor-ask-research
    title: Who to ask in a permitting district next to one that banned
    description: >
      For a district that permits corporal punishment on paper and sits in the same or an adjacent county
      as a district that moved to a ban (data/game/next-targets.json), collect from the district's own
      pages, with the URL each item was read from: the current superintendent's name and the public office
      email the district publishes for that office, every board member's name and seat, the date of the
      next regular board meeting, and the name of the neighboring district that already moved to a ban
      (the unit carries the anchors the game computed; confirm or correct them). Submit one record with
      kind `contacts`. Nothing is sent to anyone by this task; a person reads every finding before any of it is used.
    unit: One district. claim_task returns the district, its banning neighbors and what the record holds; get_worklist with the scope returns the same.
    output: Records in the contacts collection, one per district
    priority: 2
    schema: schemas/contacts-finding.schema.json
    collection: contacts
    done_means:
      - Every item has the URL of the district page it was read from, and that page is one the district publishes for the public.
      - The superintendent's email is the office address the district publishes, never a personal mailbox; a district that publishes only a web form says so.
      - The meeting date is from the district's posted schedule or agenda, and is in the future on the day it is submitted.
      - Nothing about anyone's family, home, health, finances or private accounts, and no minor is named.
