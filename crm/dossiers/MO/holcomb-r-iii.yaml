notes: "The district website (holcombschools.com, WordPress) publishes no board roster, no meeting schedule, no public comment rule, no agendas and no minutes; the only board-related link is the Simbli policy listing. The roster recorded here is the 'Board of Education' page of the district's audited financial statements for the year ended June 30, 2025 (posted December 2025): Autumn Burk, President; Eric Heuring, Vice President; Chris Danley, Treasurer; Rex McElwrath, Austin Davidson, Tyler Ross, Joe Pikey, Members; Superintendent Dustin Benson; Secretary to Superintendent Leah Winchester. Officers may have been re-elected at the board's April 2026 reorganization and this should be confirmed by phone (573-792-3113). The Dunklin County April 8, 2025 sample ballot lists Chris Danley and Tyler Ross as the only two candidates for two three-year seats, so term_ends 2028 for both is derived from that ballot plus their presence on the June 2025 roster; results for that race were not found online. The Dunklin County unofficial summary for April 7, 2026 (dated 4/9/2026) contains no Holcomb R-III board race at all (only City of Holcomb races), consistent with an uncontested seat count under Missouri law, but that is an inference and is not recorded as fact. The CSIP (base 2022-23, updates through October 2025) lists 'Mrs. Autumn Burk, District Board Member' and 'Mr. Mark McClendon, District Board Member' on the improvement committee; McClendon does not appear on the June 2025 audit roster. Superintendent Dustin Benson appears on the district's 504 and public notice pages with phone (573)792-3113 ext. 103; no superintendent email is published (a 1095-C notice gives leahwinchester@holcomb.k12.mo.us, the secretary). Search results also surfaced an older 504 notice on the retired SharpSchool site naming a 'Dustin Ferguson' as superintendent, but that site returns 403 (Cloudflare) and could not be read, so it is not recorded. Simbli (S=151) is JavaScript-only and returned only the page shell to curl and to a rendering proxy; the JGA-1 quote is carried from data/districts/MO.yaml (crew-verified 2026-10-04, parent_control opt_in). No minutes or press mentioning the board and corporal punishment or discipline were found; the Daily Dunklin Democrat (dddnews.com) returns 403 to fetches and is not indexed for Holcomb, and KWOC's 2025 and 2026 roundups carry no Holcomb board results. Searches on each member's name with 'Holcomb' returned nothing on the record, so values lists are empty by result. The district's Facebook page is linked from the site but was not used (rule 1). CRDC 2023-24: 41 students (data/crdc/2023-24/districts.csv)."
