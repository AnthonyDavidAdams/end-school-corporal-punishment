framing_note: "No board member has a statement on the record that this run could find; default to local control and the district's own policy language. JGA-1 already requires a parent's written permission before corporal punishment, so the parental-rights frame is the board's existing position. The district's CSIP (base year 2022-23, updated through October 2025) states 'The school district will continue to provide a safe and caring environment for our students, staff, and community members' and its mission statement calls cooperation among all aspects of the community 'a cornerstone in the progress of any school', so the safe-schools frame and a community-messenger approach fit the district's own words; these are district statements, not quotes from any member."
