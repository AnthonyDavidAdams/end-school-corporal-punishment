framing_note: "No stated values on the record for any member; default to local control and the district's own policy language. JGA-1 already requires a parent's written permission, so the board has itself chosen the parental-rights frame; the ask is to finish what the board started. The district reported zero students paddled in 2023-24 while neighboring Pemiscot and Dunklin county districts reported dozens, which supports a safe-schools-and-order message: the district already runs without the paddle, so the policy can say so."
