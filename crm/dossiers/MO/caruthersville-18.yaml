notes: "The district site (cps18.org, Apptegy) blocks curl with a bot wall and renders only a title for a plain fetch; the pages listed above were read through the r.jina.ai rendering proxy, which returns the live page text. The site has no board-member page: the Board of Education menu item points at a documents folder holding agendas and minutes, and the minutes folder stops at 2020 (Jan 9, Feb 13, Mar 12, Apr 21, May 6, Jun 11, Jul 8, Jul 27, Aug 18, Sep 10, Oct 8, Nov 10, 2020). Simbli (S=358) is the policy host; the JGA-1 page, the policy listing and the meeting listing were JavaScript-only or returned No Meetings Found, so JGA-1 is recorded here from data/districts/MO.yaml (verified by the crew server 2026-10-04) and was not re-read in this run. Roster: Ballotpedia (undated, no term years) lists Pam Alston, Lee Bethune, Joe Cagle, Shea Clark, Jimmy Lyons, Teresa Tidwell, Chloe White. The district's own CSIP 2026-2029 (Final Draft June 2026, linked from the home page as 2026-2029 CSIP) lists Jimmy Lyons, School Board President and Teresa Tidwell, School Board Member on the planning committee, and lists Pam Alston as Community Member, so Alston's board seat could not be confirmed from a district document; she may have joined after the CSIP was drafted or Ballotpedia may be wrong. Chloe White, Shea Clark, Joe Cagle and Lee Bethune are from Ballotpedia only. A third-party vendor page (starbridge.ai) calls Chloe White Board Treasurer; unverified, not recorded as a role. 2020 minutes show the then-roster as Lee Bethune (President), Sandra Barnes, Jimmy Lyons, Joe Cagle, Tom McCall, Dona Clark, Teresa Tidwell, with JJ Bullington as superintendent and Brad Gerling as Director of School Services; the 2020 meetings were at 5:00 p.m. at the Administration Building, mostly the second Thursday. The current meeting schedule and public-comment procedure are not published anywhere reachable; call 573-333-6100 to confirm. Superintendent Brad Gerling is named on the administration page and in the CSIP; no official email is published. No minutes, agendas or press from 2021-2026 were found online; the 2020 minutes list Discipline totals or Discipline Chart as a standing report item but never mention corporal punishment. April 2026 election results were not found (searched Pemiscot County and regional outlets). No member has any statement on the record that was reachable in this run; values lists are empty for that reason, not for lack of searching. Local press (Standard Democrat, Delta Dunklin Democrat, Southeast Missourian, KFVS) returned nothing on this board for 2025-2026."
