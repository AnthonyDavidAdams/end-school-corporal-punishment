cp_record:
  vote_date: 2022-06-16
  vote: "6 Yes, 0 No. Motion by Wade Hermansen, seconded by Jon Horner, to approve the update to Board Policy JGA. Present: Jeremy Marple (president), Becky Henningson, Wade Hermansen, Jon Horner, Chad Johnson, Steve Henbest. Absent: Jill LeCompte. Agenda item 7.E: 'Approve the update to Board Policy JGA - Permitting corporal punishment as an \"opt-in\" disciplinary option.' Student handbooks for 2022-23 (which list corporal punishment as a consequence) approved the same night."
  vote_source: "https://go.boarddocs.com/mo/cassville/Board.nsf/files/CFGP9B638093/$file/June%20Reg%20Meeting%20Minutes%20June%2016th%202022.pdf"
  agenda_source: "https://go.boarddocs.com/mo/cassville/Board.nsf/PRINT-AgendaDetailed?open&id=CDNRTD6F7E6D&current_committee_id=A4EP6J588C05"
  policy_as_adopted: "https://go.boarddocs.com/mo/cassville/Board.nsf/files/CF9QFG6779D9/$file/JGA.pdf"
  policy_as_adopted_quote: "Corporal punishment, as a measure of correction or of maintaining discipline and order in schools, is permitted. However, it shall be used only when all other alternative means of discipline have failed, and then only in reasonable form and upon the recommendation of the principal. ... No pupil shall be subject to corporal punishment without a parent or guardian being notified and providing written permission for the corporal punishment. Thus, parents and guardians must obtain an opt-in form from the central office if they wish to authorize corporal punishment for their students. (Version: JGA-C.1C.CVL (3/22))"
  board_then: "Jeremy Marple (president), Becky Henningson (president 2018-2022, lost re-election April 2023), Wade Hermansen, Jon Horner, Chad Johnson, Steve Henbest, Jill LeCompte (absent June 16, 2022; present Aug. 18 and Sept. 15, 2022)."
  board_now: "Chad Yarnall (president), Jeremy Marple (vice president), Chad Johnson, Steve Henbest, Jon Horner, Wade Hermansen, Trey Rose (appointed July 2026). Five of the six who voted for the 2022 policy still serve."
  press_confirmation: "Cassville Democrat, Aug. 23, 2022: 'In June, the Cassville Board of Education approved the cell phone policy by a 6-0 vote as part of the student handbook revisions. At the same meeting, the corporal punishment policy also passed with a 6-0 vote. Board Member Jill LeCompte was absent.' (https://www.cassville-democrat.com/2022/08/23/cassville-responds-to-discipline-concerns/)"
  aftermath: "Students organized as Students Against Abusive Policies and said they would address the board at the September 2022 meeting (Springfield News-Leader via Yahoo, Aug. 29, 2022; TODAY, Aug. 2022). The Sept. 15, 2022 minutes record no public comments and no action on JGA (https://go.boarddocs.com/mo/cassville/Board.nsf/files/CJBL79525D02/$file/Sept%20Reg%20Board%20Meeting%20Minutes%2022-23.pdf). A Change.org petition created Aug. 26, 2022 was addressed to the board (not an official record; URL in sources_searched). Cassville Democrat editor Kyle Troutman's Sept. 6, 2022 column reported the superintendent's own survey that 175 of Missouri's 515 districts had a permitting policy and that Cassville's paddling is limited to the four building principals (https://www.cassville-democrat.com/2022/09/06/holes-in-paddling/). The policy remains JGA-1 consent_required on Simbli (data/districts/MO.yaml, verified 2026-10-04). CRDC 2023-24: 7 students."
