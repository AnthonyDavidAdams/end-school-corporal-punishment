framing_note: "Five of the seven current members (Marple, C. Johnson, Henbest, Horner, Hermansen) voted 6-0 on June 16, 2022 for the opt-in corporal punishment policy, and the district has framed it ever since as a parental choice ('This is an opt-in only option for parents'), so parental rights is already their frame; the opt-in form is the handle, and the next step in the same logic is that no child is paddled without a parent asking and that the district can stop offering it. The members' own words lean fiscal and local control (Yarnall on representing 'tax payer's conservative opinions', C. Johnson on being 'a responsible steward of taxpayer dollars', Hermansen on state support, Johnson's 2026 columns on funding), with teachers close behind (Horner and C. Johnson on hiring and retaining teachers; superintendent Johnson said student behavior is the No. 2 deterrent for incoming teachers). Horner invokes 'God given talents', so faith messengers fit him. Safe schools is explicit for Yarnall and Horner. Lead with liability and the fact that CRDC shows only 7 students paddled in 2023-24, so the policy buys little and risks much; the superintendent himself said 'Instances of corporal punishment will likely be low, and the cell phone restriction is much more impactful.'"
superintendent_record:
  then: "Dr. Merlyn Johnson, superintendent since July 1, 2021 (https://cassville.k12.mo.us/vnews/display.v/ART/60424347ea0fc, per search result; not opened). Still superintendent as of Oct. 6, 2026 (Cassville Democrat column byline: 'Merlyn Johnson is the superintendent of the Cassville school district')."
  now: "Dr. Merlyn Johnson (https://www.csr4.org/about-us read 2026-10-29; https://www.cassville-democrat.com/2026/10/06/community-voices-merlyn-johnson-state-should-do-its-part/)."
  quotes:
    - quote: "One of the suggestions that came out was concerns about student discipline. So we reacted by implementing several different strategies, corporal punishment being one of them."
      url: "https://www.ky3.com/2022/08/24/cassville-mo-school-district-reinstates-corporal-punishment-option-students-parents-react-decision/"
      date: 2022-08-24
      frame: safe_schools
    - quote: "It's something we don't anticipate using frequently."
      url: "https://www.ky3.com/2022/08/24/cassville-mo-school-district-reinstates-corporal-punishment-option-students-parents-react-decision/"
      date: 2022-08-24
      frame: other
    - quote: "This is an opt-in only option for parents."
      url: "https://www.ky3.com/2022/08/24/cassville-mo-school-district-reinstates-corporal-punishment-option-students-parents-react-decision/"
      date: 2022-08-24
      frame: parental_rights
    - quote: "We did the climate and culture surveys in May, and one of the things that stood out in all three - staff, students and parents - is that we as a district have concerns about a lack of discipline in the schools."
      url: "https://www.cassville-democrat.com/2022/08/23/cassville-responds-to-discipline-concerns/"
      date: 2022-08-23
      frame: safe_schools
    - quote: "When you suspend kids, they just sit at home and are not learning with their teachers, so corporal punishment is giving us another option, then they get to stay in class. It is opt-in only, so for parents that do not sign the opt-in form, their children will not be subjected to corporal punishment."
      url: "https://www.cassville-democrat.com/2022/08/23/cassville-responds-to-discipline-concerns/"
      date: 2022-08-23
      frame: parental_rights
    - quote: "There may be many, and there may be only a few. We also know the circumstances of our children's lives and if there is reported abuse, and if parents say 'yes' in those cases, we will not be doing it."
      url: "https://www.cassville-democrat.com/2022/08/23/cassville-responds-to-discipline-concerns/"
      date: 2022-08-23
      frame: other
    - quote: "Eliminating cell phones is a much more aggressive policy measure of response to discipline concerns than adding corporal punishment. Instances of corporal punishment will likely be low, and the cell phone restriction is much more impactful."
      url: "https://www.cassville-democrat.com/2022/08/23/cassville-responds-to-discipline-concerns/"
      date: 2022-08-23
      frame: safe_schools
    - quote: "We've had people actually thank us for it."
      url: "https://www.newstribune.com/news/2022/aug/27/missouri-school-district-reinstates-corporal/"
      date: 2022-08-27
      frame: parental_rights
    - quote: "Surprisingly, those on social media would probably be appalled to hear us say these things but the majority of people that I've run into have been supportive."
      url: "https://globalnews.ca/news/9084341/spanking-kids-school-punishment-missouri/"
      date: 2022-08-25
      frame: local_control
    - quote: "My plan, when I came to Cassville, wasn't to be known as the guy who brought corporal punishment back to Cassville. I didn't want that to be my legacy and I still don't. But it is something that has happened on my watch and I'm OK with it."
      url: "https://globalnews.ca/news/9084341/spanking-kids-school-punishment-missouri/"
      date: 2022-08-25
      frame: other
    - quote: "We started generating ideas on what we could do and corporal punishment was one of the ideas."
      url: "https://globalnews.ca/news/9084341/spanking-kids-school-punishment-missouri/"
      date: 2022-08-25
      frame: other
    - quote: "We have a new generation of parents, and that is showing. We will continue to make improvements based on our CSIP and understanding every child is different."
      url: "https://www.cassville-democrat.com/2023/04/19/shields-board-of-local-leaders-are-engaged/"
      date: 2023-04-19
      frame: teachers
    - quote: "Cassville is fortunate to have exceptional individuals serving our community as Board of Education members. Our board members are committed to making thoughtful decisions while keeping our students' best interests at heart."
      url: "https://www.cassville-democrat.com/2025/03/19/march-is-school-board-recognition-month-in-missouri/"
      date: 2025-03-19
      frame: local_control
    - quote: "We will continue concentrating on student achievement, academic growth, graduation, college and career readiness, and providing a safe and supportive environment for every student."
      url: "https://www.cassville-democrat.com/2026/09/22/community-voices-merlyn-johnson-new-grading-system-coming-to-missouri/"
      date: 2026-09-22
      frame: safe_schools
    - quote: "Our local taxpayers have stepped up. It is reasonable to expect the state to do its part as well."
      url: "https://www.cassville-democrat.com/2026/10/06/community-voices-merlyn-johnson-state-should-do-its-part/"
      date: 2026-10-06
      frame: fiscal
    - quote: "Cassville R-IV is fortunate to be in a solid financial position today because of responsible planning by our Board of Education, careful stewardship of taxpayer dollars, and the continued support of our community."
      url: "https://www.cassville-democrat.com/2026/07/21/community-voices-merlyn-johnson-amendment-5-presents-important-questions-about-missouris-future/"
      date: 2026-07-21
