notes: "Board roster, roles, election years, term expirations and board emails come from the district page https://www.csr4.org/boardofeducation (read 2026-10-29); cassville.k12.mo.us redirects to csr4.org. Yarnall became president at the 2026 reorganization (Hermansen was president 2024-26 and C. Johnson vice president, per March 2025 and March 2026 recognition photos); no article on the 2026 reorganization was found. Jill LeCompte, who retained her seat without election in April 2025, is no longer listed; Trey Rose was appointed July 2026 to serve until April 2027; the reason for the vacancy was not found in anything read. The 2022 vote: June 16, 2022, 6-0, motion Hermansen, second Horner, Marple presiding, LeCompte absent; the JGA.pdf attached to that agenda already contains the opt-in paragraph (national outlets said parental permission was added later; the BoardDocs record read here shows it in the June version). Then-president Becky Henningson (president 2018-2022 per the Cassville Democrat) voted yes and left the board after losing in April 2023. Cassville's BoardDocs (committee id A4EP6J588C05) serves agendas by GET at PRINT-AgendaDetailed and meeting lists by POST to BD-GetMeetingsList; it stops at April 2025, after which the district appears to use Diligent Community (highbond portal), which is JavaScript-only. Simbli policy pages (JGA-1, BDDH) render only a title without JavaScript; the policy quote is carried from data/districts/MO.yaml. The superintendent's official email was not readable (staff directory is a JavaScript filter; his columns print an obfuscated address); the district main line is 417-847-2221. Position_on_cp for the five 2022 yes-voters is recorded as opposes_ban on the strength of that vote only; none has spoken on a ban. Henbest and Rose have no on-the-record quotes found. Chad Johnson's 2026 quotes come from his Barry County Presiding Commissioner candidacy (Aug. 4, 2026 Republican primary); the result was not read in this run. Cassville Democrat articles are free with registration; text was readable without login. No student names recorded. Web search budget for the session ran out before searching for a 2026 reorganization article or Henbest/Rose quotes; a follow-up could check the Cassville Democrat April-May 2026 archive and the highbond portal minutes."
