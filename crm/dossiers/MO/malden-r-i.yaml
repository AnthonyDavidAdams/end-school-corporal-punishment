framing_note: "No board member has a statement on the record that this run could find; default to local control and the district's own policy language. The 2025-26 elementary handbook says the district 'retains the legal right to administer reasonable corporal punishment' and that if 'a paddling is refused by either student or his/her parent, the only alternative is out-of-school suspension' with missed work recorded as zero, so the parental-rights frame has a concrete local hook: a parent who declines is penalized rather than asked. The same handbook describes PBIS as 'a framework for creating safe and orderly learning environments', so the safe-schools frame can be built on a program the district already runs. Whether the board's own JGA-1 text requires written permission (as Missouri law has since August 2022) could not be read; see notes."
