notes: "The district site (Thrillshare/Apptegy) serves a JavaScript 'Client Challenge' to curl and WebFetch; the board page was read on 2026-10-29 through a rendering proxy (r.jina.ai). Roster as published there: President Carolyn Cornman, Vice-President Levin Miller, Treasurer Debra Wilkerson, Members Jeremy Holloway, Russell Miller, Ben Brown, Heather Beckett, and 'Secretary - Jessica Clark' (jessicaclark@maldenmoschools.org), who is recorded here as the board secretary and not counted among the seven members; the handbook lists her the same way. Member emails are the mailto links published on that official page. The 2025-26 Elementary Student Handbook (p. 7) shows the pre-April-2026 roster: Denton Kooyman President, Ben Brown Vice President, Levin Miller Treasurer, Jessica Clark Secretary, Cornman, Beckett, Holloway and Russell Miller members. Dunklin County's unofficial April 7, 2026 results (dated 4/9/2026): Malden R-I Board of Education, vote for 3: Carolyn Cornman 373, Debra Diana Wilkerson 357, Levin Miller 353, Denton J Kooyman 265 (PDF; the HTML summary shows 355/352/264 for the last three); Malden R-I Proposition 2 passed 420-155. term_ends 2029 for Cornman, L. Miller and Wilkerson follows from that election and Missouri's three-year term. The April 8, 2025 sample ballot listed Russell Miller, Lynnette Jenkins, Heather Beckett, Debra Wilkerson and Lytyron (Fred) Robinson for two seats; results were not found online, so Russell Miller's and Heather Beckett's term_ends are left null even though both now sit on the board. Superintendent: the 2025-26 handbook lists Carie Fowler as Superintendent (Robert Ison Sr. High Principal, Mark Pickard Jr. High Principal, Misty Thomas Elementary Principal); an undated MARE profile and Wikipedia name Kenneth Cook, which appears to be out of date; no superintendent email is published and the earlier board_email in data/districts/MO.yaml (dentonkooyman@...) belongs to the former president. POLICY: the handbook text is the only policy language read in this run. It says the district 'retains the legal right to administer reasonable corporal punishment to a student' and 'In the event that a paddling is refused by either student or his/her parent, the only alternative is out-of-school suspension', and refers readers to 'corporal punishment guidelines ... contained in the Malden R-I School District Policy Manual' (p. 18 and the District Discipline Code section). The board page links 'School Board Policies' to https://simbli.eboardsolutions.com/mo/maldenr1, which is JavaScript-only and returned only the page shell to curl and to the rendering proxy, so the board's JGA-1 text itself was NOT read; whether it says opt-in (written parental permission, as RSMo 160.261 has required since August 28, 2022) or something else is not established here, and no conclusion is drawn. parent_control in data/districts/MO.yaml is recorded as opt_out from the handbook refusal language. The handbook's PBIS section and the 2022-2027 CSIP (goals on parent involvement and a crisis-management revision with MSBA, no discipline or board-member statements) were read; the board agenda Google Doc returned only its title. No minutes are posted online; no press mentioning the board and corporal punishment was found; dddnews.com returns 403. Searches on each member's name with 'Malden' returned nothing on the record, so values lists are empty by result. CRDC 2023-24: 62 students (data/crdc/2023-24/districts.csv)."
