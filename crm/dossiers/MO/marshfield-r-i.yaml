notes: "Board policy on corporal punishment is S-170-P Student Discipline (EdCounsel numbering, not MSBA JGA/2670), published at https://egs.edcounsel.law/marshfield-r-i-school-district-policies/students and in the full policy PDF adopted July 21, 2026 (p. 67-68): 'Corporal punishment shall only be used as a method of discipline with the notification to and written permission of a parent/guardian, when other disciplinary methods have failed to improve student behavior and self-control, and when the District administration believes it will assist in maintaining an atmosphere where orderly learning is possible and encouraged. Corporal punishment shall only be administered by a building administrator and only in the presence of at least one other adult employed by the District.' The definitions section calls it 'The intentional infliction of physical punishment, usually in the form of spanking, as a method of student discipline.' The 2026-27 Junior High (p. 22), High School (p. 27) and Elementary handbooks, all BOE-adopted June 25, 2026, repeat the older 'with the consent of a parent/guardian' wording. S-205-P Seclusion and Restraint refers to an 'annual notice regarding the District's discipline policy and corporal punishment procedures provided to students and parents at the beginning of each school year'. Roster, roles, terms, emails and phones are from the official board page (read 2026-10-29); the April 16, 2026 board summary confirms the reorganization (Messick president, Clark vice-president, both 6-0-1; outgoing member Jeremy Devoto recognized; Marta Fraker appointed Board Secretary/Treasurer, a staff role, not a member). April 7, 2026 results (Webster County final official): Cologna 942, Wilkerson 920, Hartman 910 elected; Ashley Dedmon 608 and Aaron Spier 579 lost. Messick and Clark were elected April 2025 (933 KWTO, undated). Superintendent changed mid-2026: Mike Henry gave the superintendent's report through April 2026; Dr. Garrett Lowder (assistant superintendent for academics in April) is listed as Superintendent on the central office page and gave the report Aug. 20 and Oct. 15, 2026. No superintendent or board email beyond the member addresses is published. Searched all 2025-26 and 2026-27 board summaries for 'corporal', 'paddl', 'discipline', 'handbook' and 'public comment': the only hits are the handbook approvals (June 25, 2026, 5-0; Gifted Handbook May 21, 2026) and 'There were no public comments addressing the agenda' at every meeting read. No local press quotes from any member were found: the Marshfield Mail story on 2025 board filing returns 404, its site search returned nothing relevant, and the Webster County Citizen did not surface in any search. values is empty for every member by result, not omission. Policy G-235-P covers board elections; the district's election-notice page says no notice is current."
