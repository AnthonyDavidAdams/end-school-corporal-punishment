framing_note: "No stated values on the record for any member; default to local control and the district's own policy language. The district's own policy already goes further than its handbooks: S-170-P requires 'notification to and written permission of a parent/guardian' before corporal punishment, while the 2026-27 handbooks still say 'consent'. A board vote to end the practice is the natural next step of a policy the board has already tightened, and it is a local decision made in the high school library on a third Thursday, not something handed down from Jefferson City. The teachers frame also fits: S-170-P limits the act to building administrators, so no teacher is asked to do it now and none would be affected by ending it."
