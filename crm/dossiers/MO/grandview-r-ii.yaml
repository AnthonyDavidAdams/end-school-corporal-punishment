notes: "Do not confuse with Grandview C-4 (Jackson County). The district site grandviewr2.com (Thrillshare/Apptegy) returns a JavaScript 'Client Challenge' bot gate to every path tried, so the official Board of Education page, agendas, minutes, meeting schedule and public-comment rule could not be read; meeting_schedule and public_comment are null for that reason, not because none exist. The MO.yaml policy source (middle school handbook PDF on files-backend.assets.thrillshare.com) now returns an S3 AccessDenied XML; the quote is carried from data/districts/MO.yaml (verified 2026-10-04). The MSBA superintendent-search posting PDF (Aug 22, 2025) is also AccessDenied; the search engine's summary of it named Brian Dugan as president and Gary Bohler as vice president as of August 2025, with Steve Kuczka, Shane Frazier, Amie Merz, Terry Perren and Rachel Wofford as members, but that was not read at the URL and is recorded here only as a lead. Roster as reconstructed from the Jefferson County Clerk's certified April 7, 2026 summary: three-year seats to Mike Mayberry (359), Corey Wayne Powell (314) and incumbent Stephen Kuczka (274); Abe Eoff (231) lost; one-year unexpired seat (vacated by Amie Merz, who told the district she would resign before the election, per the Leader) to Tommy Hahn (243) over Justin A. Verhaeg (201). Shane Frazier and Rachel Wofford (elected 2023) did not appear on the 2026 ballot. Gary Bohler was re-elected April 2, 2024 (Leader, 2024-03-21) and serves to 2027. Brian Dugan and Terry Perren were elected April 5, 2022 (Leader, 2022-03-24; Dugan said then he had served six years, four as vice president and one as president); their terms ran to April 2025 and no Grandview R-2 race appears on the county's April 8, 2025 ballot summary, consistent with unopposed re-filing, but their current membership and any officer roles are unverified. Board officers for 2026-27 are unknown. Superintendent: Leslie Lause, hired unanimously Dec. 18, 2025, started July 1, 2026, replacing Matt Zoph (retired after 14 years); Jason Van Houten is communications director and board secretary (Leader, 2025-11-15). Voters approved continuing the four-day week April 7, 2026 (374-162). No minutes, agenda or press item mentioning corporal punishment, paddling or discipline policy was found; the only discipline-adjacent public record is Merz's 2024 mention of 'School protection officers: Oversight of this new program.' Values quotes are from Leader Publications candidate questionnaires (Dugan and Perren quotes are from 2022 and may be stale). Next person: get the board page through a real browser, or call the district office, to confirm the 2026-27 officers and the regular meeting day."
