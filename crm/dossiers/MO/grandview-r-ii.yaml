framing_note: "The board president could not be identified from any reachable official source (see notes). The members' own words, all from Leader Publications candidate questionnaires, cluster on teachers (Bohler, Dugan, Perren, Kuczka all name teacher pay and retention as their first concern), safe schools (Kuczka: 'school safety programs'; Mayberry: 'a good, safe place for our kids'), and fiscal stewardship (Hahn, Powell, Perren). Kuczka also put local control on the record in 2023 ('the right to choose curriculums and strategies for their own students'). Lead with teachers and local control: the district already requires advance parental approval, so a board vote to end the practice is the district's own policy logic taken one step further, and a step the district's teachers are not asked to carry out. No member has said anything on the record about corporal punishment."
