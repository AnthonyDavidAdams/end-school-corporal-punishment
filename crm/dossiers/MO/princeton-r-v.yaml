framing_note: "No stated values on the record for any member; default to local control and the district's own policy language. Here the district's own manual is the opening: the Board Policy page on tigertown.k12.mo.us publishes a 2000-series PDF whose policy 2670 is titled Corporal Punishment: Prohibited (No person employed by or volunteering for the School District shall administer or cause to be administered corporal punishment upon a student attending District schools), while the MCE portal (moconed.com) shows a 2010 version titled Authorized. A local-control ask is simply to make the record consistent and tell families which one governs. The board's public record is heavy on fiscal stewardship (voluntarily lowering the debt levy, insurance costs, declining enrollment, Spickard tuition) and on safety (a $50,000 school safety grant, a safe, orderly environment in the mission statement), so fiscal responsibility and safe schools are the frames the record supports, though not in any member's own words."
