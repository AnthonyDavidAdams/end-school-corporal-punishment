notes: "POLICY TEXT, record only, not concluded. (1) moconed.com policy 2670 for Princeton R-V, re-read 2026-10-29: titled Corporal Punishment: Authorized, Last Updated: August 2010, three sentences (should be used only after other methods have failed; witnessed by at least one other adult staff member and administered only by a principal or other District administrator; reasonable force to protect persons or property is not abuse under Chapter 210 RSMo). It does NOT carry the written-permission sentence Missouri law has required since August 2022; the Monroe City R-I version of the same MCE policy (2022) does. (2) The district's own site publishes its policy manual as PDFs on the Board Policy page; the 2000 Students PDF (table of contents and body, Reviewed and approved by the Princeton R-V School Board on January 8, 2018, February 12, 2018, and March 12, 2018) lists P 2670 Corporal Punishment: Prohibited with the text: No person employed by or volunteering for the School District shall administer or cause to be administered corporal punishment upon a student attending District schools. A staff member may, however, use reasonable restraint against a student without advance notice to the principal, if it is essential for self-defense, the preservation of order, or for the protection of other persons or the property of the School District. The two sources disagree and both are published; the maintainer should decide which governs (the district PDF is newer and the district's own) and whether status should change. The board reviews MCE policy updates every November-January (KTTN Nov 11, 2025: more than 30 policies, suspension procedures among them, corporal punishment not mentioned). Roster and roles from the district's Board of Ed page and the KTTN April 15, 2026 report of the April 14, 2026 reorganization (Ron Parson(s) president, Nathan Evans vice president, Marcie Davis secretary, Mary Easter treasurer); KTTN's May 13, 2026 report names all seven in a 5-1 vote on trap-shooting lettering (VanGenderen the lone yes), and its Oct 16, 2026 report names Evans, Boxley and Easter as absent members. The site's Board Minutes and Board Policy pages still show an older roster (Karla Meinke treasurer, Mitch Reger member). Term years: Ellsworth and Boxley elected April 2024 (district press release, vote counts given) so 2027. Parsons and Evans were elected April 2022 (district release) and their seats were up April 8, 2025 (KTTN Dec 11, 2024); both were re-elected as officers in April 2026, so 2028 is inferred, no April 2025 result was found. Davis, Meinke and VanGenderen's seats were up April 7, 2026 (KTTN Nov 11, 2025); Davis and VanGenderen continue and Easter appears from April 2026, so 2029 is inferred for those three; the April 2026 election results themselves were not found (the KTTN April 15, 2026 report does not give them). KTTN's April 18, 2025 report says Chet Ellsworth was vice president for 2025-26. Press releases 2023-2024 on the district site and KTTN reports 2024-2026 were read; none mentions corporal punishment; discipline appears only as drug-testing policy discussion (2024), a bullying public comment (April 2025) and suspension-procedure policy updates (Nov 2025). The only direct quotes in any source are the superintendent's; no board member is quoted anywhere, so values are empty. Press releases are signed by the district office (Carrie Goodin, Central Office, 660-748-3211); the board secretary staff position is Susan Moore. Princeton Post-Telegraph issues are on issuu (JavaScript-only) and were not read."
