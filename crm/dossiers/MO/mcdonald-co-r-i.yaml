notes: "The district site (Thrillshare/Apptegy) returns a JavaScript bot-challenge page on every path, so no board page, member emails, superintendent email or policy page was readable; official_url points to the district's public BoardDocs instead. Roster and president come from the March 12, 2026 regular-meeting minutes and April 2, 2026 work-session minutes on BoardDocs (all seven present both times; Banta president; Dr. Eric Findley superintendent; Will Gordon and LaDonna McClain assistant superintendents). The April 9, 2026 agenda shows the annual oath of office and 'Election of Officers' after the non-election, but the BoardDocs meeting list ends at that meeting and the April 9 minutes were not available, so officers after April 2026 are not confirmed; Banta is listed as president on the last record read. Terms: Parish, Bergen and Carlin were re-seated without an election in April 2026 (county Notice of Non-Election), so 2029; Collingsworth and Campbell were elected April 2025, so 2028; Banta and McClain were the incumbents in the April 2024 election and still serve, so 2027 (the 2024 county result PDF is image-only). Policy JGA was not found: BoardDocs says 'No policies in this section', the district site is unreadable without JavaScript, and no Simbli or MSBA-hosted copy for this district surfaced in search. What the record does show is recorded under policy_search: the high school handbook lists corporal punishment as a consequence and defines it as 'Application of paddle to the buttocks of the student', and the 2025-26 enrollment packet contains a 'Corporal Punishment Consent' Yes/No checkbox with a three-swat, wooden-paddle description. data/districts/MO.yaml carries additional quotes ('Students shall not be subject to corporal punishment ... without a parent/guardian being notified and providing written permission') attributed to the handbook source; that sentence was not found in the 2026-27 MCHS handbook text read here (grep for 'permission' near 'corporal' returned nothing), so the next person should check which document it came from. McDonald County Press meeting coverage (Dec. 2025 open-enrollment resolution, Feb. 2026 $9.6 million football field vote, Aug. 2026 scoreboards) is subscriber-only; only ledes and captions were readable. The superintendent's one quote found, to KSNF on Aug. 17, 2026 about the student advisory committee: 'I want them to tell us what we're not doing, I want them to tell us what we need to improve on, and if I don't listen to them, we're not going to get better' (https://www.yahoo.com/news/articles/mcdonald-county-students-present-suggestions-225312924.html). No student names recorded; the minutes name students for awards and those were left out. Web search budget ran out before member-by-member quote searches for Banta, McClain, Campbell and Collingsworth; the next person should read the April 9, 2026 minutes once posted and try the district's board page in a browser."
