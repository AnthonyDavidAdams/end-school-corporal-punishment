framing_note: "No member has spoken on corporal punishment in anything read. The three members with on-the-record words (Parish, Bergen, Carlin, all from the 2020 McDonald County Press candidate Q&A) frame everything as stewardship of taxpayer money and taking care of teachers and staff; Bergen is a retired teacher and minister who quotes the district motto 'Every child, every day, whatever it takes', and Carlin asks for data over emotion and voted alone against the $9.7 million grandstand. Lead with the fiscal and liability frame (27 students paddled in 2023-24 in a 3,486-student district, the largest permitting Missouri district that reported uses) and the teachers frame (which staff member holds the paddle, and whether they asked to), then parental rights, since the district's own enrollment packet already asks parents to check Yes or No. Banta, McClain, Campbell and Collingsworth have no stated values on the record; default to local control and the district's own handbook language."
