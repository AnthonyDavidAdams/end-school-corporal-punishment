notes: "Roster of seven read from the district board page on 2026-10-29: Steve Marler (School Board President), Lee Hillis (Vice President), Brian Allen (Secretary of the Board), John Berger, Kevin Henson, Andrea Reed (Member - MSBA Delegate), Ronnie Walk. The sibling page /district_info/school_board_documents_and_information lists John Berger as Vice President and Lee Hillis as a member, the reverse of the board page; the dedicated board page is recorded here and the discrepancy should be checked with the district office (573-224-5000). No term dates, emails or phones are published for any member; the only email on the site is a site-wide 'Send Email' address for the central office with no name attached, so member contacts are null. term_ends for Henson and Reed is derived from Ballotpedia's 'Year assumed office: 2024' plus Missouri's three-year term; all other terms are not published. Superintendent is 'Mr. Rick Clubb, Superintendent of Schools' per the district's Superintendent Memo page (no memo text, no personal email published); KFVS12 (2026-04-22) carried his statement after a school bus accident. The Meetings page gives the schedule (3rd Thursday, 6:00 pm, Administration Building) but no public comment procedure, no agendas and no minutes; the 'Documents and Misc. Information' page is empty. The School Board Policy Manual link redirects to Simbli (S=513), which is JavaScript-only; the JGA-1 policy page and the Simbli home page returned only the page shell to curl and to a rendering proxy, so the policy quote is carried from data/districts/MO.yaml (crew-verified 2026-10-04, policy adopted 1994-11-17 per that record). No board minutes, agendas or meeting video were found anywhere online, so no vote or discussion on corporal punishment, discipline or JGA could be checked. No press coverage mentioning the board and corporal punishment was found; the Missouri Independent/The 74 'Passing the paddle' piece (2023-04-22) and KCUR (2026-08-20) do not mention Greenville. The Wayne County Journal Banner (waynecojournalbanner.com) returned 403 to every fetch and is not indexed by search, so April 2026 board election results and candidate statements could not be read; Wayne County has no online election results page that this run could find. KWOC's April 8, 2026 roundup says only that 'Ballot issues also passed in Greenville and Williamsville' without naming board winners. Searches on each member's name with 'Greenville' and 'Wayne County' returned nothing on the record, so values lists are empty by result, not by omission. CRDC 2023-24: 141 students (data/crdc/2023-24/districts.csv), the highest count in Missouri in that file. The website's handbook pages load documents by script and showed no PDF links to curl or the proxy, so handbook corporal punishment language was not read in this run."
