framing_note: "No board member has a statement on the record that this run could find; default to local control and the district's own policy language. The district's JGA-1 already requires a parent's written permission before corporal punishment, so the parental-rights frame is the board's own existing position and the ask is to make the policy's logic complete. The district's CSIP (2022-23) lists 'Safety' among its core values and commits to 'Maintaining adequate school discipline' and to 'All schools will be safe and supportive', and Superintendent Rick Clubb's April 22, 2026 statement to KFVS said 'The safety of our students and staff remains our highest priority', so the safe-schools frame fits the district's own language."
