framing_note: "No stated values on the record for any member; default to local control and the district's own policy language. The district's current documents are the opening: Policy P 2670 says corporal punishment 'should be used only after other methods have failed', the 2026-27 high school handbook still lists it as a first-offense option for a dozen infractions, and neither document mentions parental permission, while the district reported zero students paddled in 2023-24. Safe schools and order is the frame that matches a board whose public-comment slot is filled every month by the teachers' association (CTA) and whose minutes record a 45 percent fund balance and a strong audit: the practice is already unused, so writing that down costs nothing and removes a liability. Teachers are the natural messengers here given the CTA's standing presence."
