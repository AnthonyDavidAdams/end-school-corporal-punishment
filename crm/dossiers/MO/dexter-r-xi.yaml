meeting_schedule: "Monthly regular meeting, 6:00 pm, Administration Building Board Room, 1031 Brown Pilot Lane, Dexter; usually the third Tuesday (Sept. 15, Oct. 20, Nov. 17, 2026; Jan. 20, Feb. 17, Apr. 21, May 19, 2026) but not always (Aug. 27, 2026 and July 28, 2026 were other weekdays). Notices and agendas posted at https://www.dexter.k12.mo.us/boe-agendas-and-minutes"
public_comment: "From the posted agenda: 'someone who is pre-registered with the Board Secretary prior to the beginning of the Board meeting to present a position on a specific agenda item or who is pre-registered with the superintendent in writing at least 5 days prior to the beginning of the Board meeting to present a general comment about a non-agenda item will be given time for presentation to the Board of Education. Each speaker is limited to 5 minutes. A maximum of 15 minutes is allowed for this public comment section. Please, just one spokesperson per group; individuals may speak only once per meeting; time is regulated by the Board Chairman.' Complaints about procedures, regulations or personnel are not heard until the district complaint procedure is exhausted. (https://files.smartsites.parentsquare.com/13344/board_agenda_october_2026_1.pdf)"
