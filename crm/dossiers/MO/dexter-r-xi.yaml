notes: "What the current documents say, recorded without conclusion. (1) Board policy: the district policy index at https://www.dexter.k12.mo.us/district-policies (Missouri Consultants for Education numbering, 'Policies Provided By Missouri Consultants for Education, Powered By Static Dynamics') lists 2670 'Corporal Punishment: Authorized', 2600 Discipline, 2610 Misconduct & Disciplinary Consequences and 0412 'Meetings - Participation by Public', but every per-policy link (district.php?pol=N) returns 404 from the district host, so the live policy text could not be read there. The district's 'Discipline & Bullying Policies' PDF (linked from https://www.dexter.k12.mo.us/district-discipline-policies, 'current policies as of 7/1/2022', p. 12) gives P 2670 CORPORAL PUNISHMENT AUTHORIZED in full: 'Corporal punishment should be used only after other methods have failed and when there is reason to believe it will be helpful in maintaining discipline or in the development of the student's character and power of self-control. All instances of corporal punishment shall be witnessed by at least one other adult member of the school staff and will only be administered by a principal or other District administrator. The use of reasonable force for a District employee to protect persons or property is not abuse within the meaning of Chapter 210, RSMo.' That text contains no reference to parental permission, notice or opt-out; a search of the whole PDF for 'permission', 'opt out' and 'parental consent' found nothing related to corporal punishment. (2) Current handbook: the Dexter High School Family-Student Handbook 2026-2027 (PDF linked from https://dhs.dexter.k12.mo.us/handbook, p. 53-54) still lists 'Corporal Punishment' among first-offense consequences for arson, assault, bullying, fighting, defiance of authority, extortion, improper display of affection, threatening language, obscene or vulgar language and disruptive or demeaning language, in wording matching the 2018-19 handbook quoted in MO.yaml, and says copies of 'the District's corporal punishment policy, if any, will be provided to each student at the beginning of each school year.' No parental-permission language appears near any of these entries. The board approved the 2026-27 building handbooks June 2026 ('E-H. The board approved the building handbooks for the 26-27 school year') and revisions to the Central and Southwest Elementary handbooks in September 2025. Policy 2600 Discipline was among the MCE policy updates approved in September 2025; the notes do not say what changed. (3) Roster and roles: the official board-members page lists Demaree President, Glaus Vice President, Howard Treasurer, Brannan, Clark, Kruse, Mathis; the April 21, 2026 agenda shows the oath of office for Demaree, Glaus and Brannan after the April 7, 2026 election (so their terms run to 2029) and the April notes record the reorganization (Leah Stewart is Board Secretary, a staff role). Mathis and Clark were elected April 2024 (terms to 2027). Howard's seat was up in April 2025 per the Dexter Statesman (Jan. 8, 2025: seats then held by Nancy Mayer, who did not run again, and Bonnie Howard); she remains on the board, so her term presumably runs to 2028, but no 2025 result was found, so term_ends is null; Kruse's election year was not found. No 2026 Statesman or Stoddard County results for the school board race were found. (4) Minutes: every 2025-26 and 2026-27 note read records 'Public Comments: Members of the CTA Executive Committee were present and gave the board an update' (or 'The CTA gave an update'); the only discipline items are closed-session 'A student discipline infraction' (March 24, 2026 special meeting) and 'Student Discipline Matter' (May 2025), plus 'Building attendance and discipline reports' discussed June 2026. No mention of corporal punishment or paddling in any agenda, notice or note read. (5) No member emails, phones or biographies are published; no on-the-record quotes from any member were found (the April 2024 Statesman story has none; the Statesman site returns 403 to the fetch tool and partial text to curl). values is empty for every member by result. Superintendent Amy James (Gavin Miller assistant superintendent, Jessica Lambert special services director); no email published; district phone 573-614-1000. Next person: a real browser may open the per-policy pages behind district.php, and a records request or phone call can confirm whether the district treats P 2670 as still in effect given the zero count."
