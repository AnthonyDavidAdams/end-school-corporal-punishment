      - quote: I don't think we should legislate through the budget. I think that the policy should go first and the budget should follow.
        url: https://www.newstribune.com/news/2024/feb/08/missouri-lawmakers-want-to-raise-teacher-pay-but/
        date: '2024-02-08'
        frame: fiscal
        context: Same story.
