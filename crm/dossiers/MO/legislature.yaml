legislative_record_on_corporal_punishment:
  sb_681_2022_opt_in_amendment:
    bill: CCS#2 HCS SS SCS SBs 681 & 662 (2022), "Elementary and Secondary Education"
    house_bill_page: https://house.mo.gov/Bill.aspx?bill=SB681&year=2022&code=R
    senate_bill_page: https://www.senate.mo.gov/BillTracking/Bills/BillInformation?handler=legislation&year=2022&session=R&billPrefix=SB&billSuffix=681
    senate_sponsor: Cindy O'Laughlin (R, Senate District 18)
    house_handler: Chuck Basye (R, House District 47)
    what_the_law_did: 'Added to section 160.261.1 RSMo: "No pupil shall be subject to corporal punishment procedures outlined in the discipline and corporal punishment policy without a parent or guardian being notified and providing written permission for the corporal punishment." (quoted from the HCS text, 4133H.10C, and from the current statute at revisor.mo.gov)'
    where_it_entered: The House Committee Substitute. The Senate perfected text (https://www.senate.mo.gov/22info/pdf-bill/perf/SB681.pdf, 24 pages) contains no occurrence of "corporal"; the HCS text (https://documents.house.mo.gov/billtracking/bills221/hlrbillspdf/4133H.10C.pdf) contains the written-permission sentence in section 160.261. The HCS summary (https://documents.house.mo.gov/billtracking/bills221/sumpdf/SB0681C.pdf) records "Voted Do Pass with HCS by the Standing Committee on Elementary and Secondary Education by a vote of 19 to 0." The individual who drafted or moved the corporal punishment language inside the committee substitute is not identified on any page read; the House amendments page for the bill returned an error and the amendment PDFs were not read.
    house_committee_actions:
    - date: '2022-04-11'
      action: 'Referred: Elementary and Secondary Education (H)'
    - date: '2022-04-19'
      action: Public Hearing Completed (H)
    - date: '2022-04-21'
      action: Executive Session Completed; HCS Voted Do Pass; HCS Reported Do Pass, AYES 19 NOES 0 PRESENT 0
    - date: '2022-05-02'
      action: Third Read and Passed with Amendments (H), HA 1 through HA 19
    - date: '2022-05-12'
      action: House Adopts Conference Committee Report; Truly Agreed To and Finally Passed
    - date: '2022-06-30'
      action: Approved by Governor (G)
    truly_agreed_summary_quote: CORPORAL PUNISHMENT (Section 160.261) This bill requires school districts to notify parents and receive written permission before using corporal punishment. The bill repeals language related to the jurisdiction of the Children's Division within the Department of Social Services (DSS) and its ability to investigate reports of alleged child abuse by personnel of a school district, a teacher, or other school employee. It also repeals language related to how a school and school district are to handle reports of alleged child abuse.
    truly_agreed_summary_url: https://documents.house.mo.gov/billtracking/bills221/sumpdf/SB0681T.pdf
    what_was_said: Nothing on corporal punishment was found in the record read. The witness appearance forms for the 2022-04-19 House hearing (https://documents.house.mo.gov/billtracking/bills221/witnesses/SB681Testimony.pdf) contain no occurrence of "corporal"; the testimony read concerned reading success plans. No floor or committee remark on the provision was found.
    statute_now:
      url: https://revisor.mo.gov/main/OneSection.aspx?section=160.261
      history_line_excerpt: A.L. 2014 S.B. 491, A.L. 2014 H.B. 1371, A.L. 2022 S.B. 681 & 662
      quotes:
      - including the district's determination on the use of corporal punishment
      - without a parent or guardian being notified and providing written permission for the corporal punishment.
      - Spanking, when administered by certificated personnel and in the presence of a witness who is an employee of the school district
      - is not abuse within the meaning of chapter 210.
    local_press_context: 'KY3 (2022-08-24, https://www.ky3.com/2022/08/24/cassville-mo-school-district-reinstates-corporal-punishment-option-students-parents-react-decision/) on the Cassville R-IV opt-in policy states: "Missouri Statute authorizes corporal punishment as an option for each local school to consider if parents opt-in." The article names no legislator.'
  committee_activity_since: No bill with "corporal" in its title appears in the House Elementary and Secondary Education bills-in-committee lists for 2025 (https://house.mo.gov/BillsInCommittee.aspx?year=2025&code=R&committee=4302) or 2026 (https://house.mo.gov/BillsInCommittee.aspx?year=2026&code=R&committee=4302), nor in the Senate Education Committee assigned-bills lists for 2025 (https://www.senate.mo.gov/Committees/AssignedBills?id=6&year=2025) or 2026 (https://www.senate.mo.gov/Committees/AssignedBills?id=6&year=2026). None of the four ban bills or HB 1937 received a hearing, so there are no committee minutes, witness lists or votes on a ban. The only fiscal note found is for HB 1581 (2024), which found zero fiscal impact and zero school district responses.
framing_note:
  house_chair_ed_lewis: 'Lewis is a 32-year science teacher whose own words center on teachers and public education ("We don''t have enough teachers for our public schools") and on fiscal discipline ("help Missourians save their hard-earned dollars while removing unnecessary regulations"; "the policy should go first and the budget should follow"). The teachers frame fits best: lead with Missouri teachers and administrators who do not want to hold the paddle, and with the AFT and NEA positions. The fiscal frame is a second door: liability and settlement costs. Nothing he has said supports or opposes a ban; his bio lists a church membership and a Bible college career, but he has said nothing on faith in the sources read, so do not lead with it.'
  house_vice_chair_brad_banderman: Banderman's campaign planks are explicit local control and parental rights ("Local Control of Public education safeguards a parent's or guardian's rightful place in the education of their children"; "The choice of education should always rest with parents or guardians not government"), plus faith and fiscal planks. The 2022 opt-in law is already the parental-rights version of this issue; the argument to him is that written permission is the floor and that a parent should never find the state has hit a child without their say. He is a youth pastor and former substitute teacher and bus driver in a district that may permit paddling; a Franklin County pastor or teacher is the right messenger, not an out-of-district advocate.
  senate_chair_rick_brattin: 'Brattin''s own words are about parental freedom from government ("Nothing in this bill is a requirement"; "freedom and liberty") and about students escaping "failing school districts"; he sponsored SJR 6 (2025) asserting a parental right to direct education free from government interference. The parental-rights frame is the only one his record supports: a ban as the state keeping its hands off a parent''s child, and opt-in consent as the minimum. He is a Marine veteran and self-described devoted Christian; avoid the human-rights and international frames entirely.'
  senate_vice_chair_brad_hudson: Hudson's only quotes found are fiscal ("decrease spending and live within our means"; "accountable to those who have elected us"). He is a pastor and former county assessor. Lead with the fiscal and liability frame and let faith come only through pastors in Senate District 33 who oppose paddling. No statement on schools discipline was found; treat him as unknown.
caveats:
- The November 2026 general election covers every House seat; House members here are the 2026 session roster and term_ends 2027 marks the end of the current two-year term. The 104th General Assembly convenes in January 2027 and committee chairs and rosters will be reassigned by the new Speaker; the Senate committee will also be reconstituted by the President Pro Tem. Re-run this dossier after the January 2027 assignments are posted.
- 'Confirmed in this run: the 2026 House committee is named "Elementary and Secondary Education" (id 4302) and the Senate committee "Education" (id 1727); the 21 House members and 7 Senate members above with roles as published; House Capitol phone and email for every House member; Senate Capitol phone for every senator; all four bill histories, referrals, hearing status, co-sponsors and summaries from the official pages; Nurrenbern''s Senate seat and committees; Mackey''s resignation (House Journal); Doll''s current committees.'
- 'Not confirmed: Senate email addresses (not published on member pages); any Senate term end date (only first-elected and term-limit years are published); the chairs of the 2023 Elementary and Secondary Education Committee and the 2024 General Laws Committee where HB 121, HB 160 and HB 1581 died (the archived roster pages at house.mo.gov returned no content to the fetcher); who moved the 2022 opt-in language inside the SB 681 House committee substitute; any legislator statement on corporal punishment other than the sponsorships themselves; Banderman''s Ballotpedia survey; Brattin''s 2022 and 2023 Capitol Report columns on children.'
- The shared web search budget for this session was exhausted at the end of this run; the last two searches (Brattin's 2022 and 2023 columns) were not performed.
- Values quotes are the member's own published words with the URL and date given; where a quote was read in a republication (News Tribune, The 74, KCUR) rather than the originating outlet, both are named. Campaign-site text written in the third person is marked as such.
- position_on_cp is unknown for every committee member except Nurrenbern (sponsor). No committee member has voted on a ban because no ban bill has been heard.
