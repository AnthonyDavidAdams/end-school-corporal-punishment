        date: '2025-01-23'
        frame: other
        context: Official House press release (PDF) announcing his appointment as chair.
      - quote: I look forward to working with the members of this committee as we work to create policies to help Missourians save their hard-earned dollars while removing unnecessary regulations.
        url: https://house.mo.gov/PressRelease.aspx?prid=272
        date: '2025-01-23'
        frame: fiscal
        context: Same press release.
      - quote: I thought that they needed someone like myself, someone who would really advocate for education for everybody in the state.
        url: https://themissouritimes.com/freshmen-to-watch-ed-lewis/
        date: '2021-02-11'
        frame: other
        context: Missouri Times profile, on why he ran.
      - quote: I want to advocate for education in my district, but I also want to advocate for education for every student in the state.
