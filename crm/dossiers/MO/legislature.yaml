method: 'agent:claude (Fable 5.1), decision-maker-dossier skill, run 2026-10-29 from session dossiers-leg. Public record only: house.mo.gov and senate.mo.gov member, committee and bill pages (read with curl; the House pages load their content in iframes, so the iframe URLs were fetched directly), documents.house.mo.gov bill summaries, fiscal notes, HCS text, witness forms and the House Journal, revisor.mo.gov, and on-the-record quotes in established outlets. Committee rosters are the 103rd General Assembly, 2nd regular session (2026) rosters as published on 2026-10-29. House term_ends 2027 is the end of the two-year term the official bios describe. Senate term_ends is left null because the member pages give only first-elected year; term_limited_after is the "Ineligible for Reelection" year on https://www.senate.mo.gov/Senators/TermLimits. Senate member pages publish no email address, so Senate email is null.'
