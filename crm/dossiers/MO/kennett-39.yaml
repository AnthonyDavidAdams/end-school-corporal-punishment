notes: "The district site (Thrillshare/Apptegy) returns a JavaScript bot-challenge page on every path tried, so no board page, member emails, superintendent email or board-policy page was readable; the district's Google Sites policy manual requires sign-in. The roster is from the district's March 2026 School Board Recognition Month release as printed by the Delta Dunklin Democrat (March 4, 2026): Shetley president, Poole vice president, Boone, Freeman, Harris, Wake, Williams. A search-result snippet of the district's own live feed said that at the April 21, 2026 meeting David Williams, Dustin Harris and Anthony Weaver were sworn in for three-year terms and Shetley and Poole were re-named president and vice president; that page could not be read, so Weaver is not listed as a member and Wake is kept with a caveat. Dunklin County's April 7, 2026 summary report shows no Kennett 39 board contest (Malden R-I and Campbell R-II appear), consistent with a non-election. Term years: Boone and Freeman 2028 (elected 2025); Harris, Wake, Williams were elected 2023; Shetley and Poole were not on the 2023 or 2025 ballots, so by elimination they were last elected in 2024 (term 2027), but no 2024 result was read (the county's 2024 results page is image-only), so term_ends is left null for them. Superintendent Dr. Richie Leeker (Kennett staff since 2004 per search snippet; assistant superintendent named Dec. 2020 per KTMO; superintendent through Aug. 2026 per Delta Dunklin Democrat); data/districts/MO.yaml records rleeker@kennett.k12.mo.us and 573-717-1100 as of 2026-09-23, not re-verified here. Dunklin Democrat articles are paywalled after the lede but the full body is embedded in the page JSON and was read. No mention of corporal punishment, paddling or JGA was found in any Kennett board report or local story read; the board approved 'MSBA 2024C' and '2024D' policy updates (Oct. 2024, Jan. 2025) and 2026-27 student handbooks (Aug. 2026) as consent items, and 'Upon approval, school handbooks exist as board policy.' The web search budget for this session ran out before Kennett member quotes could be searched member by member; the next person should search dddnews.com for each name and read the April 21, 2026 live-feed post in a browser."
