framing_note: "No stated values on the record for any member; default to local control and the district's own policy language. The one recorded split (the 4-3 four-day-week vote of Jan. 21, 2025, with president Shetley and vice president Poole on the losing side) shows the president does not control the majority and that teacher recruitment and retention is the board's live concern, so the teachers frame (no teacher wants to hold the paddle; both national unions back the federal bill) and the fiscal frame (Leeker's monthly reports are almost entirely financial) are the likeliest openings. Kennett reported 38 students paddled in 2023-24, the most of these three districts, under a written-permission policy; the parental-rights frame is already in JGA-1 and is the natural first ask."
