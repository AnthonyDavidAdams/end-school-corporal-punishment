framing_note: "No member has stated values on the record; default to local control and the district's own policy language, and here the district's own language is unusually strong. The board voted 7-0 on October 14, 2024 to move from the MCE (moconed) manual to EdCounsel, and the EdCounsel manual it adopted July 1, 2025 (S-170-P) says corporal punishment is strictly prohibited as a method of discipline, while the old MCE portal still shows policy 2670 authorizing it with written parental permission. The local-control message writes itself: the board has already decided, and the only ask is to retire the stale 2670 text, confirm the prohibition in the handbooks, and tell families. The president opens meetings with a prayer, so a faith messenger from a local congregation is a plausible fit, but no member has said anything on the record to confirm that frame."
