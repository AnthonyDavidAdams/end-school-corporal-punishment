public_comment: "Policy C-140-P (adopted July 1, 2025): a time may be set aside at regular meetings for public comment on posted agenda items; residents must submit a written request to the Superintendent no later than the Thursday before the meeting; comments must relate to a posted agenda item; the Board President sets time limits and no one speaks more than once. The older MSBA-portal policy 0412 (2022) allowed three minutes per speaker and a resident agenda-item request through the Superintendent."
