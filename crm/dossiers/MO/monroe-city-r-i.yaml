notes: "POLICY CONFLICT, record only, not concluded: data/districts/MO.yaml and policy-lag.json rest on MCE policy 2670 at moconed.com (Board Approved September 12, 2022, Last Updated August 2022), re-read in this run, which authorizes corporal punishment and carries the written-permission sentence. But the board's Board Policy link now points to EdCounsel (egs.edcounsel.law), whose manual (BOE adopted 2025-07-08; every policy shows Adoption Date(s): July 1, 2025) says in S-170-P Student Discipline: Corporal punishment is strictly prohibited as a method of discipline. However, reasonable force may be used, when necessary, for the protection of a student or others or property. The October 14, 2024 minutes (filed as Oct.pdf in the 2025-2026 folder, content dated 2024) record a 7-0 vote on Board policy crossover to Ed Counsel from MCE. S-205-P still refers to an annual notice of the District's discipline policy and corporal punishment procedures, and the 2026-27 Middle School handbook still carries the MCE boilerplate about the District's corporal punishment policy, if any. The maintainer should decide whether status should move to prohibits (or no_policy pending handbook language); this file keeps the recorded status. Site: Apptegy pages return a title only to a plain fetch and curl hits a bot wall; board pages were read through the r.jina.ai rendering proxy. The board-members page (2026-2027 Board of Education) lists Darin Yager President, Ryan Hulse Vice President, Brad Williams Secretary, Mechele Ogle Treasurer, Tyler Mudd, John Long, Nolan Nichols, with no terms, emails or bios. Minutes on the site are scanned PDFs with no text layer; I ran OCR (tesseract) on all 16 files from July 2025 through September 2026 and the OCR text contains no corporal, paddling or spanking; errors in the OCR are possible. April 13, 2026 organizational meeting: election results verified 5-0 (no vote counts in the minutes), oath given to new board members Tyler Mudd, John Long and a third name the OCR renders as Mechele Long, almost certainly Mechele Ogle re-elected; officers elected by acclamation 6-0; term_ends 2029 for those three follows from that oath. Dennis Long and Rick Pfanner served through 2025-26 and are gone after April 2026. Term years for Yager, Hulse, Williams and Nichols were not established from a primary record (Ballotpedia says Nichols assumed office 2025, which would end 2028) and are left null. Ballotpedia's roster matches the district page. Superintendent Tony DeGrave: on the staff page; email from the district's 2026-27 Middle School handbook compliance notice. The 2022 CSIP lists the then-board (Pennewell President, Yager Vice President, Hulse Secretary, Dennis Long Treasurer, Quigley, Williams) and a signature line for Linda Greening as Board President. Lake Gazette (lakegazette.net) is region-blocked; muddyrivernews tag page is empty; centralmoinfo returned 404/429; nemonews 403. Nothing from any member in their own words was found anywhere, so values are empty. Monroe Free Press minutes in search results belong to Monroe City Schools, Louisiana, not this district."
