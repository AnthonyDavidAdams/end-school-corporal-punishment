    quote: "6.14.1 Corporal Punishment - Corporal punishment shall always be administered with a consideration for the age and physical maturity of the student. Corporal punishment must always be a deliberate, well thought out action on the part of school administrators and should be administered appropriately to effectively alter student behaviors that are unacceptable in a school environment. Should corporal punishment be needed, it must be administered according to the following: a. A student must be notified of the offense for which he/she is to receive corporal punishment and the student must be given an opportunity to explain his/her actions. b. The punishment must be administered by a school administrator and witnessed by a certified school employee. c. The punishment must be administered out of view of any other students. d. The punishment shall consist of a moderate use of physical force or physical contact by an administrator as may be necessary to maintain discipline or to enforce school rules. e. A written record of the punishment shall be made, in which the violated offense resulting in the punishment is listed along with the administered punishment, the name of the witness(es), and the name of the administrator giving the discipline. The administrator shall maintain a copy of the record and a copy shall be given to the student's parent/guardian."
