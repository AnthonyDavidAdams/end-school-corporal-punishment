  - name: Covington County Schools
    county: Covington
    nces_id: "0100930"
    status: allows
    source: https://files-backend.assets.thrillshare.com/documents/asset/uploaded_file/5469/Ccs/c6069503-6ba9-458f-9291-f2c4358d5837/Code-of-Conduct-26-27-adopted-5-5-26.doc?disposition=inline
    quote: Corporal punishment may be administered by the principal/designee or teacher in the presence of a professional employee of the Board of Education. A written report will be prepared for each incident and copies of each report must be on file in the administrative office of the school. Corporal punishment for a student documented as having a disability, in which the behavior was not a manifestation of the student's disability, will follow the same procedures as a non-disabled student.
    policy_code: Code of Student Conduct 2026-2027, section 'CORPORAL PUNISHMENT' (unnumbered)
    crdc_students_latest: 265
    last_verified: 2026-09-09
    notes: "No parental consent, notice, or opt-out provision. May be administered by the principal/designee or a teacher, witnessed by a professional employee of the Board, with a written report filed at the school. Students with disabilities are paddled under the same procedures when the behavior is not a manifestation of the disability. Document is the Word file 'CCS Code of Conduct 2026-2027' (file name says adopted 5-5-26; title page: COVINGTON COUNTY SCHOOLS, ANDALUSIA, ALABAMA, CODE OF STUDENT CONDUCT 2026-2027, Superintendent Nikki Guilford) in the Home folder of the district's Apptegy document library, listed at https://www.cov.k12.al.us/documents/parent-resources/code-of-student-conduct/816114. The board policy manual ('CCS Policy Manuel 2026-2027', 99-page PDF, https://files-backend.assets.thrillshare.com/documents/asset/uploaded_file/5469/Ccs/85e9a626-d158-419e-9274-5c8bbe998258/Code-of-Conduct-8.4.26.pdf?disposition=inline) is a scanned image with no text layer and no OCR tool was available, so the numbered board policy on corporal punishment was not read; a follow-up should OCR it for the policy code. The two old nav short-links (5il.co/3hx7n School Board Policy, 5il.co/3hx6y Code of Student Conduct) are dead (404/403). NOTE: covingtoncountyschools.org is Covington County, Mississippi, not this district."
    phone_policy:
      status: bell_to_bell_ban
      quote: Covington County Schools prohibits student possession of electronic communication devices during the instructional day or on school buses.
      source: https://files-backend.assets.thrillshare.com/documents/asset/uploaded_file/5469/Ccs/c6069503-6ba9-458f-9291-f2c4358d5837/Code-of-Conduct-26-27-adopted-5-5-26.doc?disposition=inline
      policy_code: Code of Student Conduct 2026-2027, section 'Electronic Communication and Recording Devices(FOCUS Act)' (unnumbered)
      last_verified: 2026-09-09
      notes: "Section heading names the FOCUS Act. Possession itself is prohibited during the instructional day and on buses. Consequences: 1st offense device taken up until end of day and returned to student; subsequent offenses parent pick-up, may be treated as Class II-255 or Class III-303; refusal to surrender is Class III; violation during state testing = 3-day suspension. Offense codes 255 'Cell phone possession' and 303 'Repeated cell phone offense'."
