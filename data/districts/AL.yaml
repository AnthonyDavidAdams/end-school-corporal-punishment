    quote: "X. CORPORAL PUNISHMENT (Paddling): Corporal punishment shall be administered on a limited basis and only after other forms of punishment have been tried and proven to be ineffective. The following policies shall be complied with fully when corporal punishment is administered: A. Corporal punishment shall not be administered until the nature of the offense has been explained and an opportunity to respond has been afforded the student. B. Corporal punishment shall only be administered by certified personnel and MUST be administered by or in the presence of the principal or assistant principal. C. Corporal punishment shall be administered in a prudent and reasonable manner. D. Corporal punishment shall NOT be administered in the presence of other students. E. It shall be the responsibility of the parents to notify the principal in writing of any physical or other health limitations of the student which would render corporal punishment inadvisable, or to request alternative methods of discipline."
