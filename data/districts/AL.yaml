    quote: The Board allows reasonable corporal punishment of students in accordance with the Code of Student Conduct and under the following terms and conditions. Corporal punishment will be administered only as a disciplinary measure, with due regard for the age and physical condition of the student, and without excessive force. Corporal punishment will be administered by a certified professional school system employee in the presence of another certified professional school system employee. Corporal punishment should not be administered in the presence of another student.
