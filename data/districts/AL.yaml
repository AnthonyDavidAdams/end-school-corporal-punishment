  - name: Butler County Schools
    county: Butler
    nces_id: "0100510"
    status: allows
    source: https://www.butlerco.k12.al.us/fs/resource-manager/view/c5bd3ab2-960e-40cf-9450-4f3d853ff9a6
    quote: The Board shall allow reasonable corporal punishment only after other means of discipline have failed to produce desirable results. If corporal punishment is required, it shall be administered only by a certified employee in the presence of a school administrator who has been informed beforehand of the reasons for the punishment. At no time shall corporal punishment be administered in the presence of another student. Parents who object to corporal punishment as a method of discipline shall advise the school administrator in writing of the objection; however, the school administrator has the authority to determine appropriate discipline
    policy_code: 2026-2027 Code of Conduct, section "Corporal Punishment" (p. 14, under Formal Disciplinary Actions and Procedures)
    crdc_students_latest: 248
    last_verified: 2026-09-09
    notes: "Opt-out only, and non-binding: parents who object must advise the administrator in writing, but the text says the administrator retains authority to determine discipline, and the signature page reads \"I DO___ or DO NOT ___ prefer that corporal punishment (paddling) be used ... However, I acknowledge the right of the school system's authority to use any and all disciplinary measures ... including paddling.\" Administered by a certified employee with a Board-issued paddle, no more than three licks, in the presence of a school administrator (or principal's designee), after an attempted phone call to the parent, recorded in PowerSchool, with a written explanation and witness name given to parents afterward. No disability exemption is stated. Document is the district's \"2026-2027 Code of Conduct\" PDF linked from https://www.butlerco.k12.al.us/for-parents/bcss-handbook-policies (BCSS Handbook & Policies page), which also lists \"Board Policy/Student Handbook & Code of Conduct Revisions\" dated July 17, 2025 and October 16, 2025. The Code of Conduct cites Alabama Code 16-28A-1 and Ingraham v. Wright. Corporal punishment is listed as a first-offense option for Class II (grades 6-12) and Class III offenses. No separate board policy manual (AASB-style) was found on the district site; the Code of Conduct is board-adopted and is the operative text."
  - name: Calhoun County School District
    county: Calhoun
    nces_id: "0100540"
    status: allows
    source: https://simbli.eboardsolutions.com/Policy/ViewPolicy.aspx?S=36031575&revid=ov1mAh6MTHdOGkeRYUu1aw==&ptid=opluslgy5YBB1lFkXrdgY4anQ==&secid=PIt0EdqGusPq6JYPplus1xJww==&PG=6&IRP=0&isPndg=false
    quote: "In accordance with Alabama law, the Board of Education permits the use of corporal punishment. Should corporal punishment be needed, it must be administered in accordance with the following: The student has been notified of the offense for which he/she is to receive corporal punishment and the student has been given an opportunity to explain his/her actions. The punishment shall be administered by the school principal or his/her designee(s) (certificated personnel only) and witnessed by a certified school employee. The punishment shall be administered out of the view or presence of any other students. The punishment shall consist of no more than three swats on the buttocks with a smooth surface paddle free of holes and/or cracks."
    last_verified: 2026-09-09
    policy_code: "6.16"
    crdc_students_latest: 173
    notes: "Board policy 6.16 contains no parental consent or opt-out provision. Administered by the principal or certificated designee, witnessed by a certified employee, out of view of other students, maximum three swats with a smooth paddle; no disability exemption stated. The 2026-2027 Student Code of Conduct discipline tables list 'Corporal Punishment and Parental Notification-as a last resort after other disciplinary tactics have failed and/or determined on a case by-case basis' (notification, not consent). Board Policy Manual on Simbli (S=36031575), linked from https://www.calhouncountyschools.com/our-district/policies-reports. Policy 6.16 'Corporal Punishment', status ADOPTED, original adopted 06/06/2023, last reviewed 06/06/2023, reference ALA. CODE §16-28A-2. The 2026-2027 Student Code of Conduct PDF (https://resources.finalsite.net/images/v1782915796/calhounk12alus/wufdubppvm8ain3uk87i/StudentCodeofConduct.pdf) repeats the policy text verbatim under 'Corporal Punishment-' in its definitions of disciplinary actions and, under STUDENT DUE PROCESS, provides 'Informal Due Process - Corporal Punishment and Short-Term Suspension (9 days or less)' (oral or written notice of the charge, explanation of the evidence, opportunity to present the student's version). The CCBOE Student Handbook PDF (https://resources.finalsite.net/images/v1782915853/calhounk12alus/ngt0vriwbhw6mnll9nvt/CCBOE_Student_Handbook.pdf) contains no corporal punishment text. District office: 4400 McClellan Blvd, Anniston, AL 36206. calhoun.k12.al.us redirects to calhouncountyschools.com. Stable entry point: https://simbli.eboardsolutions.com/Policy/PolicyListing.aspx?S=36031575 then chapter 6 > 6.16."
