    quote: The Board allows reasonable corporal punishment of students under the following terms and conditions. Corporal punishment will be administered only as a disciplinary measure, with due regard for the age and physical condition of the student, and without excessive force. If a parent or guardian does not want corporal punishment used in disciplining their child, it the parent or guardian’s responsibility to notify the school principal in writing.
    policy_code: "6.17"
    crdc_students_latest: 184
    last_verified: 2026-09-09
    notes: "Opt-out only: a parent or guardian who does not want corporal punishment used must notify the school principal in writing. Administered by the principal, assistant principal, or designee in the presence of another certified employee, not in the presence of another student; no disability exemption stated in the policy. Board Policy Manual is on Simbli (S=2070), reached via the redirect from https://www.coffeecountyschools.org/board-policy-manual. Policy 6.17 'Corporal Punishment', status ADOPTED, original adopted date 06/06/2019, reference Ala. Code §16-28A-2. Second paragraph: 'Corporal punishment will be administered by the school principal, the assistant principal, or his or her designee in the presence of another certified employee. Corporal punishment should not be administered in the presence of another student. The Superintendent is authorized to develop and implement procedures for administrating and documenting corporal punishment, consistent with the terms of this policy.' The typo 'it the parent' is in the source. District office: 400 Reddoch Hill Rd, Elba, AL 36323. The Simbli ViewPolicy URL carries session-style tokens; the stable entry point is https://simbli.eboardsolutions.com/Policy/PolicyListing.aspx?S=2070 then chapter 6 > 6.17."
    phone_policy:
      status: bell_to_bell_ban
      quote: The use of all electronic devices, including cell phones, beepers, pagers, and smartwatches, is prohibited during the school day. This includes using cell phones to make voice calls, to take photos/videos and to send or receive text messages. [...] The device must be turned off upon arrival on campus. If it is brought inside, it must be placed in the student's locker before the beginning of first period. The students are prohibited from keeping the device on their person, including purses, book bags, and clothing.
      source: https://files.smartsites.parentsquare.com/13161/parent_student_information_guide_for_website_1.pdf
      policy_code: Parent/Student Information Guide 2026-27, 'Cell Phones/Electronic Devices' (PDF p. 46-47)
      last_verified: 2026-09-09
      notes: Guide is a scanned PDF with no text layer; quote taken by OCR (macOS Vision) and should be checked against the page image before quoting in a hearing. Text does not cite the FOCUS Act by name (searched 'FOCUS'). Possession after the beginning of first period is a discipline violation; five-step penalty ladder from confiscation to suspension pending hearing.
