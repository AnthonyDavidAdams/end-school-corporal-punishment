  - name: Butler County Schools
    county: Butler
    nces_id: "0100510"
    status: allows
    source: https://www.butlerco.k12.al.us/fs/resource-manager/view/c5bd3ab2-960e-40cf-9450-4f3d853ff9a6
    quote: The Board shall allow reasonable corporal punishment only after other means of discipline have failed to produce desirable results. If corporal punishment is required, it shall be administered only by a certified employee in the presence of a school administrator who has been informed beforehand of the reasons for the punishment. At no time shall corporal punishment be administered in the presence of another student. Parents who object to corporal punishment as a method of discipline shall advise the school administrator in writing of the objection; however, the school administrator has the authority to determine appropriate discipline
    policy_code: 2026-2027 Code of Conduct, section "Corporal Punishment" (p. 14, under Formal Disciplinary Actions and Procedures)
    crdc_students_latest: 248
    last_verified: 2026-09-09
    notes: "Opt-out only, and non-binding: parents who object must advise the administrator in writing, but the text says the administrator retains authority to determine discipline, and the signature page reads \"I DO___ or DO NOT ___ prefer that corporal punishment (paddling) be used ... However, I acknowledge the right of the school system's authority to use any and all disciplinary measures ... including paddling.\" Administered by a certified employee with a Board-issued paddle, no more than three licks, in the presence of a school administrator (or principal's designee), after an attempted phone call to the parent, recorded in PowerSchool, with a written explanation and witness name given to parents afterward. No disability exemption is stated. Document is the district's \"2026-2027 Code of Conduct\" PDF linked from https://www.butlerco.k12.al.us/for-parents/bcss-handbook-policies (BCSS Handbook & Policies page), which also lists \"Board Policy/Student Handbook & Code of Conduct Revisions\" dated July 17, 2025 and October 16, 2025. The Code of Conduct cites Alabama Code 16-28A-1 and Ingraham v. Wright. Corporal punishment is listed as a first-offense option for Class II (grades 6-12) and Class III offenses. No separate board policy manual (AASB-style) was found on the district site; the Code of Conduct is board-adopted and is the operative text."
    phone_policy:
      status: bell_to_bell_ban
      quote: Cell phone or similar device use is prohibited in the school between the hours of 7:00 a.m. – 3:30 p.m. Local schools will determine how digital devices are stored during the school day
      source: https://www.butlerco.k12.al.us/fs/resource-manager/view/c5bd3ab2-960e-40cf-9450-4f3d853ff9a6
      policy_code: 2026-2027 Code of Conduct, 'Digital Device Use' (p. 39)
      last_verified: 2026-09-09
      notes: "Fixed-clock ban covering the whole school day. Discipline for grades 6-12: 1st offense (Class II-S09) confiscation + 10 days ISSP; 2nd (Class III-S16) 45 days Alternative School; 3rd (Class IV-S58) recommended expulsion. Students are permitted to use phones on the school bus (transportation rule 20). The Code does not cite the FOCUS Act or Act 2025-386."
    ai_policy:
      status: permitted_with_guidance
      quote: Students shall not use Artificial Intelligence (AI) platforms to avoid doing their own work. AI platforms should only be used as a supplement when authorized by a teacher. Should AI be used, the student must acknowledge and cite the use of AI, attributing text, images, multimedia, etc. to the AI source and criteria used to show how AI contributed to the result of the assignment. A violation of this rule is considered cheating and will be handled as outlined in the current Handbook and Code of Student Conduct.
      source: https://www.butlerco.k12.al.us/fs/resource-manager/view/c5bd3ab2-960e-40cf-9450-4f3d853ff9a6
      policy_code: 2026-2027 Code of Conduct, 'Artificial Intelligence (AI) Acceptable Use Policy' (pp. 41-43), section B 'Students Responsible Use'
      last_verified: 2026-09-09
      notes: Stand-alone AI acceptable-use policy with staff rules (A.1-11), student rules (B.1-7), misuse prohibition (C), privacy warning (D) and a review clause (E) referencing ALSDE guidance. The document itself writes 'Alternative Intelligence (AI) platforms' in the opening paragraph.
