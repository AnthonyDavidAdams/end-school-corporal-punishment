  - name: Blount County Schools
    county: Blount
    nces_id: "0100420"
    status: allows
    source: https://simbli.eboardsolutions.com/Policy/ViewPolicy.aspx?S=2086&revid=UnvHIFb98Ri5e51IrURyEg%3D%3D
    quote: |-
      B. Corporal punishment must be administered by the principal, assistant principal or teacher. 
       
      The corporal punishment must be witnessed by another adult which must be a principal, assistant principal or another teacher. 
       
      Corporal punishment must not be administered in front of other students. 
       
      Corporal punishment must be reasonable and not severe enough to cause bodily injury.
    last_verified: 2026-09-19
    legacy_status: allows
    notes: "Read the full text of Blount County BOE policy 05.13 'Discipline' on Simbli site S=2086 via the fetch_simbli_policy tool. Policy last revised 06/24/2024 (originally adopted 07/29/1974); status ADOPTED. Corporal punishment has no policy of its own; it sits inside 05.13 under section B, which sets out how it must be administered rather than whether it is permitted. It also appears by name in the sanction menus: 'CLASS I DISCIPLINARY SANCTIONS ... Corporal Punishment' and 'CLASS II DISCIPLINARY SANCTIONS ... Corporal punishment'. The policy contains NO parental consent or opt-out provision of any kind - no mention of parent permission, written consent, or a way to decline. Classified 'allows' on that basis. The policy requires documentation of each incident (student name, reason, type of punishment, signatures of administrator and witness, date), retained until the student graduates."
    policy_code: "05.13"
    crdc_students_latest: 92
    contact:
