      as_of: 2026-09-20
    notes: "Fayette County Public Schools publishes its board policy manual as a Google Drive folder embedded on https://www.fayette.k12.al.us/board-policy (iframe src https://drive.google.com/embeddedfolderview?id=1d_10nQGktJ4eo1jwv4S1h3uBE0ponn3F). The file is \"VI.  Students - Revised Fall 2025.docx\", Drive id 1Jn0dmWfpchGjrX_TV-4_Qs0D7hxzjqqEDKBTIKMqGoI. Exported as text and fetched server-side: 73,191 bytes, text/plain; charset=utf-8, 72,764 chars, sha256 b4be7339b05c522b9727477cf72686aaf253c1cb23665c753000f0df15341ca2; single page, hit at offset 37,253. Document title gives the date: Revised Fall 2025. Policy code: the .txt export renumbers the auto-numbered list, so corporal punishment appears as item \"16.\"; it sits between 6.12 Student Records and 6.18 Student Suspension with items 13-17 mapping to 6.13-6.17, which puts Corporal Punishment at 6.16 and Physical Restraint at 6.17 - the same numbering Winston County's AASB-model manual uses. Verbatim reference line: \"[Reference:  Ala. Code §16-28A-2 (1975)]\". This is the AASB model text; it contains no parental opt-in, so 'allows'. NOTE ON NAME: NCES says \"Fayette County\"; the site's own title is \"Fayette County Public Schools\" and the policy text says \"who reside within Fayette County Alabama and not within the limits of a city operating an independent municipal school system\" - this is the county district, not a city district."
  - name: Houston County Schools
    county: Houston
    nces_id: "0101770"
    status: allows
    source: https://docs.google.com/document/d/1A57qdS50b_f3wLQ55Q2PlPeyj3t7M5Z7soiDVK5k7NA/edit?usp=sharing
    quote: CORPORAL PUNISHMENT The Houston County Board of Education has no rule against reasonable and proper spanking/paddling of students for disciplinary reasons. Before corporal punishment is administered as a disciplinary method, the student will be given the reason for the punishment and an opportunity to explain his/her action. Corporal punishment must be administered by the administrator or by the teacher in the presence of a certified professional employee. The administrator and/or teacher will prepare a written report for each incident to be sent home on the day the corporal punishment is administered. A parent/guardian must notify the school in writing annually if he/she prohibits the school from paddling his/her student(s). The handwritten note must be delivered, in person, by the parent-by first day of each school year.
    last_verified: 2026-09-19
    legacy_status: allows
    notes: "hcboe.us is JavaScript-rendered; resolve_handbook found nothing, so I opened the site in a browser. The homepage links 'Handbook & Code of Conduct' to this Google Doc (the doc's own header carries www.hcboe.us and its index lists 'Corporal Punishment 46'); I read it server-side via its plain-text export. This is an OPT-OUT scheme, not opt-in: corporal punishment is the default and the parent must deliver a handwritten note in person by the first day of school to prevent it, renewed annually - so 'allows', not 'consent_required'. Corporal punishment is also listed among the sanctions for Class I offenses ('Subsequent Offenses ... Corporal Punishment') and Class II offenses ('First - Student conference and parental contact, disciplinary action such as corporal punishment, ASD, ISS, bus suspension, etc.'). CORROBORATION: the Houston County Board of Education Policy Manual adopted December 12, 2022 (https://s3.amazonaws.com/scschoolfiles/3282/houston_county_policy_manual_2022_1.pdf, policy 6.16 on p.98) says 'The Board allows reasonable corporal punishment of students under the following terms and conditions... A parent or guardian of student may opt out of the use of corporal punishment as a disciplinary consequence for that student by submitting a written, signed statement to the school principal.' Same conclusion. That PDF is on the district's old SchoolInsites CDN and I could not find it linked from the current hcboe.us, which is why the handbook is cited as the source. policy_code 6.16 is from that manual; the handbook itself does not number the section."
