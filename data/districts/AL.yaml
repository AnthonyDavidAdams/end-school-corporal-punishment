    policy_code: "6.10"
    crdc_students_latest: 175
    notes: "Opt-out only: 'A parent or guardian of student may opt out of the use of corporal punishment as a disciplinary consequence for that student by submitting a written, signed statement to the school principal.' Administered by a certified professional employee in the presence of another certified professional employee, not in front of other students; no disability exemption stated. MCS Board Policy Manual on Simbli (S=36030917), linked from https://www.morgank12.org/325165_2 ('Policies'). Policy 6.10 'Corporal Punishment', status ADOPTED, original adopted date 04/08/2021, reference ALA. CODE §16-28A-2. Closing sentence: 'The Superintendent is authorized to develop and implement procedures for administrating and documenting corporal punishment, consistent with the terms of this policy.' The Student Code of Conduct/Handbook is a Google Drive folder (https://drive.google.com/drive/folders/18MvvHcv1M3ePoZQXqCXQKwjOiSrsd4hC) and was not opened. District office: 235 Highway 67 South, Decatur, AL 35603. Stable entry point: https://simbli.eboardsolutions.com/Policy/PolicyListing.aspx?S=36030917 then chapter 6 > 6.10."
    phone_policy:
      status: bell_to_bell_ban
      quote: In Compliance with The Alabama FOCUS Act (Freeing our Classrooms of Unnecessary Screens for Safety), effective beginning with the 2025-2026 school year (August 1, 2025), no student shall use or operate or possess any wireless communication device in any public elementary or secondary school building or on the grounds thereof during the instructional day.
      source: https://drive.google.com/file/d/1-RRX5CBrq2uwQ_wJPiecAS4MBcxpde63/view
      policy_code: Student Code of Conduct 2026-27, 'Morgan County Schools Cell Phone Policy' (p. 62); Board Policy 6.21 referenced
      last_verified: 2026-09-09
      notes: "Cites the Alabama FOCUS Act by name. Devices 'must be turned off and stored off the student's person in a locker, vehicle, or a similar storage location during the instructional day', which 'includes class transitions, lunch, non-instructional times'. Same text published separately as 'MCS Cell Phone Policy.pdf' (https://drive.google.com/file/d/1Imyh-3Y5mEguYqA-kj0WAEI8QLZ_THGf/view) in the Student Handbooks Drive folder. Exceptions: IEP/504/health plan, supervised educational use, emergency."
    ai_policy:
      status: permitted_with_guidance
      quote: "Approved AI Use: Research assistance and summarization with proper citations. Language translation tools for educational purposes. Teacher-approved AI learning tools. Prohibited AI Use: Submitting AI-generated work as original student work. Using AI to plagiarize, cheat, or bypass critical thinking. Creating, altering, or distributing AI-generated misleading or inappropriate content. Violations will be treated as academic dishonesty and subject to disciplinary action."
      source: https://drive.google.com/file/d/1-RRX5CBrq2uwQ_wJPiecAS4MBcxpde63/view
