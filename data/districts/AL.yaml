  - name: Baldwin County Schools
    county: Baldwin
    nces_id: "0100270"
    status: bans
    source: https://resources.finalsite.net/images/v1759865717/bcbeorg/kcxlucq3qg7ekuxpe3di/Policy2025.pdf
    quote: "6.18 Corporal Punishment Corporal punishment (spanking) should not be administered by school personnel. [Reference: ALA. CODE §16-28A-2 (1975)]"
    last_verified: 2026-09-19
    legacy_status: allows
    notes: "Quote is from PAGE 96 of the Baldwin County Board of Education Policy Manual (Policy2025.pdf, 126 pp, 928,414 bytes, application/pdf, sha256 b231767615565345031e53a2b8c8135bf5757de5605225e4b2b9ef7a70cbb9c5). Direct curl returns HTTP 200 application/pdf - no browser needed. The district landing page that links it is https://www.bcbe.org/board-of-education/ethics-policy-manual ('Code of Ethics & Policy Manual'), where the download link is /fs/resource-manager/view/68a978ab-553f-4f54-ac72-e4c22e226cb7 and redirects to the resources.finalsite.net URL above. Policy 6.18 is the only corporal-punishment provision in the manual; the manual shows no per-policy revision dates. REVIEWER NOTE: the wording is 'should not be administered' rather than 'shall not' / 'is prohibited' - a prohibition in substance but phrased permissively, unlike Jefferson's and Mobile's flat bans. Legacy map said 'allows'; that is not supported by this manual."
    policy_code: "6.18"
    crdc_students_latest: null
