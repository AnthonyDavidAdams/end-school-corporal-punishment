    notes: "Source is the district's own 2026-2027 K-12 Student/Parent Handbook, linked from https://www.gf.k12.ar.us/student-handbook. Fetched server-side with fetch_document: 1,974,313 bytes, application/pdf, 161 pages, sha256 7158af07cb34b76305a74c7cd291e90703e40bfbde0c6d540c3a3eea2f1c502f. Policy 4.39 CORPORAL PUNISHMENT is on PDF page 32 (printed page 21). Classified 'allows' and not 'consent_required' because the policy is opt-OUT: verbatim, \"If a parent/guardian does not want their child administered corporal punishment, an alternative punishment form must be completed, signed and filed in the principal’s office.\" The handbook also lists corporal punishment as a consequence in the tardy ladder (PDF p.22) and marks it unavailable as an ISS alternative for fighting (Infraction 11). The handbook carries no per-policy adoption/revision date; it is the 2026-2027 edition. The district's board-policy section pages (/section-4-students) are JavaScript-rendered and return an empty shell to curl. CROSS-CHECK AVAILABLE: Green Forest also publishes its board policy manual through Simbli, site S=36032223 (linked from https://www.gf.k12.ar.us/board-of-education as \"Section 4 - Students\"). I did not read it because fetch_simbli_policy was returning the vendor bot challenge for every site during my window; a later contributor can call fetch_simbli_policy {\"site\":\"36032223\",\"code\":\"4.39\"} to confirm the board-adopted text and its revision date, which the handbook does not give."
