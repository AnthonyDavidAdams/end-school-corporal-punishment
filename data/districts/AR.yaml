cript document accordions. WEBSITE CORRECTION: the NCES website for this district, http://lafayette.k12.ar.us/, no longer resolves to a working server (CNAME to lcs.k12.ar.us, 66.204.161.66, no response on 80 or 443). The live site is https://www.lcscougars.org. Do not confuse this district with Lafayette County School District in Oxford, Mississippi (gocommodores.org) or Lafayette Parish, Louisiana."
