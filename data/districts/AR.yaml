  - name: Dewitt School District
    county: Dewitt
    nces_id: "0500001"
    status: allows
    source: https://docs.google.com/document/d/1m-qoIQ-OmMabFiAjJl-s_JXoVPnAHh1qimiK8cJL_2o/export?format=txt
    quote: "Discipline: Corporal Punishment The DeWitt School Board authorizes the use of corporal punishment to be administered in accordance with this policy by the Superintendent or the Superintendent’s designated staff members who are required to have a state-issued license as a condition of their employment Prior to the administration of corporal punishment, the student receiving the corporal punishment shall be given an explanation of the reasons for the punishment and be given an opportunity to refute the charges."
