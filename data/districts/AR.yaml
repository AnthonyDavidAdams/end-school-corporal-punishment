    notes: "HONEST UNKNOWN for the CURRENT policy, and a likely second policy change worth a browser-equipped contributor's time. What I opened, all without a browser. (1) https://www.wmsd.net/page/state-required-information - the site is behind an Imperva 'Client Challenge' and returns a 3,038-byte stub to curl and never finishes loading in Chrome, but the text proxy https://r.jina.ai/<url> reads it. That page lists \"Student Discipline Policies\" by year, and for WMSD those ARE the student handbooks, published as Google Drive folders. (2) CURRENT YEAR, secondary: https://files-backend.assets.thrillshare.com/documents/asset/uploaded_file/3381/Awm/8dd1988f-4bda-42cb-bd55-154e68fd3fb5/WMSD-Secondary-Schools-Student-Handbook-2026-2027.pdf - fetch_document: 2,235,125 bytes, application/pdf, 86 pages, 239,325 chars, sha256 d7d955bc4d041df738baf5f041ff71d04423c9d56e1300a29f563cf6d985dd89. ZERO hits for \"corporal punishment\", \"paddl\" or \"spank\". Its table of contents has no corporal-punishment entry. (3) 2024/2025 filing (Drive folder 13-G8fc2K6TmEstXl7s7x9o_5Iq0VvoVE) - BOTH handbooks from that year DO permit it. Elementary: https://drive.google.com/uc?export=download&id=1KO0pJYyTHECezhbl_Eyn9qyelNMXOg9v (\"2024-2025 Elementary School Handbook.pdf\", 9,543,262 bytes, 105 pages, 295,134 chars, sha256 ede68559f1402e3ff020189748394d4a36702b77005616fa773815433662d627), \"CORPORAL PUNISHMENT POLICY\" on page 59, verbatim: \"Corporal Punishment may be administered by any certified employee of the district to any pupil for disruptive or unmanageable conduct, insubordination, profane, violent, vulgar or insulting language or other conduct that would tend to disrupt the educational process.\" Senior high: https://drive.google.com/uc?export=download&id=1NtduDzUFJTBSpC0WUT83KTLpZ7V3_6ks (1,729,003 bytes, 159 pages), \"CORPORAL PUNISHMENT POLICY\" on page 92. (4) 2025/2026 filing (Drive folder 1U62JliDIjT7cEv3Ztbpjj48RWSLlXuiD) - THIS IS THE BLOCKER. It holds \"2025-2026 Elementary School Handbook\" (Drive id 19WN6r1nc6PIbBgS35Jtvb_McBDRBXEhv, whose actual document title is \"2026-2027 Elementary School Handbook (EDITING)\") and \"WMSD Secondary Schools Student Handbook\" (13ldjoQ0IRH0Xoa_sTPGBKFeZOu7OjtJe). Both are native Google Docs with export disabled: /export?format=txt, /export?format=pdf and /feeds/download/documents/export/Export all return HTTP 404, and drive.google.com/uc?export=download returns a 1,789-byte HTML stub. \"Virtual Academy Student Handbook.pdf\" (1WKfXwqbU29cesAqCDBx-GS9QMEYqh_N9, 2,684,646 bytes) is a scan with no text layer (needs_ocr true). (5) No WMSD board policy manual is published or indexed; https://www.wmsd.net/page/board-policies returns 404. resolve_handbook on wmsd.net returns no candidates. SUGGESTIVE BUT NOT PROOF OF A BAN: a WMSD board-minutes PDF under files-backend.assets.thrillshare.com/.../Wmsd is indexed by Google with the sentence \"Foister requested corporal punishment policy be deleted from district policy.\" SO: permitting language was in place for and after the CRDC year, and is absent from the current secondary handbook. I will not call that a ban, and I will not call a 2024-25 document the current policy. NEXT CONTRIBUTOR: open Google Doc 19WN6r1nc6PIbBgS35Jtvb_McBDRBXEhv in a browser (it renders, it just cannot be exported) and submit with source_text - elementary is where this district's paddling happens, so that one document decides this record. Then find the board-minutes PDF to date the deletion."
