    status: bans
    source: https://simbli.eboardsolutions.com/Policy/ViewPolicy.aspx?S=36031970&revid=TLslshrLYckOSqqBEINslKHLA%3D%3D
    quote: Corporal punishment does not include the necessary and reasonable use of physical force to defend against physical force or to otherwise prevent a student from injuring himself or others.
    policy_code: "4.39"
    crdc_students_latest: null
    last_verified: 2026-09-25
    method: vendor_manual
    parent_control: unknown
    quotes:
      - Corporal punishment does not include the necessary and reasonable use of physical force to defend against physical force or to otherwise prevent a student from injuring himself or others.
      - Corporal punishment also does not apply to the use of reasonable physical force necessary to maintain control and order or to remove a disruptive student from the class or school setting.
      - The use of corporal punishment in any form is strictly prohibited in the public schools.
      - No student will be subject to the infliction of corporal punishment by any teacher, other student, administrator, or other school personnel.
      - No teacher, administrator, student, or other person will subject the student to corporal punishment or condone the use of corporal punishment by any person under his/her supervision or control.
      - Permission to administer corporal punishment will not be sought or accepted from any parent, guardian or school official.
    notes: Board policy 4.39 (ASBA) on Simbli, read 2026-09-25 by policy code in a sweep of Simbli sites. Identity is name and state matched against the federal LEA directory.
