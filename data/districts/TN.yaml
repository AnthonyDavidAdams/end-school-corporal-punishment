    quotes:
      - The Board authorizes the Director of Schools to determine whether corporal punishment shall be administered.
      - Corporal punishment shall be administered only after other less stringent measures have failed or if the conduct of a student is of such nature that corporal punishment is the only reasonable form of punishment under the circumstances.
      - Only principals, assistant principals, or teachers with the approval of the principal are authorized to administer corporal punishment;
      - Corporal punishment shall be administered in the presence of another professional employee;
      - If a student has a disability, corporal punishment shall be administered only when the school has received written parental permission.
      - The parental permission shall include the type of corporal punishment that is allowed and the circumstances under which it is permitted.
      - The principal shall notify the parent(s)/guardian(s) any time corporal punishment is used.
      - A disciplinary record shall be maintained and shall contain the name of the student, the type of misconduct, the type of corporal punishment administered, the name of the person administering the punishment, the name of the witness present, and the date and time of punishment.
      - August 29, 2023 Corporal Punishment Disciplinary records shall be ﬁled in the school ofﬁce and made available to parent(s)/guardian(s) or students, whichever is appropriate.
