    quotes:
      - CORPORAL PUNISHMENT FOR K-6 STUDENTS ONLY Corporal punishment of students is permissible by Louisiana Legislative Act 688 of 1976 and the Avoyelles Parish School Board's Corporal Punishment Policy required by this act.
      - Corporal punishment may be administered to a student by the principal or the assistant principal only.
      - Corporal punishment may be administered to a student in lieu of a short-term suspension for violation of any of the school rules, the violation of which would allow a student to be suspended.
      - (It is the school administrators' responsibility to determine whether or not corporal punishment will be administered.) 4.
      - Parental consent will be obtained by the principal prior to administering corporal punishment to any student.
      - "Corporal is not authorized for:"
      - Students with exceptionalities according to HB 79 (Prohibits the administration of corporal punishment to students with exceptionalities, except gifted and talented students, and makes this law applicable to charter schools.
      - Additionally, prohibits the use of corporal punishment with students who are eligible for services under Section 504 of the Rehabilitation Act of 1973 and who have an IAP).
