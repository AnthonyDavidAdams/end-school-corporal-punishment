  - name: Chickasaw County School District
    county: Chickasaw
    nces_id: "2800200"
    status: allows
    source: https://simbli.eboardsolutions.com/Policy/ViewPolicy.aspx?S=36031690&revid=qLBplusRtgjp8l46O9Gr1zCqw==&ptid=9slshUHzTHxaaYMVf6zKpJz3Q==&secid=hSGrPqF4gplus5plusbZ62PcQufA==&PG=6&IRP=0&isPndg=false
    quote: Reasonable corporal punishment of a non-disabled student is permitted as a disciplinary measure in order to preserve an effective educational environment which is free from disruption and is conducive to furthering the educational mission of the board.
    last_verified: 2026-09-09
    policy_code: JDB
    crdc_students_latest: 192
    notes: "No parental consent or opt-out provision appears in policy JDB. Disability exemption: \"School personnel is prohibited from using corporal punishment on any student with a disability. A student with a disability is any student who has an IEP or Section 504 plan.\" It may be administered by the principal, assistant principal, or a teacher, in the presence of another school employee, only after less stringent measures have failed unless the conduct is extreme; must be reasonable and moderate. MSBA policy service: the district's Board of Trustees page https://www.chickasaw.k12.ms.us/page/board-of-trustees/ links 'Board Policies Public View' -> https://chickasaw.msbapolicy.org/ which redirects to Simbli site S=36031690. Policy JDB status ADOPTED, Original Adopted Date 07/20/2012, Last Revised Date 06/08/2026, Last Reviewed Date 06/08/2026. Cites Miss. Code 37-11-57 and 11-46-9, Ingraham v. Wright; cross-references AAA and JD. District office is in Houston, MS."
    phone_policy:
      status: bell_to_bell_ban
      quote: "Cell phones: no student attending the Chickasaw County School District will be allowed to use a cellular phone device except when directed by a teacher and/or building administrator."
      source: https://drive.google.com/file/d/1R6XuRcUGdUJtvs08YVOozg_P_0jpaz1g/view
      policy_code: 2026-2027 Student Handbook, 'Technology' section (unnumbered)
      last_verified: 2026-09-09
      notes: Blanket no-use rule at any time on campus unless a teacher or administrator directs otherwise; confiscation with a $25 retrieval fee. No state statute cited; no separate classroom/lunch distinction.
    ai_policy:
      status: no_policy
      quote: ""
      source: https://drive.google.com/file/d/1R6XuRcUGdUJtvs08YVOozg_P_0jpaz1g/view
      policy_code: ""
      last_verified: 2026-09-09
      notes: "Read the full 2026-2027 Student Handbook (141k chars): no 'artificial intelligence', 'AI', 'A.I.', 'ChatGPT' or 'generative'. Plagiarism appears only in the Technology Acceptable Use Policy."
