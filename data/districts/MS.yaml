    source: https://content.myconnectsuite.com/api/documents/e1c7caa4a23d4d7da13a27c69df09b9e.pdf
    quote: "Corporal Punishment Reasonable corporal punishment may be administered as a disciplinary measure to preserve an effective learning environment. The superintendent shall enforce rules governing corporal punishment, including the following: 1. Corporal punishment must be reasonable, moderate, and not administered maliciously or for revenge. The student's size, age, and condition must be considered. 2. The principal or a teacher may administer corporal punishment. 3. It must be administered in the presence of another certified staff member and outside the view of other students. 4. Suspensions of up to three days will be used as an alternative to corporal punishment. 5. Parents must notify the school in writing each school year if they refuse corporal punishment. Policy Reference: CCSD Board Policy JDB; Miss. Code Ann. § 37-11-57."
