    source: https://www.westjasper.org/files/documents/Handbooks/2026-2027%20WJSD%20Student%20Handbook.pdf
    quote: CORPORAL PUNISHMENT Reasonable corporal punishment of a student is permitted as a disciplinary measure in order to preserve an effective educational environment which is free from disruption and is conducive to furthering the educational mission of the board. Parents or guardians are not allowed to administer corporal punishment on West Jasper School District grounds. Students who cannot be given corporal punishment may be suspended out of school for offenses which would merit corporal punishment.
    last_verified: 2026-09-09
    policy_code: Student Handbook 2026-27, 'Corporal Punishment' (p. 43-46)
    crdc_students_latest: 145
    notes: No parental consent or opt-out provision; 'Students who cannot be given corporal punishment may be suspended out of school for offenses which would merit corporal punishment.' Administered by the teacher, principal or assistant principal (lead teachers may be authorized), 'not to exceed three licks per day', 'in the presence of a certified employee'; 'HB1182, corporal punishment is prohibited for students with a disability who has an IEP or Section 504 Plan. West Jasper School District will suspend any student with a disability who has an IEP or Section 504 Plan, rather than administer corporal punishment.' Handbook is 'West Jasper School District School Year 2026-27' (62 pages), linked from westjasper.org. The K-6 and 7-12 discipline step plans list 'One day ISD or Corporal Punishment' (steps 1-3), the tardy policy lists 'Corporal punishment or 1 day of ISD' at the 4th unexcused tardy, and bus offenses list corporal punishment as an option for the first three minor/intermediate offenses. The district's board policy manual link (https://wjasper.msbapolicy.org/) redirects to Simbli (https://simbli.eboardsolutions.com/Index.aspx?S=36031853), whose policy listing requires JavaScript and returned no policy text to curl or WebFetch; no Wayback capture found. The MSBA policy code (likely JDA) could not be confirmed. CRDC name 'WEST JASPER CONSOLIDATED SCHOOLS'; NCES and district style it 'West Jasper School District'.
