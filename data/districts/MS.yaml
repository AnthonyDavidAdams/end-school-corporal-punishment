  - name: Scott County School District
    county: Scott
    nces_id: "2803900"
    status: allows
    source: https://simbli.eboardsolutions.com/Policy/ViewPolicy.aspx?S=36031781&revid=R988PCslsho1mFQtXpkelFwog==&ptid=9slshUHzTHxaaYMVf6zKpJz3Q==&secid=hSGrPqF4gplus5plusbZ62PcQufA==&PG=6&IRP=0&isPndg=false
    quote: Reasonable corporal punishment of a non-disabled student is permitted as a disciplinary measure in order to preserve an effective educational environment which is free from disruption and is conducive to furthering the educational mission of the board. School personnel is prohibited from using corporal punishment on any student with a disability. A student with a disability is any student who has an IEP or Section 504 plan.
    last_verified: 2026-09-09
    policy_code: JDB
    crdc_students_latest: 259
    notes: "No parental consent or opt-out provision. Prohibited for any student with an IEP or Section 504 plan. To be used only after less stringent measures (counseling, parent conferences, other discipline) have failed unless the conduct is extreme; administered by the principal, assistant principal, or administrative assistant in the presence of another school employee; paddling must be witnessed by at least one school employee. MSBA policy service on Simbli (scott.msbapolicy.org redirects to simbli.eboardsolutions.com S=36031781, linked from https://www.scott.k12.ms.us/ as 'Board MSBA Policy'). Policy JDB: Original Adopted Date 04/08/2014, Last Revised Date 06/11/2019, Status ADOPTED; cites Miss. Code 37-11-57 and 11-46-9 and Ingraham v. Wright. Related policies in the J section: JD Student Discipline (10/08/2019), JDA Discipline Plan, JCD(2). Simbli listing is JavaScript-rendered; read in Chrome."
    phone_policy:
      status: bell_to_bell_ban
      quote: Therefore, cell phones are not to be seen or heard, and cell phone usage is prohibited inside school buildings or on campus during school hours.
      source: https://4.files.edl.io/3f16/07/09/25/163945-e92cd01a-b4a2-412b-846c-0c82d1321361.docx
      policy_code: 2025-2026 Student Handbook, 'Scott County School District's Electronic Discipline Plan - Cell Phone/Electronic Devices' (p. 15; board code JCBA in margin)
      last_verified: 2026-09-09
      notes: "Latest handbook posted on https://www.scott.k12.ms.us/apps/pages/handbooks is 2025-2026 (July 9, 2025 .docx); no 2026-27 edition was posted as of 2026-09-09. Consequences: 1st warning; 2nd confiscation + 3 days ISR; 3rd 3 days OSS; further 5 days OSS with possible alternative placement. No state statute is cited in the cell phone section."
    ai_policy:
      status: no_policy
      quote: ""
      source: https://4.files.edl.io/3f16/07/09/25/163945-e92cd01a-b4a2-412b-846c-0c82d1321361.docx
      policy_code: ""
      last_verified: 2026-09-09
      notes: "Read the full 2025-2026 Student Handbook (192k chars): no 'artificial intelligence', 'AI', 'A.I.', 'ChatGPT' or 'generative'. Cheating appears in the Student Conduct rules and the discipline ladder without reference to AI; the Internet Acceptable Use Policy mentions plagiarism only."
