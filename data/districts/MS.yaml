  - name: South Panola School District
    county: Panola
    nces_id: "2804050"
    status: allows
    source: https://files-backend.assets.thrillshare.com/documents/asset/uploaded_file/5225/Bams/b8765fcc-d296-4094-a195-97e25eaf1bf5/2026---South-Panola-Schools---BMS-Parent-Student-Handbook-v5-7_20.pdf
    quote: The South Panola School District policy allows corporal punishment under certain conditions. Contact your school for an opt-out form for you to sign if you choose not to have your child paddled.
    last_verified: 2026-09-09
    policy_code: 'Batesville Middle School 2026-2027 Student Handbook, "Discipline" section, "CORPORAL PUNISHMENT (CP)" (p. 11); Appendix E: Corporal Punishment (p. 42)'
    crdc_students_latest: 192
    notes: "The handbook text frames it as opt-out (\"Contact your school for an opt-out form ... if you choose not to have your child paddled\"). Appendix E is a signed form with two boxes: \"South Panola School District Administration has my permission to use corporal punishment as a means to correct behavior. Prior to issuing corporal punishment, a phone call will be made to the parent/guardian.\" and \"South Panola School District does NOT have my permission to use corporal punishment as a means to correct behavior.\" No witness, administrator, or disability provisions are stated in the handbook; the underlying board policy could not be read (see notes). The district's board policy manual is on MSBA/Simbli (southpanola.msbapolicy.org -> https://simbli.eboardsolutions.com/Index.aspx?S=36031786), but the policy listing redirects to https://simbli.eboardsolutions.com/Login.aspx?S=36031786 and is not publicly readable, so the status rests on the school handbook, which states district policy. The handbook is the Batesville Middle School (grades 4-5) 2026-2027 Parent/Student Handbook, linked from https://www.spsd.k12.ms.us/o/bams/documents/ (also via short link https://aptg.co/hnYHRQ). It lists corporal punishment as a consequence for 2nd-offense minor bus infractions, 2nd-offense electronic device use, tardies, and vandalism on the disciplinary referral form. Possible internal tension: the discipline section describes an opt-out, while the Appendix E form is worded as permission/no permission; recorded here as allows (opt-out) per the policy sentence. Other school handbooks (SPHS, BJHS, BIS, Pope, BAES) were not found in their document folders. District office is in Batesville, MS."
    phone_policy:
      status: bell_to_bell_ban
      quote: Electronic devices are not permitted and are not to be used at any time unless approved by administration. This includes, but is not limited to, cellphones, MP3 players, iPods, etc.
      source: https://files-backend.assets.thrillshare.com/documents/asset/uploaded_file/5225/Bams/b8765fcc-d296-4094-a195-97e25eaf1bf5/2026---South-Panola-Schools---BMS-Parent-Student-Handbook-v5-7_20.pdf
      policy_code: Batesville Middle School 2026-2027 Student Handbook, Discipline, 'Electronic Devices' (p. 9); identical text in the South Panola High School and Batesville Junior High School 2026-2027 Secondary Student Handbooks
      last_verified: 2026-09-09
      notes: "Devices not permitted at all (listed under 'Items to Leave at Home'); 1st offense warning and parent pick-up, 2nd offense corporal punishment or 1 day ALS, 3rd 3 days ALS; refusal to surrender = 3 days ALS. No state statute cited. SPHS handbook: https://aptg.co/mMBpr- (resolves to a signed S3 URL); BJHS handbook: https://files-backend.assets.thrillshare.com/documents/asset/uploaded_file/5225/Bjhs/4de57470-c2e8-4cec-8ad6-d7cad9b0b8b9/2026---South-Panola-Schools---BJHS-Parent-Student-Handbook-v5-7_20.pdf?disposition=inline"
    ai_policy:
      status: no_policy
      quote: ""
      source: https://files-backend.assets.thrillshare.com/documents/asset/uploaded_file/5225/Bams/b8765fcc-d296-4094-a195-97e25eaf1bf5/2026---South-Panola-Schools---BMS-Parent-Student-Handbook-v5-7_20.pdf
      policy_code: ""
      last_verified: 2026-09-09
      notes: "Read the full BMS 2026-27 handbook (125k chars) and grepped the SPHS and BJHS 2026-27 handbooks: no 'artificial intelligence', 'AI', 'A.I.', 'ChatGPT' or 'generative'. Academic Dishonesty section does not mention AI."
