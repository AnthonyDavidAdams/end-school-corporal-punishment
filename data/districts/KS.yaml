      - Corporal punishment shall be used only in relation to behavior arising in the student-school relationship.
      - No corporal punishment shall be cruel, unusual or excessive.
      - No corporal punishment shall be inflicted so as to cause any permanent or disabling injury to the student.
      - R Corporal Punishment JDA-R-2 Corporal punishment may also be administered for any violation of the behavior code.
