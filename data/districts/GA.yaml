    legacy_status: bans
    notes: "No primary source states a position either way. Cherokee County School District (GA) does NOT use Simbli; it publishes its own Online Policy Manual as HTML pages at https://www.cherokeek12.net/board-of-education/online-policy-manual (fetched 200, 83,297 bytes, text/html). Section J (Students) lists 27 policies (JAA, JBC, JBC(1), JBC(2), JBC(4), JBCC, JBD, JCAB, JCAC, JCAC(2), JCDAA, JCEB, JD, JDD, JG, JGC, JGCC, JGF, JGF(2), JGI, JHC, JHCB, JHCC, JK, JQK, JR, JS) -- there is no JDA or any policy titled Corporal Punishment, and the whole manual index page contains zero occurrences of the string 'corporal'. Policy JD - Student Discipline (https://www.cherokeek12.net/j-students/jd-student-discipline, 200, 57,597 bytes, text/html; ADOPTED August 2, 2001, REVISED July 16, 2020) says only: 'The Cherokee County Board of Education each year will approve student conduct and discipline procedures in the “Student Code of Conduct.” That Policy, as approved on a yearly basis, is incorporated herein by reference.' That incorporated Code of Conduct SY2026-27 (https://resources.finalsite.net/images/v1785441549/cherokeek12net/wbynmydgcfgtjdnlmus8/CodeofConductSY2026-27.pdf; fetch_document: 7,612,179 bytes, application/pdf, 99 pages, 315,344 chars extracted) returned ZERO hits for 'corporal punishment', 'paddl' and 'spank'. The SY2026-27 Student Parent Handbook (https://resources.finalsite.net/images/v1783513870/cherokeek12net/c1batzough6fn1wncj9n/StudentParentHandbookSY2026-27.pdf; 2,543,337 bytes, application/pdf, 43 pages, 179,406 chars) also returned zero hits. resolve_handbook on cherokeek12.net found no board_policy_systems. The district is silent in every primary document I could open; silence is not a prohibition, so this is filed unknown rather than 'bans' as the legacy map claimed. A reviewer wanting to close this would need a records request or an administrative regulation not published online."
