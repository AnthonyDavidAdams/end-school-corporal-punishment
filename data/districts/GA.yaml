    quotes:
      - Any principal or other designated school administrator employed by the Board of Education, in order to maintain proper control and discipline over students under his or her care and supervision, may, in the exercise of sound discretion, administer corporal punishment to any student or students under his or her care and supervision.
      - No other employee of the Board or any other person, including the parents or guardian of such student, may administer corporal punishment in any school or on any school property in this school district.
      - Corporal punishment shall never be used as a first line of punishment for misbehavior unless the student was informed beforehand that specific misbehavior could occasion its use;
      - provided, however, that corporal punishment may be employed as a first line of punishment for those acts of misconduct which are so antisocial or disruptive in nature as to shock the conscience.
      - Corporal punishment shall not be administered to a student whose parents or legal guardian have filed with the principal of the school a statement expressly objecting to the use of corporal punishment or a statement from a medical provider licensed in Georgia stating that corporal punishment is detrimental to the student's mental or emotional stability.
