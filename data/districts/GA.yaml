      - LIMITATIONS In compliance with the state requirements under which the Wayne County School System&rsquo;s Pre-Kindergarten Program operates, the use of any form of corporal punishment, including but not limited to paddling, striking, or hitting, shall be strictly forbidden in the Pre-Kindergarten Program.
