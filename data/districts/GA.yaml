    legacy_status: allows
    notes: "Read with the project's fetch_simbli_policy tool, site 4041 (S number taken from the district's own board page https://www.coffee.k12.ga.us/boe, which links simbli.eboardsolutions.com/SB_ePolicy/SB_PolicyOverview.aspx?S=4041). Tool response 12,012 bytes, application/json; it reported district 'Coffee County Schools' and 203 policies in the index, so the S number is confirmed against the right district. Board Policy JDA 'Corporal Punishment', status ADOPTED, originally adopted 12/21/2000, last revised 09/28/2006. This is OPT-OUT, not opt-in: corporal punishment is authorized by default and is withheld only from students whose parents have affirmatively filed a written objection -- hence 'allows'. The bracketed [...] in the quote elides four intervening bulleted conditions (not excessive or unduly severe; not the first line of punishment; administered in the presence of certified educational personnel informed beforehand in the student's presence; written explanation on request); both quoted sentences are verbatim from the policy text. Companion records exist: JDA-R(0) 'Corporal Punishment' (adopted 01/02/2009) is a CORPORAL PUNISHMENT EXEMPTION LETTER which states 'Georgia School Law 20-2-730 allows for corporal punishment to be administered. It also provides that the parent/guardian may request exemption.' and 'If you elect for your child not to have corporal punishment administered (be paddled), then an alternate punishment will result, i.e., in-school suspension, detention and/or suspension from school.' Simbli is JavaScript-only and Imperva-protected, so this URL cannot be curled directly; it is machine-readable via fetch_simbli_policy."
