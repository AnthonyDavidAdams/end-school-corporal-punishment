      - Any principal or other designated school administrator employed by the Board of Education, in order to maintain proper control and discipline over pupils under his or her care and supervision, may, in the exercise of sound discretion, administer corporal punishment to any pupil or pupils under his or her care and supervision.
      - No other employee of the Board or any other person, including the parents or guardian of such child or children may administer corporal punishment in any school or on any school property in this school district.
      - Except as noted under Limitations below, such measures may include, but not be limited to, the administration of corporal punishment in the exercise of sound discretion.
      - The corporal punishment shall not be excessive or unduly severe.
