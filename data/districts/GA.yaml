    method: vendor_manual
    source: https://resources.finalsite.net/images/v1769614185/atlantapublicschoolsus/i0mzvpi6ebsmyh1xghsb/EmployeeHandbook2025-26.pdf
    quote: APS prohibits the use of corporal punishment by all employees.
    last_verified: 2026-09-19
    legacy_status: bans
    notes: "Atlanta Public Schools Employee Handbook 2025-26, page 10, section headed \"Corporal Punishment\"; the handbook's own date line reads \"Atlanta Public Schools Employee Handbook 2025-26 January 28, 2026\". Fetched server-side from the district's own Finalsite CDN (atlantapublicschoolsus): 1663603 bytes, application/pdf, 43 pages, sha256 acf82d1bf467a2d7f1808d154d5a2ce579051f41cb80fb05012b69bce23e7325. The surrounding text continues: \"Corporal punishment includes any consequence that results in physical pain or harm to students. On rare occasions, physical force may be necessary to restrain a person or to prevent injury in accordance with policy JGF (2) Seclusion or Restraint of Students and related administrative regulations.\" WHY NOT A BOARD POLICY: APS publishes board policy on Simbli site 36031014 (confirmed by resolve_handbook on https://www.atlantapublicschools.us and by opening the manual, whose header reads \"Policy Listing | Atlanta Public Schools\"). I read the whole J. Students section (43 entries, JAA through JS) and the whole G. Personnel section in a browser: there is NO policy or regulation titled Corporal Punishment. I opened JCDA-R(1) Student Code of Conduct (adopted 07/12/2010, last revised 06/30/2023) and searched its full rendered text (135,695 characters) for corporal/paddl/spank — zero matches. The handbook is therefore the district's own primary statement and is machine-fetchable, which the Simbli pages are not."
