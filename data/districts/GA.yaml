    last_verified: 2026-09-25
    notes: Board policy on Simbli, read 2026-09-25 by policy code in a sweep of Simbli sites; the district name is from the site's index page. Identity is name and state matched against the federal LEA directory.
    county_source: nces_edge_geocode_2023_24
    parent_control: opt_in
    quotes:
      - Corporal punishment may be administered in Atkinson County schools by the principal, assistant principal, or classroom teacher.
      - Corporal punishment shall not be excessive or unduly severe;
      - Corporal punishment shall never be used as a first line of punishment for misbehavior unless the student was informed beforehand that specific misbehavior could occasion its use;
      - provided, however, that corporal punishment may be employed as a first line of punishment for those acts of misconduct which are so antisocial or disruptive in nature as to shock the conscience.
      - The principal or teacher who administered corporal punishment must provide the child&rsquo;s parent, upon request, a written explanation of the reasons for the punishment and the name of the witness, who was present;
      - Corporal punishment shall not be administered to a student whose parents or legal guardian has not filed a permission form with the principal of the school.
  - name: Atlanta Public Schools
