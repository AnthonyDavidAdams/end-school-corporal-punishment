    notes: "NAME CORRECTION for the reviewer: the NCES row is truncated and the school's actual published name is 'Georgia School for Innovation and the Classics' (GSIC), not '...and the Arts'. Identity confirmed by matching the NCES directory record for 1300238 (5073 Storey Mill Rd, Hephzibah GA 30815, (706) 434-8085, independent charter district, Richmond County) against the school's own site www.gsiccharter.com, which publishes the same address and phone. The domain gsia.org in the slice's neighbourhood is a parked GoDaddy for-sale page and is NOT this school. Source: GSIC Family Handbook 2026-2027, page 22 of the PDF (printed page 22-23), under 'Student Discipline Code' > 'Level Three Consequences'. Found via the project's resolve_handbook on gsiccharter.com, which located it on https://www.gsiccharter.com/family-handbook/ as a Google Drive file (view link 1s7UYg4co3gclESsHiH2Z4S4IMaTpi0QE); cited as the Drive direct-download form. Fetched server-side with fetch_document: 719,654 bytes, served as application/octet-stream, 41 pages, 101,053 characters of text, sha256 b58d6b1e4ffc17152fb26648f825c46dea3e334a632c6c279d2ed1c4f2b567b9. 'Corporal Punishment' appears exactly once in the whole handbook, as one of the listed Level Three consequences; there is no separate corporal punishment policy, no parental opt-in and no opt-out anywhere in the document, so this is 'allows' rather than 'consent_required'. No board policy manual was found published on the school's site; the Governing Board page (https://www.gsiccharter.com/governing-board/) carries no policy manual. The handbook bullets are rendered with the character U+2022 in the extracted text; the quote reproduces them as they appear. Quote-matching note for the reviewer: the quoted passage runs across line breaks in the PDF's own text layer, so an exact raw-substring search on the extracted text will miss it; it matches once whitespace is normalized, which is how it was checked here against the server's cached extraction."
