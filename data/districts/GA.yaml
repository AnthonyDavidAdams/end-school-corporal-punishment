  - name: Laurens County Schools
    county: Laurens
    nces_id: "1301890"
    status: allows
    source: https://simbli.eboardsolutions.com/Policy/ViewPolicy.aspx?S=4101&revid=MPVho6cn3DYM2P3VPk07jg==&ptid=amIgTZiB9plushNjl6WXhfiOQ==&secid=p6v70fD4K8ukRv6vtplusTtSg==&PG=6&IRP=0&isPndg=false
    quote: Any principal or other designated school administrator employed by the Board of Education, in order to maintain proper control and discipline over pupils under his or her care and supervision, may, in the exercise of sound discretion, administer corporal punishment to any pupil or pupils under his or her care and supervision.
    policy_code: JDA
    crdc_students_latest: 231
    last_verified: 2026-09-09
    notes: "Opt-out: \"Corporal punishment shall not be administered to a child whose parents or legal guardian have filed with the principal of the school a statement expressly objecting to the use of corporal punishment or a statement from a medical doctor licensed in Georgia stating that corporal punishment is detrimental to the child's mental or emotional stability.\" Only a principal or designated administrator may administer it, never a teacher or parent; it must be witnessed by another certified employee informed beforehand in the pupil's presence; a written explanation and the witness's name are provided to parents on request; it may not be excessive and generally not a first-line punishment. No IEP/504 exemption beyond the doctor's-statement route. Simbli/eBoard (GSBA) board policy manual, site S=4101, reached from https://www.lcboe.net/338421_2 (Board of Education page, link 'eBoard - Laurens County' -> https://simbli.eboardsolutions.com/Index.aspx?S=4101). Policy JDA status ADOPTED, Original Adopted Date 02/14/2008, Last Reviewed Date 08/13/2020. References O.C.G.A. 20-2-730 through 20-2-732. Simbli listing is JavaScript-rendered; the ViewPolicy link was obtained by filtering the listing to section J in a browser."
