      - Corporal Punishment The Decatur County Board of Education authorizes any principal or assistant principal employed by the Board to administer, in the exercise of his/her sound discretion, corporal punishment on any student placed under his/her supervision in order to maintain proper control and discipline.
      - The corporal punishment shall not be excessive or unduly severe;
      - Corporal punishment shall never be used as a first line of punishment for misbehavior unless the parent and student was informed beforehand that specific misbehavior could occasion its use;
      - provided, however, that corporal punishment may be employed as a first line of punishment for those acts of misconduct which are so antisocial or disruptive in nature as to shock the conscience;
      - The principal or assistant principal who administers corporal punishment will provide the child's parent, upon request, a written explanation of the reason for the punishment and the name of the principal or assistant principal, and/or witness of the principal or assistant principal, who was present;
      - provided, however, that such an explanation(s) shall not be used as evidence in any subsequent civil action brought as a result of the corporal punishment and Corporal punishment shall not be administered to a child whose parents or legal guardian has upon the day of enrollment of the student filed with the principal of the school a statement objecting to its use or from a medical doctor licensed in Georgia stating that it is detrimental to the child's mental or emotional stability.
