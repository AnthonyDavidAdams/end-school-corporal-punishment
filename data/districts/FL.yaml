    status: allows
    source: https://files.smartsites.parentsquare.com/8214/2026-2027_code_of_conduct.pdf
    quote: "If a teacher feels that corporal punishment is necessary, at least the following procedures shall be followed: 1. The use of corporal punishment shall be approved in principle by the principal before it is used, but approval is not necessary for each specific instance in which it is used."
    policy_code: "5.30"
