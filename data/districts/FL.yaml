      superintendent: Darryl Taylor, Jr.
      board_page: https://www.calhounflschools.org/members
      contact_page: https://www.calhounflschools.org/district-directory
    notes: "Quote from the 2026-2027 Code of Conduct (CCSB Approved July 14, 2026), opened directly: 1,024,309 bytes, application/pdf, 52 pages, hit on printed page 8, section 'AUTHORITY OF THE TEACHER F.S. 1003.32'. Cross-checked against the underlying School Board Policy 5.30 'Student Control' (https://files.smartsites.parentsquare.com/8214/policy_530.pdf, 104,259 bytes, 2 pages), which says corporal punishment may be administered 'as provided by law and defined in the Code of Conduct' and that the Board must review the provisions for corporal punishment every 3 years. Policy 5.30's own footer/history block reads 'Revised: 10/8/2024' and 'ADOPTED: 6/12/2204; REVISION DATE(S): 4/13/10;10/8/2024' -- the '2204' adoption year is a typo in the source document itself (almost certainly 2004); left policy_adopted null rather than guess, and quoted the typo verbatim here for the record. Searched both documents for opt-in/advance-consent language ('object to the use of corporal', 'written permission', 'opt', 'prior consent') and found none -- only after-the-fact parent notification on request -- so classified 'allows', not 'consent_required'. District/county names agree, no city/county split issue. Struck 56 students in 2023-24 per federal CRDC; no evidence of any policy change since then. Submitted to Ground Crew as finding_2ae3979e29a3 (status pending review)."
    policy_revised: "2024-10-08"
    policy_dates_from: notes
