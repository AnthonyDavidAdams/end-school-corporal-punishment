    notes: "Columbia County School District 'CODE OF STUDENT CONDUCT 2026-2027' (title page names Keith Couey, Superintendent, Columbia County School Board, 372 West Duval Street, Lake City, Florida 32055). Linked as 'Student Code of Conduct 26-27' from https://www.columbiak12.com/135157_3 as a Google Drive file (1W3qzfapnQWKHIzlcf7PbRvO86Ms7w6Vt). Note: the NCES website value http://www.columbia.k12.fl.us does not resolve; the live district site is www.columbiak12.com. Fetched: 821,800 bytes, application/octet-stream (PDF), 59 pages; quote on page 46 (printed p.42). CLASSIFICATION: 'if agreed to by the parent' is affirmative advance parental permission, i.e. OPT-IN, so consent_required, not allows. Corporal punishment also appears as a Category Two bus-misconduct consequence 'in accordance with Board Policy 5.19' (page 52). Board Policy 5.19 itself was not reachable as a separate document. CONTACT: taken from the district's own site on 2026-09-19; email left null where the site publishes only named individuals' addresses or a web form rather than a general/superintendent's office address."
