    notes: "Suwannee County School District's own board policy manual (POLICY_MANUAL_12.9.25.pdf), found in the 'School Board' folder of the district site's Apptegy document API; the public site itself is behind an F5 'Client Challenge' (3,038-byte shell) so neither curl nor resolve_handbook can see it. fetch_document: 4,778,583 bytes, application/pdf, 808 pages; rule 5.10 Corporal Punishment read in full via pages 352-354, manual page 304. Policy history line: 'Reviewed 7/9/09; 8/25/09, 1/28/2014, 9/6/2016, 8/27/2019, 7/26/2022, 5/13/2025  Adopted: 9/22/09  Revision Date(s): 3/22/11'. Approval is 'in principle by the principal', with written explanation to the parent afterwards; no parental consent or opt-out, so 'allows'."
