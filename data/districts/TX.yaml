    nces_id: "4817610"
    status: allows
    source: https://pol.tasb.org/PolicyOnline/PolicyDetails?key=915&code=FO
    quote: Corporal punishment may be used as a discipline management technique in accordance with this policy and the Student Code of Conduct. Corporal punishment shall not be administered to a student whose parent has submitted to the principal a signed statement for the current school year prohibiting the use of corporal punishment with his or her child. The parent may reinstate permission to use corporal punishment at any time during the school year by submitting a signed statement to the principal.
    policy_code: FO(LOCAL)
    crdc_students_latest: 560
    last_verified: 2026-09-09
    notes: "Opt-out, not opt-in: a parent must submit a signed statement to the principal each school year to prohibit it, and may reinstate permission at any time. Limited to spanking or paddling; administered only by the principal or designee with a principal-approved instrument, in the presence of one other District professional employee, out of view of other students; the disciplinary record must name the administrator, the witness, and the date and time. No disability exemption appears in FO(LOCAL). Opened on TASB Policy Online (Local Policy tab of FO). Footer reads: DUMAS ISD, FO(LOCAL)-C1, UPDATE 126, DATE ISSUED: 11/11/2025. The district site (https://www.dumasisd.org/page/school-board) links the manual as 'Dumas ISD Board Policy Manual' -> https://pol.tasb.org/Home/Index/915. FO(LEGAL) on the same page cites Education Code 37.0011 (parent written opt-out). News: The Satanic Temple's Protect Children Project protested the policy outside Dumas High School on 2023-11-17 and handed out opt-out cards; the district said parents are informed annually of the policy: https://abc7amarillo.com/news/local/the-satanic-temple-protests-dumas-isds-corporal-punishment-policy-dumas-texas-paddle-spank-dumas-high-school-dumas-texas (opened). pol.tasb.org returns 403 to curl and WebFetch; it had to be read in a real browser."
    phone_policy:
      status: bell_to_bell_ban
      quote: Use a personal communication device, including a cell phone, or other electronic device on school property during the school day, and shall store the device in accordance with the method of storage established by the district. [Turned Off in Student Backpack or Campus Provided Storage System]
      source: https://files-backend.assets.thrillshare.com/documents/asset/uploaded_file/3504/Disd/5e8b6e1c-8828-4d07-b3a0-bc2853d32cc9/Final_Dumas_ISD_-_Student_Code_of_Conduct_Engl.pdf
      policy_code: Student Code of Conduct 2026-2027, General Conduct Violations, 'Possession of Personal Communication Devices' (p. 8)
      last_verified: 2026-09-09
      notes: "Listed under 'Students shall not:'. Whole-school-day prohibition with district-mandated storage (turned off in backpack or campus storage). Consequences: 1st offense device confiscated 5 school days, 2nd 10 days, 3rd until end of year, subsequent DAEP. Exceptions only for IEP/504, physician directive, or health/safety requirement. Does not name HB 1481 by number; the exception list mirrors the 2025 Texas law's exceptions."
    ai_policy:
      status: academic_integrity_only
      quote: Engage in academic dishonesty, which includes cheating or copying the work of another student, unauthorized use of artificial intelligence, plagiarism, and unauthorized communication between students during an examination.
      source: https://files-backend.assets.thrillshare.com/documents/asset/uploaded_file/3504/Disd/5e8b6e1c-8828-4d07-b3a0-bc2853d32cc9/Final_Dumas_ISD_-_Student_Code_of_Conduct_Engl.pdf
      policy_code: "Student Code of Conduct 2026-2027, General Conduct Violations, 'Miscellaneous Offenses' (p. 10-11); also 'Misuse of Technology Resources and the Internet': 'Utilize artificial intelligence in a way that would constitute academic dishonesty or as a means of engaging in any other prohibited conduct.'"
      last_verified: 2026-09-09
      notes: AI appears only as a prohibited-conduct item (academic dishonesty / misuse of technology). No acceptable-use guidance for AI in the Code.
    start_times:
      high_school:
        start: null
        end: unknown
        school: Dumas High School
