    phone_policy:
      status: bell_to_bell_ban
      quote: Use a personal communication device, including a cell phone, or other electronic device on school property during the school day and shall store the device in accordance with the method of storage established by the district.
      source: https://resources.finalsite.net/images/v1786994858/bsisdesc18net/tcg7xqznfcxufropnwcz/2026-2027BSISDStudentCodeofConduct.pdf
      policy_code: Student Code of Conduct 2026-27, 'Possession of Telecommunications or Other Electronic Devices' (p. 9); BSHS Student Handbook 2026-27, 'Cell Phone Storage'
      last_verified: 2026-09-09
      notes: "Quoted sentence sits under 'Students shall not:'. The 2026-2027 BSHS Student Handbook (https://www.bsisd.esc18.net/fs/resource-manager/view/3370e4f7-9cda-4497-a84c-3f4170f79052) adds: 'Cell phones will be powered off and left in backpacks. Cell phones will not be allowed to be carried in pant pockets, jackets, etc.' and 'In accordance with state law, the district prohibits the use of a personal communication device (such as cell phones, tablets, and smartwatches) while on school property during the school day.' Neither document names HB 1481 (searched '1481'); the handbook says 'in accordance with state law' and cites policy FNCE(LOCAL). Exceptions: IEP/504, physician directive, health or safety requirement."
    ai_policy:
      status: academic_integrity_only
      quote: Utilize artificial intelligence in a way that would constitute academic dishonesty or as a means of engaging in any other prohibited conduct.
      source: https://resources.finalsite.net/images/v1786994858/bsisdesc18net/tcg7xqznfcxufropnwcz/2026-2027BSISDStudentCodeofConduct.pdf
      policy_code: Student Code of Conduct 2026-27, 'General Conduct Violations' (misuse of technology resources)
      last_verified: 2026-09-09
      notes: "Single bullet under 'Students shall not:'; the clause also reaches 'any other prohibited conduct'. The BSHS handbook mentions AI only in the grading-policy list: 'plagiarism (including the unauthorized use of artificial intelligence (AI) such as ChatGPT)'. No stand-alone AI use policy."
