        end: 3:53
        school: Mount Pleasant Junior High School
        source: https://www.mpisd.net/wp-content/uploads/2026/08/2026-2027-Junior-High-Handbook.pdf
        quote: MPJH Bell Schedule 2026-2027 Period 7th 8th 1 8:01 – 8:53 8:05 – 8:57 ... 8 3:03 -- 3:53 3:07 -- 3:57
      notes: "MPJH runs staggered grade schedules: 7th grade 8:01-3:53, 8th grade 8:05-3:57. MPHS regular schedule (handbook Section V, p. 94) 1st period 8:05, 8th period ends 3:57."
