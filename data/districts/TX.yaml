    county: Titus
    nces_id: "4831760"
    status: allows
    source: https://pol.tasb.org/Policy/Code/1133?filter=FO
    quote: Corporal punishment may be used as a discipline management technique in accordance with this policy and the Student Code of Conduct. Corporal punishment shall not be administered to a student whose parent has submitted to the principal a signed statement for the current school year prohibiting the use of corporal punishment with his or her child. The parent may reinstate permission to use corporal punishment at any time during the school year by submitting a signed statement to the principal.
    policy_code: FO(LOCAL)
    crdc_students_latest: 239
    last_verified: 2026-09-09
    notes: "Opt-out: a parent must submit a signed statement to the principal each school year prohibiting corporal punishment, and may reinstate permission at any time. Limited to spanking or paddling, administered only by the principal or designee with an instrument approved by the principal, in the presence of one other District professional employee and out of view of other students; the student is told the reason first; the disciplinary record must include the administrator, witness, date and time. FO(LOCAL) states no disability exemption. TASB Policy Online, Mount Pleasant ISD (district key 1133), FO(LOCAL)-C1, UPDATE 126, DATE ISSUED: 11/11/2025. The same page carries FO(LEGAL) quoting Education Code 37.0011 (parent's written, signed statement prohibits corporal punishment; must be provided each school year). Link to Policy Online found on the district homepage https://www.mpisd.net/ (http://pol.tasb.org/Home/Index/1133)."
    phone_policy:
      status: bell_to_bell_ban
      quote: Use a personal communication device, including a cell phone, or other electronic device on school property during the school day
      source: https://www.mpisd.net/wp-content/uploads/2026/08/26-27-Student-Code-of-Conduct.pdf
      policy_code: Student Code of Conduct 2026-2027, General Conduct Violations, 'Possession of Telecommunications or Other Electronic Devices' (p. 8)
      last_verified: 2026-09-09
      notes: "Listed under 'Students shall not:'. Exceptions only for IEP/504, physician directive, or health/safety requirement. The 2026-2027 MPHS Student Handbook (p. 56) states: 'In accordance with state law, the district prohibits the use of a personal communication device (such as cell phones, tablets, and smartwatches) while on school property during the school day.' and refers to FNCE(LOCAL). HB 1481 is not named by number."
    ai_policy:
      status: academic_integrity_only
      quote: Unauthorized use of artificial intelligence (AI) tools to generate or substantially complete assignments, projects, or assessments is considered academic dishonesty and may result in academic and/or disciplinary consequences consistent with district policy and the Student Code of Conduct.
      source: https://www.mpisd.net/wp-content/uploads/2026/08/2026-2027-Junior-High-Handbook.pdf
      policy_code: Mount Pleasant Junior High School Student Handbook 2026-2027, 'Grading Policies' (p. 26)
      last_verified: 2026-09-09
      notes: The district Code of Conduct and the MPHS handbook are silent on AI (searched 'artificial intelligence', 'AI', 'A.I.', 'ChatGPT', 'generative'); the Code's academic dishonesty item lists cheating, plagiarism and unauthorized communication only. The junior high handbook is the only MPISD document found that addresses AI, and only as academic dishonesty.
    start_times:
