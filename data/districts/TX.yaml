    source: https://pol.tasb.org/PolicyOnline/PolicyDetails?key=786&code=FO
    quote: Corporal punishment may be used as a discipline management technique in accordance with this policy and the Student Code of Conduct. Corporal punishment shall not be administered to a student whose parent has submitted to the principal a signed statement for the current school year prohibiting the use of corporal punishment with his or her child. The parent may reinstate permission to use corporal punishment at any time during the school year by submitting a signed statement to the principal.
    last_verified: 2026-09-18
    legacy_status: allows
    notes: "Confirms the legacy 'allows' value with a source and quote. Opt-out, not opt-in: a parent must submit a signed statement to the principal each school year to prohibit it and may reinstate permission at any time. Guidelines: limited to spanking or paddling; the student is told the reason first; administered only by the principal or designee; instrument approved by the principal; administered in the presence of one other District professional employee in a designated place out of view of other students. No same-sex-administrator clause. Disciplinary record must include the administrator, the witness, and the date and time. No disability exemption in FO(LOCAL); FO(LEGAL) carries the Education Code 37.0011 parent-statement text. Read on TASB Policy Online, Paris ISD Board Policy Manual key=786 (https://pol.tasb.org/Home/Index/786). Footer: UPDATE 126, DATE ISSUED: 11/10/2025. Student handbook and Code of Conduct not opened this run, so phone, AI and bell-schedule fields are not filled. NCES district ID per a Wikipedia citation is 4834290; left null pending NCES CCD confirmation."
