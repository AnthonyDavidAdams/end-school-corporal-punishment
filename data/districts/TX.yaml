    phone_policy:
      status: bell_to_bell_ban
      quote: Use a personal communication device, including a cell phone, or other electronic device on school property during the school day, and shall store the device in accordance with the method of storage established by the district. [Turned Off in Student Backpack or Campus Provided Storage System]
      source: https://files-backend.assets.thrillshare.com/documents/asset/uploaded_file/3504/Disd/5e8b6e1c-8828-4d07-b3a0-bc2853d32cc9/Final_Dumas_ISD_-_Student_Code_of_Conduct_Engl.pdf
      policy_code: Student Code of Conduct 2026-2027, General Conduct Violations, 'Possession of Personal Communication Devices' (p. 8)
      last_verified: 2026-09-09
      notes: "Listed under 'Students shall not:'. Whole-school-day prohibition with district-mandated storage (turned off in backpack or campus storage). Consequences: 1st offense device confiscated 5 school days, 2nd 10 days, 3rd until end of year, subsequent DAEP. Exceptions only for IEP/504, physician directive, or health/safety requirement. Does not name HB 1481 by number; the exception list mirrors the 2025 Texas law's exceptions."
    ai_policy:
      status: academic_integrity_only
      quote: Engage in academic dishonesty, which includes cheating or copying the work of another student, unauthorized use of artificial intelligence, plagiarism, and unauthorized communication between students during an examination.
      source: https://files-backend.assets.thrillshare.com/documents/asset/uploaded_file/3504/Disd/5e8b6e1c-8828-4d07-b3a0-bc2853d32cc9/Final_Dumas_ISD_-_Student_Code_of_Conduct_Engl.pdf
      policy_code: "Student Code of Conduct 2026-2027, General Conduct Violations, 'Miscellaneous Offenses' (p. 10-11); also 'Misuse of Technology Resources and the Internet': 'Utilize artificial intelligence in a way that would constitute academic dishonesty or as a means of engaging in any other prohibited conduct.'"
      last_verified: 2026-09-09
      notes: AI appears only as a prohibited-conduct item (academic dishonesty / misuse of technology). No acceptable-use guidance for AI in the Code.
