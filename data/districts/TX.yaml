    notes: "Opt-out only: not administered to a student whose parent has submitted to the principal a signed statement for the current school year prohibiting it; the parent may reinstate permission at any time by signed statement. Limited to spanking or paddling, administered only by the principal or designee (a female principal or designee when the student is female), with one other District professional employee present, out of view of other students; the disciplinary record must include the administrator, witness, date and time. No disability exemption in FO(LOCAL); FO(LEGAL) carries the Education Code 37.0011 opt-out text. TASB Policy Online, Big Spring ISD Board Policy Manual key=685 (linked from https://www.bsisd.esc18.net/about-bsisd/board-of-trustees as 'Board Policy Manual'). FO(LOCAL)-X, UPDATE 126, DATE ISSUED: 10/17/2025. Guidelines text: 'Corporal punishment shall be limited to spanking or paddling the student and shall be administered in accordance with the following guidelines: The student shall be told the reason corporal punishment is being administered. Corporal punishment shall be administered only by the principal or designee, and, when the student is female, only by a female principal or designee. The instrument to be used in administering corporal punishment shall be approved by the principal. Corporal punishment shall be administered in the presence of one other District professional employee and in a designated place out of view of other students.' The 2026-2027 BSISD Student Code of Conduct (https://resources.finalsite.net/images/v1786994858/bsisdesc18net/tcg7xqznfcxufropnwcz/2026-2027BSISDStudentCodeofConduct.pdf, p.12 'Discipline Management Techniques') lists: 'Corporal punishment, unless the student’s parent or guardian has provided a signed statement prohibiting its use.' and under Prohibited Aversive Techniques: 'Using techniques designed or likely to cause physical pain, other than corporal punishment as permitted by district policy. [See policy FO(LOCAL).]' District office: 708 East 11th Place, Big Spring, TX 79720. Board agendas/minutes: https://meetings.boardbook.org/Public/Organization/723."
