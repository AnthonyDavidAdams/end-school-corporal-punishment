        start: 8:05
        end: 3:57
        school: Mount Pleasant High School
        source: https://www.mpisd.net/wp-content/uploads/2026/08/updated26-27MPHShandbook.pdf
        quote: Regular Schedule 50 minute 1st-8:05-8:55 ... 8th – 3:07-3:57
      middle_school:
