    nces_id: "4827780"
    status: allows
    source: https://pol.tasb.org/PolicyOnline/PolicyDetails?key=1001&code=FO
    quote: Corporal punishment may be used as a discipline management technique in accordance with this policy and the Student Code of Conduct. Corporal punishment shall not be administered to a student whose parent has submitted to the principal a signed statement for the current school year prohibiting the use of corporal punishment with his or her child. The parent may reinstate permission to use corporal punishment at any time during the school year by submitting a signed statement to the principal.
    policy_code: FO(LOCAL)
    crdc_students_latest: 161
    last_verified: 2026-09-09
    notes: "Opt-out only: not administered to a student whose parent has submitted to the principal a signed statement for the current school year prohibiting it; the parent may reinstate permission at any time by signed statement. Limited to spanking or paddling, administered only by the principal or designee, with one other District professional employee present, in a designated place out of view of other students; the disciplinary record must include the administrator, witness, date and time. No disability exemption in FO(LOCAL); FO(LEGAL) carries the Education Code 37.0011 opt-out text. TASB Policy Online, Livingston ISD Board Policy Manual key=1001 (linked from https://www.livingstonisd.com/135616_2, the School Board page, as 'Board Policy Manual' https://pol.tasb.org/PolicyOnline?key=1001). FO(LOCAL)-C1, UPDATE 126, DATE ISSUED: 10/9/2025. Guidelines text: 'Corporal punishment shall be limited to spanking or paddling the student and shall be administered in accordance with the following guidelines: The student shall be told the reason corporal punishment is being administered. Corporal punishment shall be administered only by the principal or designee. The instrument to be used in administering corporal punishment shall be approved by the principal. Corporal punishment shall be administered in the presence of one other District professional employee and in a designated place out of view of other students.' Unlike Big Spring's FO(LOCAL), there is no same-sex-administrator clause. No student handbook or code of conduct PDF was located on livingstonisd.com this run. District office: 1412 South Houston Ave., Livingston, TX 77351. Board agendas/minutes: https://meetings.boardbook.org/Public/Organization/1664."
    phone_policy:
      status: bell_to_bell_ban
      quote: In accordance with state law, the district prohibits the use of a personal communication device (such as cell phones, tablets, and smartwatches) while on school property during the school day. [...] House Bill 1481, enacted in Texas, prohibits students from using "personal communication devices" during school hours on school property. [...] Designated storage areas will include student backpacks, provided the device(s) are powered off. Use of personal communication devices in restrooms and locker rooms is strictly prohibited.
      source: https://files.smartsites.parentsquare.com/4183/2026-2027_student_handbook_english.pdf
      policy_code: Student Handbook 2026-27, 'Possession and Use of Personal Communications Devices, Including Cell Phones and Other Electronic Devices' (p. 67-68); Student Code of Conduct 2026-27 p. 9; policy FNCE(LOCAL)
      last_verified: 2026-09-09
      notes: "Cites Texas HB 1481 by name. 'Administration may grant permission during lunch periods or in emergency situations outside of the classroom.' Four-step consequence ladder ending in daily office lock-up of the device for the rest of the year. Code of Conduct: 'Use a personal communication device, including a cell phone, or other electronic device on school property during the school day and shall store the device in accordance with the method of storage established by the district.'"
    ai_policy:
      status: academic_integrity_only
      quote: Utilize artificial intelligence in a way that would constitute academic dishonesty or as a means of engaging in any other prohibited conduct.
      source: https://files.smartsites.parentsquare.com/4183/2026-2027_student_handbook_english.pdf
      policy_code: Student Code of Conduct 2026-27, 'General Conduct Violations'
      last_verified: 2026-09-09
      notes: "Also listed among grading-policy items: 'unauthorized use of artificial intelligence, plagiarism'. No stand-alone AI policy in the handbook (searched 'artificial intelligence', 'AI', 'ChatGPT', 'generative')."
    start_times:
      high_school:
        start: 8:00
        end: 3:45
        school: Livingston High School
        source: https://files.smartsites.parentsquare.com/4183/2026-2027_student_handbook_english.pdf
        quote: High School Campus 8:00 AM - 3:45 PM
      middle_school:
        start: 8:00
        end: 3:45
        school: Livingston Junior High
        source: https://files.smartsites.parentsquare.com/4183/2026-2027_student_handbook_english.pdf
        quote: Junior High Campus 8:00 AM – 3:45 PM
      notes: "From 'Daily School Schedule' in the Student Handbook (PDF p. 5): 'Grades K-5th PRP & Elem. Campuses 7:30 – 3:15; Grades 6th-12th Junior High Campus 8:00 AM – 3:45 PM, High School Campus 8:00 AM - 3:45 PM'."
