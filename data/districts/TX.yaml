    status: allows
    source: https://pol.tasb.org/PolicyOnline/PolicyDetails?key=685&code=FO
    quote: Corporal punishment may be used as a discipline management technique in accordance with this policy and the Student Code of Conduct. Corporal punishment shall not be administered to a student whose parent has submitted to the principal a signed statement for the current school year prohibiting the use of corporal punishment with his or her child. The parent may reinstate permission to use corporal punishment at any time during the school year by submitting a signed statement to the principal.
    policy_code: FO(LOCAL)
    crdc_students_latest: 180
    last_verified: 2026-09-09
    notes: "Opt-out only: not administered to a student whose parent has submitted to the principal a signed statement for the current school year prohibiting it; the parent may reinstate permission at any time by signed statement. Limited to spanking or paddling, administered only by the principal or designee (a female principal or designee when the student is female), with one other District professional employee present, out of view of other students; the disciplinary record must include the administrator, witness, date and time. No disability exemption in FO(LOCAL); FO(LEGAL) carries the Education Code 37.0011 opt-out text. TASB Policy Online, Big Spring ISD Board Policy Manual key=685 (linked from https://www.bsisd.esc18.net/about-bsisd/board-of-trustees as 'Board Policy Manual'). FO(LOCAL)-X, UPDATE 126, DATE ISSUED: 10/17/2025. Guidelines text: 'Corporal punishment shall be limited to spanking or paddling the student and shall be administered in accordance with the following guidelines: The student shall be told the reason corporal punishment is being administered. Corporal punishment shall be administered only by the principal or designee, and, when the student is female, only by a female principal or designee. The instrument to be used in administering corporal punishment shall be approved by the principal. Corporal punishment shall be administered in the presence of one other District professional employee and in a designated place out of view of other students.' The 2026-2027 BSISD Student Code of Conduct (https://resources.finalsite.net/images/v1786994858/bsisdesc18net/tcg7xqznfcxufropnwcz/2026-2027BSISDStudentCodeofConduct.pdf, p.12 'Discipline Management Techniques') lists: 'Corporal punishment, unless the student’s parent or guardian has provided a signed statement prohibiting its use.' and under Prohibited Aversive Techniques: 'Using techniques designed or likely to cause physical pain, other than corporal punishment as permitted by district policy. [See policy FO(LOCAL).]' District office: 708 East 11th Place, Big Spring, TX 79720. Board agendas/minutes: https://meetings.boardbook.org/Public/Organization/723."
    phone_policy:
      status: bell_to_bell_ban
      quote: Use a personal communication device, including a cell phone, or other electronic device on school property during the school day and shall store the device in accordance with the method of storage established by the district.
      source: https://resources.finalsite.net/images/v1786994858/bsisdesc18net/tcg7xqznfcxufropnwcz/2026-2027BSISDStudentCodeofConduct.pdf
      policy_code: Student Code of Conduct 2026-27, 'Possession of Telecommunications or Other Electronic Devices' (p. 9); BSHS Student Handbook 2026-27, 'Cell Phone Storage'
      last_verified: 2026-09-09
      notes: "Quoted sentence sits under 'Students shall not:'. The 2026-2027 BSHS Student Handbook (https://www.bsisd.esc18.net/fs/resource-manager/view/3370e4f7-9cda-4497-a84c-3f4170f79052) adds: 'Cell phones will be powered off and left in backpacks. Cell phones will not be allowed to be carried in pant pockets, jackets, etc.' and 'In accordance with state law, the district prohibits the use of a personal communication device (such as cell phones, tablets, and smartwatches) while on school property during the school day.' Neither document names HB 1481 (searched '1481'); the handbook says 'in accordance with state law' and cites policy FNCE(LOCAL). Exceptions: IEP/504, physician directive, health or safety requirement."
    ai_policy:
      status: academic_integrity_only
      quote: Utilize artificial intelligence in a way that would constitute academic dishonesty or as a means of engaging in any other prohibited conduct.
      source: https://resources.finalsite.net/images/v1786994858/bsisdesc18net/tcg7xqznfcxufropnwcz/2026-2027BSISDStudentCodeofConduct.pdf
      policy_code: Student Code of Conduct 2026-27, 'General Conduct Violations' (misuse of technology resources)
      last_verified: 2026-09-09
      notes: "Single bullet under 'Students shall not:'; the clause also reaches 'any other prohibited conduct'. The BSHS handbook mentions AI only in the grading-policy list: 'plagiarism (including the unauthorized use of artificial intelligence (AI) such as ChatGPT)'. No stand-alone AI use policy."
