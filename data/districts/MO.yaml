    notes: "DEAD END, needs one Simbli read. What the next contributor should open: https://simbli.eboardsolutions.com/Policy/PolicyListing.aspx?S=151 and find the corporal punishment policy (Missouri MSBA code is normally JGA; match on TITLE, not the code). The site number 151 is confirmed: the district's District Information page (https://holcombschools.com/district-information-189/) links 'School Board Policy' to exactly that URL, and the page title returned is 'Policy Listing | Holcomb R-III'. fetch_simbli_policy for site 151 was called roughly 30 times over about three and a half hours, spaced 45 to 240 seconds apart, with and without terms and once with code JGA; every call that returned anything returned Imperva's bot-challenge message, and the rest timed out. The block was not specific to this district (site 4093 failed identically and interleaved) and it never cleared. Filed as bug issue_bf315135987e on the crew server. The district publishes nothing else: holcomb.k12.mo.us (the NCES address) no longer resolves to a served site, and the live site https://holcombschools.com has no student handbook or code of conduct anywhere. Places searched on it: the home page's complete link list, the WordPress site search for 'handbook' (only the site's own pages) and for 'corporal' (no results), /district-information-189/, /public-notice/, /non-discrimination/, /504-2/, /contact/ and the wp-content/uploads PDFs, which are only the bullying incident report form, ESEA complaint procedures, ESEA schoolwide plan, CSIP plan, the June 30 2025 audit and a quarterly financial report. resolve_handbook returned nothing for the NCES website. The district reported 41 students struck in 2023-24, so a policy almost certainly exists; it is simply behind the vendor's bot wall."
