  notes: 'Source is the district''s elementary student handbook, posted in the district Documents > HANDBOOKS folder as ''Elementary Student Handbook 26-27''; the file itself is titled ''Handbook 2025-2026''. fetch_document: application/pdf, 1,667,511 bytes, 63 pages, text layer present; the quoted sentence is on page 18 under ''Definitions of Discipline''. The handbook also states on page 10 that ''A complete manuscript of the District Discipline Code and corporal punishment guidelines are contained in the Malden R-I School District Policy Manual'' and cites policies JG-R1, JGA, JGB, JGD, JGE, JGF. Refusal by student or parent is answered with out-of-school suspension, not consent in advance, so this is ''allows'', not ''consent_required''. The underlying board policy manual is on Simbli (the district links to simbli.eboardsolutions.com/mo/maldenr1); Simbli''s Imperva bot protection refused both the project''s fetch_simbli_policy tool and a browser throughout this session, so the board policy text itself was not read. The district''s separate ''JH and HS Student Handbook 2026-2027'' (69 pages) contains no mention of corporal punishment.'
