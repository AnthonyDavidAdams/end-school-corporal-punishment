  - name: Benton School District
    county: Grafton
    nces_id: "3301830"
    status: allows
    source: https://core-docs.s3.amazonaws.com/documents/asset/uploaded_file/1357/BSD/2175838/2022-2023_Benton_Student_Handbook.pdf
    quote: CORPORAL PUNISHMENT Elementary and Benton Middle School Corporal punishment may be administered by any certified employee of the District for disruptive or unmanageable conduct, insubordination, profane, violent, vulgar, or insulting language or other conduct that would tend to disrupt the educational process.
    policy_code: null
    crdc_students_latest: null
    last_verified: 2026-09-25
    method: searched_document
    parent_control: opt_out
    quotes:
      - CORPORAL PUNISHMENT Elementary and Benton Middle School Corporal punishment may be administered by any certified employee of the District for disruptive or unmanageable conduct, insubordination, profane, violent, vulgar, or insulting language or other conduct that would tend to disrupt the educational process.
      - Corporal punishment is authorized immediately for those acts of misconduct that are so disruptive in nature as to shock the conscience;
      - otherwise, corporal punishment shall not be administered unless an attempt has been made to modify the student’s behavior by some other means, and unless the student has been told that a continuation or repetition of the behavior may lead to corporal punishment.
      - Refusal to take corporal punishment may result in suspension.
      - Parents who prefer suspension rather than corporal punishment may sign a discipline form that is available in the principal’s office.
