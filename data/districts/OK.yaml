    quote: Prohibiting the Use of Corporal Punishment Corporal punishment — spanking or paddling a student — may be used as a discipline management technique in accordance with the Student Code of Conduct and district policy FO(LOCAL).
    policy_code: null
    crdc_students_latest: null
    last_verified: 2026-09-25
    method: searched_document
    parent_control: opt_out
    quotes:
      - Prohibiting the Use of Corporal Punishment Corporal punishment — spanking or paddling a student — may be used as a discipline management technique in accordance with the Student Code of Conduct and district policy FO(LOCAL).
      - However, in accordance with law, the district may not administer corporal punishment if a student’s parent submits a signed, written statement prohibiting its use.
      - A parent who does not want corporal punishment administered to their child must submit a written statement to the campus principal stating this decision.
      - • District personnel may use discipline methods other than corporal punishment if a parent requests that corporal punishment not be used.
      - • If the district knows that a student is in temporary or permanent custody of the state (through foster care, kinship care, or other arrangements), corporal punishment will not be administered, even when the student’s caregiver or caseworker has not submitted a signed statement prohibiting its use.
