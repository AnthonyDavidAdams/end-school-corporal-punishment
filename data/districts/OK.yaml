    quote: While corporal punishment is not prohibited by the Board of Education, it is recommended for use as a final measure.
    policy_code: null
    crdc_students_latest: 52
    last_verified: 2026-09-19
    contact:
      district_email: pturner@krebs.k12.ok.us
      phone: 918-426-4700
      mailing_address: Krebs Public School, P.O. Box 67, 20 SW 5th, Krebs, OK 74554
      board_page: https://krebs.k12.ok.us/board-of-education
      contact_page: https://krebs.k12.ok.us/board-of-education
      as_of: 2026-09-19
    notes: "Source is the district's '26 27 Krebs Student Handbook', the only handbook the district publishes, linked from https://krebs.k12.ok.us/krebs-student-handbook. It is a Word .docx, not a PDF: curl returned HTTP 200, content-type application/vnd.openxmlformats-officedocument.wordprocessingml.document, 110,772 bytes. The project's fetch_document downloaded the same file but its extractor treated the .docx as plain text (extracted_by 'text', 105,209 characters of binary) and found no term hits, so the quote is supplied in source_text; the text here was extracted locally from word/document.xml. The section is headed CORPORAL PUNISHMENT, with no section number. It also states 'The disciplinary response for use of profane or obscene language by students will be corporal punishment' and offers out-of-school suspension as the alternative if a parent declines, i.e. opt-out, not consent in advance."
