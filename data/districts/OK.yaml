  - name: Idabel
    county: Idabel
    nces_id: "4015370"
    status: consent_required
    source: https://files-backend.assets.thrillshare.com/documents/asset/uploaded_file/282/Ims/87504849-4ba7-452f-b870-a8d643a3870f/Student_Handbook_2025-26__1_.pdf
    quote: While the Idabel School Board recognizes the need for firmness in disciplinary action, corporal punishment will only be used as a last resort, and only with a signed release form on file.
    policy_code: C. Corporal Punishment
    crdc_students_latest: 37
    last_verified: 2026-09-19
    contact:
      phone: 580-286-7639
      mailing_address: Idabel Public Schools, 200 NE Ave C, Idabel, OK 74745
      contact_page: https://www.idabelps.org/page/contact-us
      as_of: 2026-09-19
    notes: "OPT-IN district. Source is the Student Handbook 2025-2026 published on the Idabel Public Schools website under Idabel Middle School's documents; its cover page reads 'Student Handbook / Idabel Middle School / 2025-2026' and it contains an 'Idabel School District Resolution' section, and the corporal punishment paragraph speaks for the district board ('the Idabel School Board'). fetch_document: application/pdf, 1,469,686 bytes, 69 pages, text layer present; the quoted sentence is on page 21, under DISCIPLINE, heading 'C. Corporal Punishment'. Corporal punishment appears in the Class 1 and Class 2 consequence ladders on page 22 ('1st Offense: Conference and/or Corporal Punishment'), and the policy adds it 'will be administered for class I and II offenses only, and will be administered by the Principal and his/her designee to both male and female students.' Caveat for the reviewer: the district-level documents that would state this for the whole district - 'Student Behavior.pdf' and 'Discipline.pdf' in the district's Documents folders - are image-only scans (fetch_document returned needs_ocr true, 0 characters of text, 485,073 and 1,471,265 bytes), so the school-level handbook is the only machine-readable district-published statement found. No adoption or revision date is printed."
