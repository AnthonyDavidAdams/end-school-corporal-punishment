      contact_page: https://www.harvestprep.com/contact-us/
      public_comment: "Contact page states: 'Pursuant to A.R.S. §38-431.02, Harvest Power Community Development Group, Inc, dba Harvest Preparatory Academy hereby states that all notices of the meeting...' Meeting notices are posted at harvestprep.com/district-meeting-notices. No public-comment sign-up procedure is published."
