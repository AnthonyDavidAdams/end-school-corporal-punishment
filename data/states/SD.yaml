code: SD
name: "South Dakota"
status: banned
year_banned: 1990
private_schools_covered: null
statute: "S.D. Codified Laws § 13-32-2 (as rewritten by SL 1990, ch. 128; no express prohibition, see notes)"
statute_url: "https://sdlegislature.gov/Statutes/13-32-2"
statute_quote: "Superintendents, principals, supervisors, and teachers and their aids and assistants, have the authority, to use the physical force that is reasonable and necessary for supervisory control over students."
limits: []
notes: "No statute expressly prohibits corporal punishment. SL 1990, ch. 128 rewrote SDCL § 13-32-2 to authorize only the physical force that is reasonable and necessary for supervisory control over students, removing the former authority to punish; South Dakota is treated as banned on that basis."
sources:
  - https://sdlegislature.gov/Statutes/13-32-2
last_verified: 2026-10-12
