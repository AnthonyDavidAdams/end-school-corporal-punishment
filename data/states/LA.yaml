notes: "Louisiana is the clearest opt-in state: since August 2023 a school may not paddle without the parent's signed annual consent on the state form. A 2022 survey found 27 systems prohibiting and 19 allowing of 46 responding. 264 students in 2021-22; 65 in 2023-24. No bill in 2025 or 2026."
