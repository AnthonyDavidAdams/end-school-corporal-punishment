statute: "70 O.S. \u00a7 24-100.4(C) (teacher has a parent's right to discipline 'according to district policies'; formerly \u00a7 6-114); 21 O.S. \u00a7 844 ('spanking, switching or paddling'); 70 O.S. \u00a7 13-116 (disability ban, SB 364, 2025)"
statute_url: "https://www.oklegislature.gov/OK_Statutes/CompleteTitles/os70.pdf"
limits:
  - "No corporal punishment on any student identified with a disability under IDEA (SB 364, Laws 2025 ch. 99; law without the governor's signature May 8, 2025; effective about August 28, 2025 by constitutional default since the emergency clause failed)"
  - "70 O.S. \u00a7 24-100.4(D): the State Board may not proscribe corporal punishment except for IEP students, so Kentucky's regulatory route is closed by statute in Oklahoma"
  - "No statewide consent, witness, instrument or record rules"
