notes: "1,458 students in 2021-22 (991 in 2023-24); fourth-highest rate. American Indian/Alaska Native students were 24 percent of those struck in 2017-18. Bills carried by Republicans without an outside coalition. Note the statutory bar on State Board rulemaking: the Kentucky regulation route is unavailable here without a statute change."
