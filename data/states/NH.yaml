code: NH
name: "New Hampshire"
status: banned
year_banned: 2022
private_schools_covered: null
statute: "RSA 161:14 (2022, 2:1); RSA 627:6, II(a) (no express prohibition in Title XV, see notes)"
statute_url: "https://www.gc.nh.gov/rsa/html/XII/161/161-14.htm"
statute_quote: "Each state agency shall provide in its policies and procedures related to children that all forms of corporal punishment are prohibited."
limits: []
notes: "No education statute expressly prohibits corporal punishment in public schools, and the Department of Education's Ed 300 rules do not mention it. RSA 161:14 (2022, 2:1, effective March 27, 2022) requires every state agency serving children to prohibit all forms of corporal punishment in its policies and defines 'agency' to include any public or private entity under contract or agreement with the Department of Education to provide services to children; the Criminal Code's justification for teachers, RSA 627:6, II(a), permits necessary force only when a minor creates a disturbance, refuses to leave the premises, or to prevent injury. year_banned reflects RSA 161:14; before 2022 the state had no express prohibition and no reported use."
sources:
  - https://www.gc.nh.gov/rsa/html/XII/161/161-14.htm
  - https://gc.nh.gov/rsa/html/LXII/627/627-6.htm
