code: NJ
name: "New Jersey"
status: banned
year_banned: 1867
private_schools_covered: null
statute: "N.J. Stat. Ann. § 18A:6-1 (L.1967, c.271)"
statute_url: "https://lis.njleg.state.nj.us/nxt/gateway.dll?f=templates&fn=default.htm&vid=Publish:10.1048/Enu"
statute_quote: "No person employed or engaged in a school or educational institution, whether public or private, shall inflict or cause to be inflicted corporal punishment upon a pupil attending such school or institution; but any such person may, within the scope of his employment, use and apply such amounts of force as is reasonable and necessary: (1) to quell a disturbance, threatening physical injury to others; (2) to obtain possession of weapons or other dangerous objects upon the person or within the control of a pupil; (3) for the purpose of self-defense; and (4) for the protection of persons or property; and such acts, or any of them, shall not be construed to constitute corporal punishment within the meaning and intendment of this section."
limits: []
notes: "First state to ban. Banned in both public and private schools"
sources:
  - https://lis.njleg.state.nj.us/nxt/gateway.dll?f=templates&fn=default.htm&vid=Publish:10.1048/Enu
