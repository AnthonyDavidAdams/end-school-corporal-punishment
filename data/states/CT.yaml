code: CT
name: "Connecticut"
status: banned
year_banned: 1989
private_schools_covered: null
statute: "Conn. Gen. Stat. § 53a-18(a)(6) (P.A. 89-186; no express prohibition in Title 10)"
statute_url: "https://www.cga.ct.gov/current/pub/chap_951.htm#sec_53a-18"
statute_quote: "A teacher or other person entrusted with the care and supervision of a minor for school purposes may use reasonable physical force upon such minor when and to the extent such teacher or other person reasonably believes such force to be necessary to (A) protect such teacher, other person or others from immediate physical injury, (B) obtain possession of a dangerous instrument or controlled substance, as defined in section 21a-240, upon or within the control of such minor, (C) protect property from physical damage, or (D) restrain such minor or remove such minor to another area, to maintain order."
limits: []
notes: "No education statute expressly prohibits corporal punishment. The Penal Code's justification for school personnel, Conn. Gen. Stat. § 53a-18(a)(6) (added by P.A. 89-186 in 1989), permits reasonable force only to protect persons, seize a dangerous instrument or drugs, protect property, or restrain or remove a student, and § 53a-18(a)(1) excludes persons supervising a minor for school purposes from the parental discipline justification; Connecticut is treated as banned on that basis."
sources:
  - https://www.cga.ct.gov/current/pub/chap_951.htm#sec_53a-18
last_verified: 2026-10-12
