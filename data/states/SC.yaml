notes: "Unchanged since 1973: each district's governing body 'may provide corporal punishment for any pupil that it deems just and proper.' No statutory limits and no State Board regulation. 85 students in 2021-22, 23 in 2017-18. No bill on school corporal punishment filed in the 2023-24 or 2025-26 sessions. District-by-district status unverified; an Island Packet explainer of September 18, 2025 likely has a tally."
