notes: "Highest per-capita use in the nation: 3,678 students in 2021-22 (8.3 per 1,000), 20,309 in 2017-18. Students with disabilities struck fell from 3,304 to 30 after the 2019 law, though Mississippi Today reported 211 paddlings of students with disabilities after the ban. Twelve bills in four sessions, three per year from the same three sponsors (a Democratic full ban in each chamber and a Republican opt-in), have all died in committee without a hearing. February 2025: an East Jasper third-grader's arm was broken during a paddling the mother had approved; no action found."
