notes: "17 of 67 districts reported 516 instances in 2023-24 (Suwannee 74, Holmes 65, Calhoun 59, Columbia 50, Wakulla 45, Washington 43); 647 students in the 2021-22 federal count. Districts that still permit it are coded consent_required. The consent law came from a four-year University of Florida student campaign after a disability-only ban was blocked. Hendry County banned it in 2021 after a principal was filmed paddling a six-year-old."
