statute: "Fla. Stat. \u00a7 1003.32(1)(k) (teacher authority per board policy) and \u00a7 1002.20(4)(c) (as amended by CS/HB 1255, 2025, ch. 2025-110)"
statute_url: "https://www.flsenate.gov/Laws/Statutes/2026/1002.20"
limits:
  - "Since July 1, 2025 a board that authorizes it must require parental consent, for the school year or before each instance (the statute says 'consent,' not 'written consent'); the board must review the policy at a public meeting every three years or the authorization expires; charters must comply (\u00a7 1002.33(16)(b)17)"
  - "Principal approval in principle and principal guidelines; another adult present and informed of the reason; written explanation to the parent on request (\u00a7 1003.32(1)(k))"
  - "No disability ban"
