notes: "The state education department's general counsel (May 2025): 'there are no state laws that address corporal punishment' for K-12. The Kansas Association of School Boards model policy JDA says corporal punishment 'shall not be permitted,' adopted by many districts. Zero students reported in 2017-18, 2020-21 and 2021-22. No bill 2023-26. Kept as 'legal' because nothing prohibits it; effectively unused."
