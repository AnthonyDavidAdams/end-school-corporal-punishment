notes: "Largest absolute use: 7,324 students in 2021-22 and 5,359 in 2023-24; 13,892 in 2017-18. IDRA counted 468 districts with corporal punishment policies in 2017-18. Overton ISD, 2023: a principal's assault charge for a bruising paddling was dismissed because district policy was followed and the mother consented. Millsap ISD, 2025: indictments over staff striking an autistic student (abuse, not sanctioned paddling)."
