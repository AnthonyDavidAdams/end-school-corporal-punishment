code: OH
name: "Ohio"
status: banned
year_banned: 2009
private_schools_covered: null
statute: "Ohio Rev. Code § 3319.41(A)"
statute_url: "https://codes.ohio.gov/ohio-revised-code/section-3319.41"
statute_quote: "No person employed or engaged as a teacher, principal, administrator, nonlicensed school employee, or bus driver in a public school may inflict or cause to be inflicted corporal punishment as a means of discipline upon a pupil attending such school."
limits: []
notes: "Enforcement began October 15, 2009"
