code: RI
name: "Rhode Island"
status: banned
year_banned: 1977
private_schools_covered: null
statute: "200-RICR-20-30-2 § 2.2(A)(6)(a) (Council on Elementary and Secondary Education, Physical Restraint Regulations)"
statute_url: "https://rules.sos.ri.gov/regulations/part/200-20-30-2"
statute_quote: "Corporal punishment as defined shall not be used in public education programs."
limits: []
notes: "Banned by Board of Regents / Council on Elementary and Secondary Education regulation, not statute. The current codification is 200-RICR-20-30-2 (Physical Restraint Regulations; effective 01/24/2006, refiled 2018 and 2022), § 2.2(A)(6)(a); no section of R.I. Gen. Laws Title 16 expressly prohibits corporal punishment."
