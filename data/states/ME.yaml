code: ME
name: "Maine"
status: banned
year_banned: 1975
private_schools_covered: null
statute: "17-A M.R.S. § 106(2) (Criminal Code justification; no express prohibition, see notes)"
statute_url: "https://legislature.maine.gov/statutes/17-A/title17-Asec106.html"
statute_quote: "A teacher or other person entrusted with the care or supervision of a person for special and limited purposes is justified in using a reasonable degree of nondeadly force against any such person who creates a disturbance when and to the extent that the teacher or other entrusted person reasonably believes it necessary to control the disturbing behavior or to remove a person from the scene of such disturbance."
limits: []
notes: "Early adopter. No education statute expressly prohibits corporal punishment (Title 20-A chapter 201 has no such section). The Criminal Code's justification for teachers, 17-A M.R.S. § 106(2) (enacted 1975), permits reasonable nondeadly force only to control a disturbance or remove a student, and 20-A M.R.S. § 4009(1) limits civil immunity the same way; Maine is treated as banned on that basis."
sources:
  - https://legislature.maine.gov/statutes/17-A/title17-Asec106.html
  - https://legislature.maine.gov/statutes/20-A/title20-Asec4009.html
